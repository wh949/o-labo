<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>O-LABO 管理</title>
<link rel="icon" href="favicon.ico" sizes="any">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root{
  color-scheme:light dark;
  --leaf:#0f7a3f;        /* ロゴの緑 */
  --leaf-soft:#e3f1e8;
  --ink:#16201a;
  --ink-soft:#5d6b62;
  --line:#d6ddd8;
  --paper:#f6f8f6;
  --panel:#ffffff;
  --danger:#b3261e;
  --danger-soft:#fbe9e7;
  --warn:#8a5a00;
  --warn-soft:#fff4dc;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#e6ece8; --ink-soft:#9aa8a0; --line:#2c3831;
    --paper:#111713; --panel:#18201b;
    --leaf-soft:#173323; --danger-soft:#3a1715; --warn-soft:#332a14;
  }
}
*{ box-sizing:border-box; }
html,body{ margin:0; background:var(--paper); color:var(--ink);
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif; font-size:14px; line-height:1.6; }
body{ padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0); }
button,input,select,textarea{ font:inherit; color:inherit; }
a{ color:var(--leaf); }

/* 上部の帯：本体と取り違えないよう、管理画面だと一目で分かる色にする */
.bar{
  position:sticky; top:0; z-index:5;
  display:flex; align-items:center; gap:12px;
  padding:12px 18px; background:var(--leaf); color:#fff;
}
.bar h1{ font-size:16px; margin:0; font-weight:800; letter-spacing:.02em; }
.bar .who{ margin-left:auto; font-size:12px; opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:45vw; }
.bar button{ background:rgba(255,255,255,.18); border:0; color:#fff; padding:6px 12px; border-radius:8px; cursor:pointer; font-size:12px; }

.layout{ display:grid; grid-template-columns:200px 1fr; min-height:calc(100vh - 52px); }
nav.side{ border-right:1px solid var(--line); padding:14px 10px; background:var(--panel); }
nav.side button{
  display:block; width:100%; text-align:left; border:0; background:none;
  padding:10px 12px; border-radius:8px; cursor:pointer; margin-bottom:2px; font-size:14px;
}
nav.side button.on{ background:var(--leaf-soft); color:var(--leaf); font-weight:800; }
main{ padding:22px 26px 60px; max-width:1100px; }
h2{ font-size:20px; margin:0 0 4px; }
.lead{ color:var(--ink-soft); margin:0 0 18px; font-size:13px; }

.box{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px; }
.box h3{ font-size:14px; margin:0 0 12px; }
.row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.grow{ flex:1; min-width:180px; }

input[type=text],input[type=email],input[type=password],input[type=number],
input[type=datetime-local],input[type=date],input[type=time],input[type=url],select,textarea{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
  background:var(--panel); color:var(--ink); color-scheme:light dark;
}
textarea{ resize:vertical; min-height:70px; }
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{ outline:2px solid var(--leaf); outline-offset:2px; }
label.f{ display:block; font-size:12px; color:var(--ink-soft); margin:10px 0 4px; }

.btn{ border:1px solid var(--line); background:var(--panel); padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:700; font-size:13px; white-space:nowrap; }
.btn.primary{ background:var(--leaf); border-color:var(--leaf); color:#fff; }
.btn.danger{ background:var(--danger); border-color:var(--danger); color:#fff; }
.modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:500; padding:20px; }
.modal-box{ background:var(--panel); border-radius:12px; padding:20px; max-width:420px; width:100%; max-height:80vh; overflow-y:auto; }
.tiers{ width:100%; border-collapse:collapse; margin-top:6px; }
.tiers th, .tiers td{ padding:4px 6px; text-align:center; font-size:12px; }
.tiers th{ color:var(--ink-soft); font-weight:600; }
.tiers input{ width:100%; padding:4px 2px; font-size:12px; text-align:center; }
.btn.ghost-danger{ color:var(--danger); border-color:var(--danger); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

/* 一覧表：多くの利用者を見比べるので、行を詰めて並べる */
.tbl-wrap{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-size:13px; }
th,td{ text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
th{ font-size:12px; color:var(--ink-soft); font-weight:700; position:sticky; top:0; background:var(--panel); }
tbody tr{ cursor:pointer; }
tbody tr:hover{ background:var(--leaf-soft); }
.ic{ width:30px; height:30px; border-radius:50%; object-fit:cover; background:var(--line); display:inline-block; vertical-align:middle; }
.code{ font-family:ui-monospace,Menlo,monospace; letter-spacing:.06em; }
.num{ text-align:right; font-variant-numeric:tabular-nums; }

.tag{ display:inline-block; font-size:11px; font-weight:800; padding:2px 8px; border-radius:999px; }
.tag.ban{ background:var(--danger-soft); color:var(--danger); }
.tag.guest{ background:var(--warn-soft); color:var(--warn); }
.tag.admin{ background:var(--leaf-soft); color:var(--leaf); }
.dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; }

.kv{ display:grid; grid-template-columns:140px 1fr; gap:6px 12px; font-size:13px; }
.kv dt{ color:var(--ink-soft); }
.kv dd{ margin:0; word-break:break-all; }

.danger-zone{ border-color:var(--danger); }
.danger-zone h3{ color:var(--danger); }
.empty{ color:var(--ink-soft); text-align:center; padding:28px 10px; }
.back{ background:none; border:0; color:var(--leaf); cursor:pointer; padding:0; margin-bottom:12px; font-weight:700; }

.toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--paper);
  padding:10px 16px; border-radius:10px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:20; }
.toast.on{ opacity:1; }

/* ログイン画面 */
.gate{ max-width:380px; margin:10vh auto; padding:0 18px; }
.gate .box{ padding:22px; }

@media (max-width:760px){
  .layout{ grid-template-columns:1fr; }
  nav.side{ display:flex; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line); padding:8px; gap:4px; }
  nav.side button{ width:auto; white-space:nowrap; margin:0; }
  main{ padding:16px 14px 50px; }
  .kv{ grid-template-columns:110px 1fr; }
  .hide-sm{ display:none; }
  /* 狭い画面では帯を詰める */
  .bar{ padding:10px 12px; gap:8px; }
  .bar h1{ font-size:15px; white-space:nowrap; }
  .bar .who{ display:none; }
  .bar button{ padding:6px 10px; white-space:nowrap; }
  nav.side{ align-items:center; }
  nav.side button{ padding:8px 12px; }
}
.tag{ white-space:nowrap; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

/* 色の見本 */
.swatches{ display:flex; flex-wrap:wrap; gap:10px; }
.sw{ width:34px; height:34px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0;
  box-shadow:inset 0 0 0 2px var(--panel); position:relative; }
.sw.on{ border-color:var(--ink); }
.sw-custom{ display:inline-block; overflow:hidden;
  background:conic-gradient(#e53935,#fdd835,#43a047,#1e88e5,#8e24aa,#e53935); }
.sw-custom input{ position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; border:0; padding:0; }

/* 称号の付け外し */
.title-picks{ display:flex; flex-wrap:wrap; gap:8px; }
.tp{ display:inline-flex; align-items:center; gap:6px; padding:5px 10px 5px 6px; border:1px solid var(--line);
  border-radius:999px; cursor:pointer; user-select:none; }
.tp.on{ border-color:var(--leaf); background:var(--leaf-soft); }
.tp input{ width:16px; height:16px; margin:0; accent-color:var(--leaf); }

.tp-group{ font-size:12px; font-weight:800; color:var(--ink-soft); margin:0 0 8px; }

/* 称号の一覧（カード形式：狭い画面でも崩れない） */
.title-cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:12px; }
.title-card{ margin:0; display:flex; flex-direction:column; gap:8px; }
.tc-head{ display:flex; align-items:center; gap:8px; }
.tc-head .tag{ font-size:13px; padding:3px 10px; }
.tc-count{ margin-left:auto; font-size:12px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
.tc-auto{ font-size:11px; color:var(--ink-soft); }
.tc-desc{ margin:0; font-size:13px; line-height:1.6; }
.tc-actions{ display:flex; flex-wrap:wrap; gap:6px; margin-top:auto; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD3481HlMki4kgq7m3puHrLfY6Rsh7tZ8c",
  authDomain: "o-labo-wh949.firebaseapp.com",
  databaseURL: "https://o-labo-wh949-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "o-labo-wh949",
  storageBucket: "o-labo-wh949.firebasestorage.app",
  messagingSenderId: "5105208435",
  appId: "1:5105208435:web:5e089d3752b1e603c76e06"
};
// 大元の管理者のID。サーバー側のルールでも同じIDで判定している
const OWNER_CODE = '7WX9WAHE';

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.database();

let me = null;            // ログイン中の利用者
let isOwner = false;      // 大元の管理者か
let view = 'users';       // users | user | titles | rooms | admins | events | tournaments
let currentEvent = null;  // events/current のキャッシュ
let eventEditing = false; // イベント編集フォームを開いているか
let currentTournament = null;   // tournaments/current のキャッシュ
let tournamentEditing = false;
let tournamentParticipantsAdmin = null;   // 大会の参加者一覧（組み合わせ生成用）
let tournamentGamesAdmin = null;          // 大会の対局記録（棋譜含む。モデレーター閲覧用）
let tournamentGameViewing = null;         // 今開いている対局の key
let users = {};           // uid → 利用者
let titles = {};          // 称号の一覧
let presence = {};
let admins = {};
let selectedUid = null;
let detail = null;        // 詳しく見ている利用者の追加情報
let query = '';
let busy = false;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),2400); }
function showModal(html){
  $('#modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal();">
      <div class="modal-box">${html}<button class="btn" style="width:100%; margin-top:14px;" onclick="closeModal()">閉じる</button></div>
    </div>`;
}
function closeModal(){ $('#modalRoot').innerHTML = ''; }
function fmtDate(ms){ if(!ms) return '-'; const d=new Date(ms); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function iconSrc(u){ return u && u.profile && u.profile.icon && u.profile.icon.startsWith('data:') ? u.profile.icon : ''; }
function nameOf(u){ return (u && ((u.profile && u.profile.displayName) || u.name)) || ((u && u.deletedAt) ? '（削除済み）' : '(名前なし)'); }
let selectedUids = new Set();   // 一括操作用に選択された利用者（大元の管理者のみ）
let bulkReason = '';            // 一括停止のときに、本人に表示する理由
// 絞り込み（すべて「かつ」で効く）。荒らしアカウントをまとめて見つけるために使う
let flt = { accountOnly:false, unverifiedOnly:false, noGames:false, hideBanned:false, bannedOnly:false, hideDeleted:true, recentDays:'' };
// 作成から日が浅く、メールの確認もまだ済んでいない（ゲストや、Google等だけで登録した人は対象外）
function isSuspicious(u){
  if(!u || u.guest) return false;
  if(u.emailVerified !== false) return false;   // false(明示的に未確認)のときだけ疑う。undefinedはメール未連携などなので対象外
  const ageMs = Date.now() - (u.createdAt || 0);
  return ageMs < 24*60*60*1000;
}
function userMatchesFilter(u){
  if(!u) return false;
  if(flt.accountOnly && u.guest) return false;
  if(flt.unverifiedOnly && (u.guest || u.emailVerified === true)) return false;   // 確認済みの記録がないもの（古いアカウントも含む）
  if(flt.noGames && (((u.stats && u.stats.games) || 0) > 0)) return false;
  if(flt.hideBanned && u.banned) return false;
  if(flt.bannedOnly && !u.banned) return false;
  if(flt.hideDeleted && u.deletedAt) return false;
  const d = parseFloat(flt.recentDays);
  if(d > 0 && (Date.now() - (u.createdAt || 0)) > d*86400000) return false;
  return true;
}
function hasActiveFilter(){ return flt.accountOnly || flt.unverifiedOnly || flt.noGames || flt.hideBanned || flt.bannedOnly || parseFloat(flt.recentDays) > 0; }
function applyTrollPreset(){
  flt = { accountOnly:true, unverifiedOnly:true, noGames:true, hideBanned:true, bannedOnly:false, hideDeleted:true, recentDays:'' };
  selectedUids.clear(); render();
}
function clearFilter(){
  flt = { accountOnly:false, unverifiedOnly:false, noGames:false, hideBanned:false, bannedOnly:false, hideDeleted:true, recentDays:'' };
  selectedUids.clear(); render();
}
// 一括で選べる利用者か（大元の管理者・管理者・すでに停止中の人は選ばない）
function isBulkSelectable(uid){
  const u = users[uid];
  return !!(u && u.code !== OWNER_CODE && !admins[uid] && !u.banned);
}
function toggleSelectUid(uid, checked){
  if(!isOwner) return;
  if(checked) selectedUids.add(uid); else selectedUids.delete(uid);
  render();
}
// 「停止中の人だけ」で絞り込んでいるときは、削除用の選択になる
function isDeleteSelectable(uid){
  const u = users[uid];
  return !!(u && u.banned && !u.deletedAt && u.code !== OWNER_CODE && !admins[uid]);
}
function selectableFn(){ return flt.bannedOnly ? isDeleteSelectable : isBulkSelectable; }
function selectAllShown(uids){
  if(!isOwner) return;
  uids.filter(selectableFn()).forEach(uid => selectedUids.add(uid));
  render();
}
/* アカウントのデータ削除 */
const STALE_GUEST_MS = 5*86400000;   // この期間ログインしていないゲストは、データを削除する
// 削除のとき消す項目。停止の記録（banned など）だけは、本人が入り直しても停止が解除されないよう残す
const USER_FIELDS_TO_CLEAR = ['code','name','guest','createdAt','lastSeen','profile','stats','title','titles','titlesRevoked','emailVerified','emailVerifiedAt'];
// 5日以上ログインしていないゲストか（管理者・停止中・削除済みは対象外。最終アクセスの記録がないものも対象外）
function isStaleGuestAccount(uid, u, now){
  if(!u || u.guest !== true) return false;
  if(u.banned || u.deletedAt) return false;
  if(u.code === OWNER_CODE || admins[uid]) return false;
  const last = u.lastSeen || u.createdAt;
  if(!last) return false;
  return ((now || Date.now()) - last) > STALE_GUEST_MS;
}
// 1人分の削除で書き換える場所。tombstone なら停止の記録だけ残し、そうでなければ利用者の情報ごと消す。
// skipFriends：同じ組で一緒に消す相手（その人のフレンド一覧は丸ごと消えるので、個別には触らない）
function buildWipeUpdates(uid, u, friendUids, tombstone, now, skipFriends){
  const up = {};
  for(const fu of friendUids){ if(!skipFriends || !skipFriends.has(fu)) up[`friends/${fu}/${uid}`] = null; }
  for(const node of ['friends','friendRequests','saves','private','presence','invites','leaderboard']) up[`${node}/${uid}`] = null;
  up[`tournaments/current/participants/${uid}`] = null;
  up[`events/current/participants/${uid}`] = null;
  if(u && u.code) up[`userCodes/${u.code}`] = null;
  if(tombstone){
    for(const f of USER_FIELDS_TO_CLEAR) up[`users/${uid}/${f}`] = null;
    up[`users/${uid}/deletedAt`] = now;
  } else {
    up[`users/${uid}`] = null;
  }
  return up;
}
// 数が多くても動くよう、25人ずつまとめて書き込む。失敗した組は1人ずつやり直す
async function wipeAccountsBatch(uids, opts){
  const tombstone = !!(opts && opts.tombstone);
  const now = Date.now();
  let done = 0, failed = 0;
  const CHUNK = 25;
  for(let i=0; i<uids.length; i+=CHUNK){
    const chunk = uids.slice(i, i+CHUNK);
    const inChunk = new Set(chunk);
    const friendLists = await Promise.all(chunk.map(uid =>
      db.ref('friends/'+uid).once('value').then(s => Object.keys(s.val() || {})).catch(() => [])));
    const perUser = chunk.map((uid, k) => buildWipeUpdates(uid, users[uid], friendLists[k], tombstone, now, inChunk));
    try{
      await db.ref().update(Object.assign({}, ...perUser));
      done += chunk.length;
    }catch(err){
      for(let k=0; k<chunk.length; k++){
        try{ await db.ref().update(buildWipeUpdates(chunk[k], users[chunk[k]], friendLists[k], tombstone, now, null)); done++; }
        catch(e){ failed++; }
      }
    }
    toast(`データを削除しています… ${done}/${uids.length}`);
  }
  return { done, failed };
}
let purgeRunning = false, autoPurgeDone = false;
async function purgeStaleGuests(auto){
  if(purgeRunning) return 0;
  const now = Date.now();
  let uids = Object.keys(users).filter(uid => isStaleGuestAccount(uid, users[uid], now));
  if(!uids.length){ if(!auto) toast('削除する対象はありません'); return 0; }
  const MAX = 1000, total = uids.length;
  uids = uids.slice(0, MAX);
  purgeRunning = true;
  try{
    const r = await wipeAccountsBatch(uids, { tombstone:false });
    toast(`5日以上ログインしていないゲスト${r.done}人のデータを削除しました${r.failed ? `（${r.failed}人は失敗）` : ''}${total > MAX ? `。残り${total-MAX}人は次回に削除します` : ''}`);
    await loadAll(); render();
    return r.done;
  }finally{ purgeRunning = false; }
}
// 管理者ページを開いたときに、1回だけ自動で行う（サーバー側の定期処理はないため、開いたときが実行のきっかけになる）
async function autoPurgeStaleGuests(){
  if(autoPurgeDone) return;
  autoPurgeDone = true;
  try{ await purgeStaleGuests(true); }catch(err){ console.warn('古いゲストの自動削除に失敗:', err); }
}
// 停止中の人のアカウントを、まとめて削除する（大元の管理者のみ）
async function bulkDelete(){
  if(!isOwner){ toast('アカウントの削除は、大元の管理者だけができます'); return; }
  const uids = Array.from(selectedUids).filter(isDeleteSelectable);
  if(!uids.length){ toast('削除できる対象がありません（停止中の人だけが対象です）'); return; }
  const typed = prompt(`停止中の${uids.length}人のアカウントのデータを、完全に削除します。元に戻せません。\n\n・記録・プロフィール・フレンド・ランキング・大会やイベントの参加が、すべて消えます\n・本人が入り直しても、停止は解除されません\n\n続けるには「削除」と入力してください。`);
  if(typed === null) return;
  if(typed.trim() !== '削除'){ toast('入力が違うため中止しました'); return; }
  const r = await wipeAccountsBatch(uids, { tombstone:true });
  toast(r.failed ? `${r.done}人のデータを削除しました（${r.failed}人は失敗）` : `${r.done}人のデータを削除しました`);
  selectedUids.clear();
  await loadAll(); render();
}
// 停止するときに書き換える場所をまとめて作る。停止中の人はランキングや、大会・イベントの参加者一覧からも外す
function buildBanUpdates(uids, reason, now){
  const up = {};
  for(const uid of uids){
    up[`users/${uid}/banned`] = true;
    up[`users/${uid}/banReason`] = reason;
    up[`users/${uid}/bannedAt`] = now;
    up[`leaderboard/${uid}`] = null;
    up[`tournaments/current/participants/${uid}`] = null;
    up[`events/current/participants/${uid}`] = null;
  }
  return up;
}
async function bulkBan(){
  if(!isOwner){ toast('まとめての停止は、大元の管理者だけができます'); return; }
  const uids = Array.from(selectedUids).filter(isBulkSelectable);
  if(!uids.length){ toast('停止できる対象がありません'); return; }
  const reason = (bulkReason || '').trim() || '不審なアカウントのため停止';
  if(!confirm(`${uids.length}件のアカウントをまとめて停止します。\n\n・本人はセーブデータなどに一切アクセスできなくなります\n・ランキングと、大会・イベントの参加者からも外れます\n・データ自体は残るので、期限内なら解除して戻せます\n\nよろしいですか？`)) return;
  const now = Date.now();
  let done = 0, failed = 0;
  // 数が多いので、まとめて書き込む（1件ずつだと時間がかかるため）。失敗した組だけ1件ずつやり直す
  const CHUNK = 40;
  for(let i=0; i<uids.length; i+=CHUNK){
    const chunk = uids.slice(i, i+CHUNK);
    try{
      await db.ref().update(buildBanUpdates(chunk, reason, now));
      done += chunk.length;
    }catch(err){
      for(const uid of chunk){
        try{ await db.ref().update(buildBanUpdates([uid], reason, now)); done++; }
        catch(e){ failed++; }
      }
    }
    toast(`停止を進めています… ${done}/${uids.length}`);
  }
  toast(failed ? `${done}件を停止しました（${failed}件は失敗）` : `${done}件を停止しました`);
  selectedUids.clear();
  await loadAll(); render();
}
function banElapsedDays(bannedAt){ return Math.floor((Date.now() - bannedAt) / 86400000); }
function banElapsedText(bannedAt){
  if(!bannedAt) return '';
  const days = banElapsedDays(bannedAt);
  const overLimit = days >= 60;
  return ` <span style="font-size:11px; color:${overLimit?'var(--danger)':'var(--ink-soft)'};">（停止から${days}日${overLimit?'・保持期限の目安(2ヶ月)を過ぎています':''}）</span>`;
}
function presenceOf(uid){
  const p = presence[uid];
  const fresh = p && p.at && (Date.now() - p.at < 5*60*1000);
  const st = fresh ? p.state : 'offline';
  return ({ online:['オンライン','#22a45d'], playing:['対局中','#f5a300'], playing_online:['対局中（オンライン）','#3b82f6'] }[st]) || ['オフライン','#b8b2a6'];
}

async function checkAdmin(user){
  const ownerSnap = await db.ref('userCodes/' + OWNER_CODE).once('value');
  if(ownerSnap.val() === user.uid){ isOwner = true; return true; }
  try{

// 以前は users/<uid>/title に1つだけ、今は users/<uid>/titles に何個でも持つ
function titlesOf(u){
  const out = {};
  if(u && u.titles) for(const k of Object.keys(u.titles)) if(u.titles[k]) out[k] = true;
  if(u && u.title) out[u.title] = true;      // 以前の形の名残も数える
  return out;
}
const isDarkMode = () => window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
// 暗い画面では文字を明るくして読めるようにする
function titleTone(hex){
  if(!isDarkMode() || !/^#[0-9a-f]{6}$/i.test(hex)) return hex;
  const v=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));
  return '#'+v.map(x=>Math.round(x+(255-x)*0.45).toString(16).padStart(2,'0')).join('');
}
function titleTag(t){
  const c = (t && t.color) || '#0f7a3f';
  return `<span class="tag" style="background:${esc(c)}22; color:${esc(titleTone(c))};">${esc(t ? t.name : '')}</span>`;
}

// 自動の称号は、本体に書いた既定値の上に、管理者が変えた項目だけを重ねる
function mergeTitles(db){
  const out = {};
  for(const [id,t] of Object.entries(AUTO_TITLES)){
    out[id] = Object.assign({}, t, db[id] || {}, { auto:true, overridden: !!db[id] });
  }
  for(const [id,t] of Object.entries(db)){
    if(!AUTO_TITLES[id]) out[id] = Object.assign({}, t);
  }
  return out;
}
function sortedTitles(){
  return Object.entries(titles).sort((a,b)=>{
    if(!!a[1].auto !== !!b[1].auto) return a[1].auto ? -1 : 1;   // 自動の称号を先に
    return (a[1].createdAt||0)-(b[1].createdAt||0);
  });
}

async function wipeUser(){
  const uid = selectedUid, u = users[uid] || {};
  if(u.code === OWNER_CODE){ toast('大元の管理者のデータは消せません'); return; }
  const code = u.code || '';
  // 取り違えを防ぐため、IDを打ち込んでもらう
  const typed = prompt(`本当に消す場合は、この利用者のID「${code}」を入力してください。`);
  if(typed === null) return;
  if(typed.trim().toUpperCase() !== code){ toast('IDが一致しないため中止しました'); return; }
  try{
    // 相手側のフレンド一覧からも自分を外す
    const fr = await db.ref('friends/'+uid).once('value');
    const tasks = Object.keys(fr.val()||{}).map(fu => db.ref('friends/'+fu+'/'+uid).remove().catch(()=>{}));
    await Promise.all(tasks);
    // ひとつが失敗しても他は続けて消す（どこで失敗したかは後でまとめて伝える）
    const results = await Promise.all([
      db.ref('friends/'+uid).remove().then(()=>null).catch(err=>'フレンド一覧: '+err.message),
      db.ref('friendRequests/'+uid).remove().then(()=>null).catch(err=>'フレンド申請: '+err.message),
      db.ref('saves/'+uid).remove().then(()=>null).catch(err=>'セーブデータ: '+err.message),
      db.ref('private/'+uid).remove().then(()=>null).catch(err=>'非公開情報: '+err.message),
      db.ref('presence/'+uid).remove().then(()=>null).catch(err=>'オンライン状態: '+err.message),
      db.ref('invites/'+uid).remove().then(()=>null).catch(err=>'招待: '+err.message),
    ]);
    if(code) await db.ref('userCodes/'+code).remove().catch(err => results.push('ID登録: '+err.message));
    await db.ref('users/'+uid).remove();
    const failed = results.filter(Boolean);
    if(failed.length){ toast('一部消せませんでした: ' + failed.join(' / ')); await loadAll(); render(); go('users'); return; }
    await loadAll();
    toast('データを消しました');
    go('users');
  }catch(err){ console.error(err); toast('消せませんでした（権限を確認してください）'); }
}

const EVENT_DAY_MS = 86400000;
function eventPhaseOf(ev, now){
  now = now || Date.now();
  if(!ev || !ev.startAt) return 'none';
  const voteEnd = ev.startAt + (ev.voteDays||2)*EVENT_DAY_MS;
  const huntEnd = voteEnd + (ev.huntDays||3)*EVENT_DAY_MS;
  const resultEnd = huntEnd + (ev.resultDays||1)*EVENT_DAY_MS;
  if(now < ev.startAt) return 'none（開始前）';
  if(now < voteEnd) return 'vote（投票期間）';
  if(now < huntEnd) return 'hunt（イベント期間）';
  if(now < resultEnd) return 'result（結果発表）';
  return 'ended（終了済み）';
}

/* 重複アカウントの検出（同じデータから複製されたアカウントを、ランキングのデータから見つける） */
let dupGroups = null, dupLoading = false, dupMinGames = 10;
// 「同じデータ」とみなす手がかり：データの系統ID、または成績がすべて同じ（対局数が minGames 以上のとき）
function groupDuplicates(entries, minGames, infoOf){
  const parent = entries.map((_, i) => i);
  const find = i => { while(parent[i] !== i){ parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
  const keysOf = e => {
    const k = [];
    if(e.lineageId) k.push('L:' + e.lineageId);
    if((e.games || 0) >= minGames) k.push('F:' + [e.games, e.wins, e.casualUnlocked, e.flipUnlocked, e.trainingRankIndex, e.trainingXNumber, e.consecutiveLoginDays].join('|'));
    return k;
  };
  const first = new Map();
  entries.forEach((e, i) => keysOf(e).forEach(k => { if(first.has(k)) parent[find(i)] = find(first.get(k)); else first.set(k, i); }));
  const buckets = new Map();
  entries.forEach((e, i) => { const r = find(i); if(!buckets.has(r)) buckets.set(r, []); buckets.get(r).push(e); });
  const better = (a, b) => {                       // a を残すべきか：ゲストでないほう → 先に作られたほう
    const ia = infoOf(a.uid) || {}, ib = infoOf(b.uid) || {};
    if(!!ia.guest !== !!ib.guest) return !ia.guest;
    const ca = ia.createdAt || Infinity, cb = ib.createdAt || Infinity;
    if(ca !== cb) return ca < cb;
    return String(a.uid) < String(b.uid);
  };
  const groups = [];
  for(const members of buckets.values()){
    if(members.length < 2) continue;
    let keep = members[0];
    for(const m of members) if(better(m, keep)) keep = m;
    const count = new Map();
    members.forEach(m => keysOf(m).forEach(k => count.set(k, (count.get(k) || 0) + 1)));
    const reasons = [];
    if([...count].some(([k, c]) => k.startsWith('L:') && c >= 2)) reasons.push('同じデータの系統');
    if([...count].some(([k, c]) => k.startsWith('F:') && c >= 2)) reasons.push('成績がすべて同じ');
    groups.push({ members, keep: keep.uid, reasons });
  }
  groups.sort((a, b) => b.members.length - a.members.length);
  return groups;
}
async function loadDuplicateGroups(){
  if(dupLoading) return;
  dupLoading = true; render();
  try{
    const snap = await db.ref('leaderboard').once('value');
    const v = snap.val() || {};
    const entries = Object.entries(v).map(([uid, e]) => Object.assign({uid}, e)).filter(e => (e.games || 0) > 0);
    dupGroups = groupDuplicates(entries, Math.max(1, parseInt(dupMinGames, 10) || 10), uid => users[uid]);
  }catch(err){ dupGroups = []; toast('読み込めませんでした: ' + err.message); }
  dupLoading = false; render();
}
function selectDupRest(){
  if(!isOwner) return;
  (dupGroups || []).forEach(g => g.members.forEach(m => { if(m.uid !== g.keep && isBulkSelectable(m.uid)) selectedUids.add(m.uid); }));
  render();
}

/* O-LABO競技大会の管理 */
const TOUR_DAY_MS = 86400000;
function tourPhaseOf(t, now){
  now = now || Date.now();
  if(!t || t.status !== 'published') return 'none（非公開）';
  if(now < t.announceAt) return 'none（公開待ち）';
  if(now < t.entryStartAt) return 'announced（予告中）';
  if(now < t.entryEndAt) return 'entry（エントリー受付中）';
  if(now < t.day1At) return 'bracket（組合せ公開・開催前）';
  if(now < t.day2At) return 'day1（開催1日目）';
  if(now < t.day3At) return 'day2（開催2日目）';
  if(now < t.endAt) return 'day3（開催3日目・決勝）';
  return 'ended（終了）';
}
// 本体（index.html）と同じロジック。不戦勝が同じ組に重ならないよう、各組の1人目から順に参加者を詰める
function generateBracketAdmin(uids){
  let size = 1;
  while(size < uids.length) size *= 2;
  size = Math.max(size, 2);
  const shuffled = uids.slice().sort(() => Math.random() - 0.5);
  const slots = new Array(size).fill(null);
  let si = 0;
  for(let i=0;i<size && si<shuffled.length;i+=2) slots[i] = shuffled[si++];
  for(let i=1;i<size && si<shuffled.length;i+=2) slots[i] = shuffled[si++];
  const round1 = [];
  for(let i=0;i<size;i+=2){
    const p1 = slots[i], p2 = slots[i+1];
    const winner = (p2===null && p1!==null) ? p1 : (p1===null && p2!==null) ? p2 : null;
    round1.push({p1, p2, winner, black:null, white:null, playedAt:null});
  }
  const rounds = [round1];
  let roundSize = size/2;
  while(roundSize >= 1){
    const r = [];
    for(let i=0;i<roundSize;i++) r.push({p1:null, p2:null, winner:null, black:null, white:null, playedAt:null});
    rounds.push(r);
    if(roundSize === 1) break;
    roundSize = roundSize/2;
  }
  return {size, rounds};
}

// 参加者から外す（荒らしの除外など）。組み合わせをすでに作っている場合は、必要なら作り直してもらう
async function removeTournamentParticipant(uid){
  const hasBracket = !!(currentTournament && currentTournament.bracket);
  const msg = hasBracket
    ? 'この人を参加者から外します。組み合わせはすでに作られているので、外しただけでは表は変わりません。必要なら、あとで「組み合わせを作り直す」を行ってください。外しますか？'
    : 'この人を参加者から外します。よろしいですか？';
  if(!confirm(msg)) return;
  try{
    await db.ref('tournaments/current/participants/'+uid).remove();
    toast('参加者から外しました');
    await loadTournamentParticipants();
  }catch(err){ toast('外せませんでした: ' + err.message); }
}
async function saveTournament(){
  const title = ($('#tTitle')||{}).value || '';
  if(!title.trim()){ toast('大会名を入力してください'); return; }
  const dates = ['tAnnounce','tEntryStart','tEntryEnd','tDay1','tDay2','tDay3','tEnd'].map(id => {
    const v = ($('#'+id)||{}).value;
    return v ? new Date(v).getTime() : 0;
  });
  if(dates.some(d => !d)){ toast('日時をすべて入力してください'); return; }
  const data = {
    title: title.trim(),
    announceAt: dates[0], entryStartAt: dates[1], entryEndAt: dates[2],
    day1At: dates[3], day2At: dates[4], day3At: dates[5], endAt: dates[6],
    timeLimitSec: (parseInt(($('#tTimeLimit')||{}).value, 10) || 25) * 60,
    liveUrl: ($('#tLiveUrl')||{}).value || '',
    nextNote: ($('#tNextNote')||{}).value || '',
    status: ($('#tStatus')||{}).value || 'draft',
  };
  if(currentTournament && currentTournament.bracket) data.bracket = currentTournament.bracket;
  try{
    await db.ref('tournaments/current').update(data);
    currentTournament = Object.assign({}, currentTournament, data);
    tournamentEditing = false;
    toast('大会を保存しました');
    render();
    loadTournamentParticipants();
  }catch(err){ toast('保存に失敗しました: ' + err.message); }
}
async function generateTournamentBracket(){
  if(!currentTournament) return;
  await loadTournamentParticipants();
  const uids = Object.keys(tournamentParticipantsAdmin || {});
  if(uids.length < 2){ toast('参加者が2人未満のため、組み合わせを作れません'); return; }
  if(currentTournament.bracket && !confirm('すでに組み合わせがあります。作り直すと今の進行状況は消えます。よろしいですか？')) return;
  const bracket = generateBracketAdmin(uids);
  try{
    await db.ref('tournaments/current/bracket').set(bracket);
    currentTournament.bracket = bracket;
    toast('組み合わせを作成しました');
    render();
  }catch(err){ toast('作成に失敗しました: ' + err.message); }
}
async function deleteTournament(){
  if(!confirm('大会を削除します。参加者の記録もすべて消えます。よろしいですか？')) return;
  try{
    await db.ref('tournaments/current').remove();
    currentTournament = null;
    tournamentEditing = false;
    toast('大会を削除しました');
    render();
  }catch(err){ toast('削除に失敗しました: ' + err.message); }
}

          ${x.auto

            : `<button class="btn ghost-danger" onclick="deleteTitle('${id}')">削除</button>`}
        </div>
      </div>`).join('') : '<div class="box"><p class="empty">まだ称号はありません</p></div>'}
    </div>`;
}
async function saveTitle(){
  const name = $('#tName').value.trim();
  if(!name){ toast('名前を入力してください'); return; }
  const data = { name, desc: $('#tDesc').value.trim(), color: $('#tColor').value };
  try{
    if(editTitleId && titles[editTitleId] && titles[editTitleId].auto){
      // 自動の称号は、既定値を上書きする形で保存する
      data.createdAt = AUTO_TITLES[editTitleId].createdAt;
      await db.ref('titles/'+editTitleId).set(data);
    } else if(editTitleId){
      await db.ref('titles/'+editTitleId).update(data);
    } else {
      data.createdAt = Date.now();
      await db.ref('titles').push(data);
    }
    editTitleId = null;
    await loadAll(); toast('称号を保存しました'); render();
  }catch(err){ console.error(err); toast('保存できませんでした'); }
}
async function resetAutoTitle(id){
  if(!confirm(`「${titles[id].name}」を初期設定（${AUTO_TITLES[id].name}）に戻しますか？\n付いている人からは外れません。`)) return;
  try{ await db.ref('titles/'+id).remove(); await loadAll(); toast('初期設定に戻しました'); render(); }
  catch(err){ toast('戻せませんでした'); }
}
let holdersOf = null;
function showHolders(id){ holdersOf = id; render(); }
async function removeTitleFrom(uid, id){
  await setUserTitle(uid, id, false);
}
async function deleteTitle(id){
  if(titles[id] && titles[id].auto){ toast('自動で付く称号は削除できません'); return; }
  const n = Object.values(users).filter(u => titlesOf(u)[id]).length;
  if(!confirm(`「${titles[id].name}」を削除しますか？${n?`\n付けている ${n}人 からも外れます。`:''}`)) return;
  try{
    const tasks = [];
    for(const [uid,u] of Object.entries(users)){
      if(u.titles && u.titles[id]) tasks.push(db.ref('users/'+uid+'/titles/'+id).remove());
      if(u.title === id) tasks.push(db.ref('users/'+uid+'/title').remove());
    }
    await Promise.all(tasks);
    await db.ref('titles/'+id).remove();
    await loadAll(); toast('称号を削除しました'); render();
  }catch(err){ toast('削除できませんでした'); }
}

/* ---------- 対局の部屋 ---------- */
let rooms = null;
async function loadRooms(){
  try{
    const [r, w] = await Promise.all([db.ref('rooms').once('value'), db.ref('waiting').once('value')]);
    rooms = { rooms: r.val() || {}, waiting: w.val() || {} };
  }catch(err){ rooms = { rooms:{}, waiting:{}, error:true }; }
  render();
}
function viewRooms(){
  if(!rooms) return '<h2>対局の部屋</h2><p class="empty">読み込み中…</p>';
  const now = Date.now();
  const list = Object.entries(rooms.rooms).sort((a,b)=>(b[1].updatedAt||b[1].createdAt||0)-(a[1].updatedAt||a[1].createdAt||0));
  const stale = list.filter(([,r]) => (now - (r.updatedAt||r.createdAt||0)) > 3*60*60*1000 || r.status==='finished' || r.status==='abandoned');
  const label = { waiting:'待機中', playing:'対局中', finished:'終了', abandoned:'中断' };
  return `
    <h2>対局の部屋</h2>
    <p class="lead">部屋 ${list.length}件 ／ ランダムマッチの受付 ${Object.keys(rooms.waiting).length}件</p>
    <div class="box row">
      <span class="grow">終わった部屋や3時間以上動いていない部屋：${stale.length}件</span>
      <button class="btn" onclick="loadRooms()">再読み込み</button>
      <button class="btn danger" onclick="cleanRooms()" ${stale.length?'':'disabled'}>まとめて片付ける</button>
    </div>
    <div class="box" style="padding:0;">
      <div class="tbl-wrap"><table>
        <thead><tr><th>部屋</th><th>状態</th><th>先手</th><th>後手</th><th class="num hide-sm">手数</th><th class="hide-sm">最終</th><th></th></tr></thead>
        <tbody>${list.length ? list.map(([id,r]) => `
          <tr style="cursor:default;">
            <td class="code">${esc(id)}</td>
            <td>${label[r.status]||esc(r.status)}</td>
            <td>${esc(r.host && r.host.name || '-')}</td>
            <td>${esc(r.guest && r.guest.name || '-')}</td>
            <td class="num hide-sm">${r.moveCount||0}</td>
            <td class="hide-sm">${fmtDate(r.updatedAt||r.createdAt)}</td>
            <td><button class="btn ghost-danger" onclick="deleteRoom('${esc(id)}')">閉じる</button></td>
          </tr>`).join('') : '<tr><td colspan="7" class="empty">部屋はありません</td></tr>'}
        </tbody>
      </table></div>
    </div>`;
}
async function deleteRoom(id){
  if(!confirm(`部屋「${id}」を閉じますか？ 対局中なら中断されます。`)) return;
  try{ await db.ref('rooms/'+id).remove(); await db.ref('waiting/'+id).remove().catch(()=>{}); toast('閉じました'); loadRooms(); }
  catch(err){ toast('閉じられませんでした'); }
}
async function cleanRooms(){
  const now = Date.now();
  const targets = Object.entries(rooms.rooms).filter(([,r]) =>
    (now - (r.updatedAt||r.createdAt||0)) > 3*60*60*1000 || r.status==='finished' || r.status==='abandoned').map(([id])=>id);
  if(!confirm(`${targets.length}件の部屋を片付けますか？`)) return;
  await Promise.all(targets.map(id => db.ref('rooms/'+id).remove().catch(()=>{})));
  // 古い受付も片付ける
  await Promise.all(Object.entries(rooms.waiting).filter(([,w]) => now - (w.createdAt||0) > 60000)
    .map(([id]) => db.ref('waiting/'+id).remove().catch(()=>{})));
  toast(`${targets.length}件を片付けました`);
  loadRooms();
}

/* ---------- 管理者（大元の管理者だけ） ---------- */
function viewAdmins(){
  if(!isOwner) return '<p class="empty">大元の管理者だけが使えます。</p>';
  const list = Object.keys(admins).filter(k => admins[k]);
  return `
    <h2>管理者</h2>
    <p class="lead">管理者を増やせるのは大元の管理者だけです。追加された管理者は、管理者を増やせません。</p>
    <div class="box">
      <h3>管理者を追加</h3>
      <div class="row">
        <input type="text" id="admCode" class="grow" maxlength="8" placeholder="追加する人のID" style="text-transform:uppercase; letter-spacing:.1em;">
        <button class="btn primary" onclick="addAdmin()">追加</button>
      </div>
    </div>
    <div class="box">
      <h3>現在の管理者</h3>
      <div class="row" style="padding:6px 0; border-bottom:1px solid var(--line);">
        <span class="grow">${esc(nameOf(Object.values(users).find(u=>u.code===OWNER_CODE)))} <span class="code" style="color:var(--ink-soft);">${OWNER_CODE}</span></span>
        <span class="tag admin">大元</span>
      </div>
      ${list.map(uid => `
        <div class="row" style="padding:6px 0; border-bottom:1px solid var(--line);">
          <span class="grow">${esc(nameOf(users[uid]))} <span class="code" style="color:var(--ink-soft);">${esc((users[uid]||{}).code||uid)}</span></span>
          <button class="btn ghost-danger" onclick="removeAdmin('${uid}')">外す</button>
        </div>`).join('')}
    </div>`;
}
async function addAdmin(){
  const code = $('#admCode').value.trim().toUpperCase();
  if(!code) return;
  const snap = await db.ref('userCodes/'+code).once('value');
  const uid = snap.val();
  if(!uid){ toast('そのIDの利用者が見つかりません'); return; }
  if(code === OWNER_CODE){ toast('大元の管理者はすでに管理者です'); return; }
  if(!confirm(`「${nameOf(users[uid])}」を管理者にしますか？\n利用者の情報をすべて見られるようになります。`)) return;
  try{ await db.ref('admins/'+uid).set(true); await loadAll(); toast('管理者に追加しました'); render(); }
  catch(err){ toast('追加できませんでした'); }
}
async function removeAdmin(uid){
  if(!confirm(`「${nameOf(users[uid])}」を管理者から外しますか？`)) return;
  try{ await db.ref('admins/'+uid).remove(); await loadAll(); toast('外しました'); render(); }
  catch(err){ toast('外せませんでした'); }
}
</script>
