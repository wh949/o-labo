function checkStellaCommand(tabId){
  // すでに解禁している場合は受け付けない
  if(state.settings.stellaUnlocked){ stellaCommandSequence = []; return; }
  // 難易度「α」を解禁していないと受け付けない
  if(!(state.casual.unlocked && state.casual.unlocked.alpha)){
    stellaCommandSequence = [];
    return;
  }
  // 対局中は受け付けない
  if(game){ stellaCommandSequence = []; return; }
  // すでに挑戦待ち・挑戦中なら重ねて受け付けない
  if(stellaChallengePending || stellaChallengeActive) return;

  // 対戦とゆる以外を押したら最初から
  if(tabId !== 'battle' && tabId !== 'casual'){ stellaCommandSequence = []; return; }

  const now = Date.now();
  const last = stellaCommandSequence[stellaCommandSequence.length - 1];
  // 前回の切り替えから0.5秒を超えていたら、そこから数え直す
  if(last && now - last.at > STELLA_COMMAND_GAP) stellaCommandSequence = [];

  stellaCommandSequence.push({ tab: tabId, at: now });
  if(stellaCommandSequence.length > 5) stellaCommandSequence.shift();

  if(stellaCommandSequence.length === 5){
    const want = ['battle','casual','battle','casual','battle'];
    const okOrder = stellaCommandSequence.every((e, k) => e.tab === want[k]);
    const okSpeed = stellaCommandSequence.every((e, k) =>
      k === 0 || (e.at - stellaCommandSequence[k-1].at) <= STELLA_COMMAND_GAP);
    if(okOrder && okSpeed){
      stellaCommandSequence = [];
      stellaChallengePending = true;
      showStellaUnlock();
    }
  }
}

async function initAudioContext(){
  if(audioContext) return audioContext;
  try{
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    return audioContext;
  }catch(err){
    console.error('AudioContext init error:', err);
    return null;
  }
}

async function loadAudioFile(type, name){
  // type: 'bgm' or 'se'
  if(audioBuffers[type][name]) return audioBuffers[type][name];
  if(audioMissing[type + '/' + name]) return null;   // 前回読めなかったものは試さない
  
  try{
    const ctx = await initAudioContext();
    if(!ctx) return null;
    
    const url = `${AUDIO_BASE_URL}/${type}/${name}.mp3`;
    const response = await fetch(url);
    if(!response.ok) throw new Error(`Failed to load ${url}`);
    
    const arrayBuffer = await response.arrayBuffer();
    const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
    audioBuffers[type][name] = audioBuffer;
    return audioBuffer;
  }catch(err){
    // 同じファイルで何度も警告を出さない（まだ音声を置いていない時に大量に出るため）
    audioMissing[type + '/' + name] = true;
    if(!audioWarned){
      audioWarned = true;
      console.warn('音声ファイルが読み込めません（まだ配置していない場合は無視して構いません）:', type + '/' + name);
    }
    return null;
  }
}

async function preloadAudioFiles(){
  // 効果音だけ先に読む（小さいので待たされない）。
  // BGMは容量が大きいため、鳴らす直前に読み込む。
  try{
    await initAudioContext();
    await Promise.all(AUDIO_FILES.se.map(name => loadAudioFile('se', name)));
  }catch(err){
    console.warn('効果音の先読みに失敗:', err);
  }
}

// スマホは利用者が画面に触れるまで音を鳴らせない。
// 最初の操作で音を出せる状態にし、鳴らすはずだったBGMを流す。
function setupAudioUnlock(){
  // 端末が消音（サイレント）モードでも音が鳴るようにする。
  // iOS は、<audio> 要素をユーザー操作の中で一度でも再生しておくと、
  // 以降の Web Audio API の音が消音スイッチの影響を受けなくなる。
  // ごく短い無音の音声を最初の操作のたびに鳴らして、そのきっかけを作る
  const SILENT_AUDIO_SRC = 'data:audio/wav;base64,UklGRtwAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YbgAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
  let silentAudio = null;
  function unlockSilentAudioSession(){
    try{
      if(!silentAudio) silentAudio = new Audio(SILENT_AUDIO_SRC);
      silentAudio.currentTime = 0;
      const p = silentAudio.play();
      if(p && p.catch) p.catch(()=>{});
    }catch(err){ /* 無視して構わない */ }
  }
  const unlock = async ()=>{
    // <audio>.play() は同期的に、ユーザー操作のコールスタック内で呼ぶ必要があるため、
    // 非同期処理（AudioContext の初期化）より先に呼ぶ
    unlockSilentAudioSession();
    try{
      const ctx = await initAudioContext();
      if(!ctx) return;
      if(ctx.state === 'suspended') await ctx.resume();
      if(ctx.state === 'running'){
        audioState.unlocked = true;
        ['pointerdown','touchend','click','keydown'].forEach(ev =>
          document.removeEventListener(ev, unlock, true));
        // 開いた時点で鳴らすはずだった曲を流す（操作が許可されるまで鳴らせなかったため）
        updateBGM(true);
      }
    }catch(err){ console.warn('音声の有効化に失敗:', err); }
  };
  ['pointerdown','touchend','click','keydown'].forEach(ev =>
    document.addEventListener(ev, unlock, true));
}

/* ------------------------------------------------------------
   BGM：対局中かどうかの2ゾーン方式
     db/audio/bgm/home/ro(数字).mp3      … 対局していないとき
     db/audio/bgm/battling/vs(数字).mp3  … 対局中
     db/audio/bgm/event/<行事>/home/ , /battling/ … 行事の日はこちらを優先
   フォルダの中身は、まず list.json（今後の対応）を探し、無ければ
   ro1, ro2, ... のように連番のファイルを見つかるだけ検出する。
   曲を変えるのは「ホームを開いた」「対局が始まった」「対局が終わった」の
   3つのタイミングだけ（＝ゾーンが切り替わった瞬間）で、その中ではランダムに
   1曲を選んでそのままループ再生する。
   ------------------------------------------------------------ */
let bgmZone = null;              // 'home' | 'battling' | null（起動直後は未定）
const AUDIO_PROBE_MAX = 24;      // 1フォルダあたり探す上限（list.json が無い場合）
let audioIndexCache = {};        // フォルダ名 → ['ro1','ro2',...]（拡張子なし・存在するものだけ）

// フォルダ内の曲名一覧を得る。list.json があればそれを使い、無ければ連番を探す
async function scanBgmFolder(folder, prefix){
  if(audioIndexCache[folder] !== undefined) return audioIndexCache[folder];
  let names = [];
  try{
    const res = await fetch(`${AUDIO_BASE_URL}/bgm/${folder}/list.json`);
    if(res.ok){
      const j = await res.json();
      // 将来はループ範囲つきの形式にも対応できるよう、名前だけ緩く取り出す
      if(Array.isArray(j)){
        names = j.map(x => String(typeof x === 'string' ? x : (x && x.file) || '').replace(/\.mp3$/i, '')).filter(Boolean);
      }
    }
  }catch(err){ /* list.json はまだ無くてよい */ }
  if(!names.length){
    const checks = [];
    for(let i=1;i<=AUDIO_PROBE_MAX;i++){
      checks.push(
        fetch(`${AUDIO_BASE_URL}/bgm/${folder}/${prefix}${i}.mp3`, { method:'HEAD' })
          .then(r => r.ok ? (prefix+i) : null)
          .catch(() => null)
      );
    }
    names = (await Promise.all(checks)).filter(Boolean);
  }
  audioIndexCache[folder] = names;
  return names;
}

// BGM のメタデータ（曲名・サブタイトル）。カフェの MUSIC タブ用で、
// カフェ自体が非公開の間はまだ画面には使わないが、読み込みだけ先に用意しておく。
// 仕様は「カフェ会話ガイド」ではなく「BGM_SE実装ガイド」の meta.json の節を参照
let bgmMetaCache = null;
async function loadBgmMeta(){
  if(bgmMetaCache !== null) return bgmMetaCache;
  let tracks = [];
  try{
    const res = await fetch(`${AUDIO_BASE_URL}/bgm/meta.json`);
    if(res.ok){
      const j = await res.json();
      if(Array.isArray(j.tracks)) tracks = j.tracks.filter(t => t && t.title && t.path);
    }
  }catch(err){ console.warn('meta.json の読み込みに失敗:', err); }
  // FlipSide を解禁するまで、flipside/ の曲は「そもそも存在しない」ものとして扱う
  if(!(state.flipside && state.flipside.unlocked)){
    tracks = tracks.filter(t => !String(t.path).replace(/^\.\//, '').startsWith('flipside/'));
  }
  bgmMetaCache = tracks;
  return bgmMetaCache;
}
// meta.json の path（"./home/ro1.mp3" など、bgm/ からの相対パス）を実URLに変換する
function bgmMetaUrl(path){
  const rel = String(path || '').replace(/^\.\//, '');
  return `${AUDIO_BASE_URL}/bgm/${rel}`;
}

// いまのゾーンで流す曲の候補（行事版があれば先に、通常版をその次に）を1つずつ選ぶ
// excludeName を渡すと、その曲は（ほかに曲があるかぎり）選ばない。曲が終わったあとに同じ曲が続かないようにするため
async function pickZoneBgm(zone, excludeName){
  const prefix = zone === 'home' ? 'ro' : (zone === 'flipside' ? 'fl' : 'vs');
  const normalNames = await scanBgmFolder(zone, prefix);
  const ev = (state.settings.eventSkins !== false && activeTab !== 'flipside') ? activeEvent() : null;
  const pickOne = (names, folder) => {
    let pool = names;
    if(excludeName){
      const others = names.filter(n => (folder + '/' + n) !== excludeName);
      if(others.length) pool = others;
    }
    return folder + '/' + pool[Math.floor(Math.random() * pool.length)];
  };

  const candidates = [];
  if(ev){
    const evFolder = `event/${ev.id}/${zone}`;
    const evNames = await scanBgmFolder(evFolder, prefix);
    if(evNames.length) candidates.push(pickOne(evNames, evFolder));
  }
  if(normalNames.length) candidates.push(pickOne(normalNames, zone));
  return candidates;
}
async function playZoneBGM(zone, excludeName){
  const candidates = await pickZoneBgm(zone, excludeName);
  if(!candidates.length) return;   // まだ音源が置かれていない
  // 前の曲はフェードアウトし、次の曲はフェードインなしでそのまま鳴らす
  playBGM(candidates, false);
}
// ゾーンが切り替わったときだけ曲を選び直す。force を渡すと、
// ゾーンが同じでも改めて鳴らす（音声の許可が下りた直後などに使う）
let bgmInBattle = null;   // 直前に音量・オンオフの判定に使った「対局中かどうか」
function updateBGM(force){
  // FlipSide にいる間は、対局の開始・終了で曲を変えず、O-LABO 本編に戻るまで同じ曲を流す。
  // 一方、音量・オンオフは「ホーム」「対局中」で別々の設定を見るため、
  // 曲を選び直すべきか（ゾーンが変わった）と、音量だけ再適用すればよいか（対局中かどうかだけ変わった）を分けて扱う
  const inBattle = isPlayingBoard();
  const zone = (activeTab === 'flipside') ? 'flipside' : (inBattle ? 'battling' : 'home');
  const zoneChanged = zone !== bgmZone;
  const contextChanged = inBattle !== bgmInBattle;
  if(!force && !zoneChanged && !contextChanged) return;
  bgmZone = zone;
  bgmInBattle = inBattle;

  if(!bgmEnabledNow()){
    stopBGM(true);
    audioState.desiredKey = null; audioState.desiredBGM = null;
    return;
  }
  if(force || zoneChanged || !audioState.bgmNode){
    playZoneBGM(zone);          // ゾーンが変わった（または鳴っていない）ので、曲を選び直す
  } else {
    applyBgmVolume();           // 曲はそのまま、音量だけ今のコンテキストに合わせる
  }
}

// 「ホーム」（メニュー画面全般）か「対局中」（FlipSide の対局も含む）かで、
// BGM・効果音のオンオフと音量をそれぞれ別に持てるようにしている
function bgmEnabledNow(){
  const st = state.settings || {};
  return (isPlayingBoard() ? st.battleBgmEnabled : st.homeBgmEnabled) !== false;
}
function seEnabledNow(){
  const st = state.settings || {};
  return (isPlayingBoard() ? st.battleSeEnabled : st.homeSeEnabled) !== false;
}
// 設定から実際の音量（0〜1）を取り出す
function bgmVolumeNow(){
  if(!bgmEnabledNow()) return 0;
  const st = state.settings || {};
  const vol = isPlayingBoard() ? st.battleBgmVolume : st.homeBgmVolume;
  return Math.max(0, Math.min(100, vol ?? 50)) / 100;
}
function seVolumeNow(){
  if(!seEnabledNow()) return 0;
  const st = state.settings || {};
  const vol = isPlayingBoard() ? st.battleSeVolume : st.homeSeVolume;
  return Math.max(0, Math.min(100, vol ?? 70)) / 100;
}

// 再生中のBGMの音量を、設定を変えた瞬間に反映する
function applyBgmVolume(){
  if(audioState.bgmGain && audioContext){
    audioState.bgmGain.gain.setTargetAtTime(bgmVolumeNow(), audioContext.currentTime, 0.05);
  }
}

// BGMを流す。ファイルは必要になった時点で読み込む。
// 曲名を配列で渡すと、先頭から順に探して最初に見つかった曲を鳴らす
// （行事版が無ければ通常の曲、というように段階的に探すため）
async function playBGM(names, fadeIn=true){
  const list = (Array.isArray(names) ? names : [names]).filter(Boolean);
  if(!list.length) return;
  const key = list.join('|');
  audioState.desiredKey = key;              // 鳴らしたい曲を覚えておく
  audioState.desiredBGM = list[list.length-1];
  if(!bgmEnabledNow()) return;

  const ctx = await initAudioContext();
  if(!ctx) return;
  if(ctx.state === 'suspended') return;     // まだ操作されていない（後で鳴らす）

  // 先頭から順に探し、最初に見つかった曲を使う
  let bgmName = null, buffer = null;
  for(const name of list){
    buffer = await loadAudioFile('bgm', name);
    if(audioState.desiredKey !== key) return;   // 読み込み中に別の場面へ切り替わった
    if(buffer){ bgmName = name; break; }
  }
  if(!buffer) return;
  if(audioState.currentBGM === bgmName && audioState.bgmNode) return;   // 同じ曲なら続ける

  stopBGM(true);
  try{
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.loop = false;   // 同じ曲をくり返さず、1曲鳴り終わったら次の曲へ進む
    source.onended = () => {
      // 手動で止めたとき・場面が切り替わったときは、すでに別の曲が登録されているので何もしない
      if(audioState.bgmNode !== source) return;
      const last = audioState.currentBGM;
      audioState.bgmNode = null; audioState.bgmGain = null; audioState.currentBGM = null;
      if(!bgmEnabledNow()) return;
      playZoneBGM(bgmZone, last);
    };

    const gain = ctx.createGain();
    const target = bgmVolumeNow();
    gain.gain.value = fadeIn ? 0 : target;
    source.connect(gain);
    gain.connect(ctx.destination);
    if(fadeIn) gain.gain.linearRampToValueAtTime(target, ctx.currentTime + 0.8);

    source.start(0);
    audioState.bgmNode = source;
    audioState.bgmGain = gain;
    audioState.currentBGM = bgmName;
  }catch(err){
    console.warn('BGMの再生に失敗:', err);
  }
}

function stopBGM(fadeOut=false){
  const node = audioState.bgmNode, gain = audioState.bgmGain;
  audioState.bgmNode = null; audioState.bgmGain = null; audioState.currentBGM = null;
  if(!node || !audioContext) return;
  try{
    if(fadeOut && gain){
      gain.gain.setTargetAtTime(0, audioContext.currentTime, 0.12);
      node.stop(audioContext.currentTime + 0.5);
    } else {
      node.stop();
    }
  }catch(err){ /* すでに停止している場合は無視 */ }
}

async function playSE(seName){
  if(!seEnabledNow()) return;
  const ctx = await initAudioContext();
  if(!ctx || ctx.state === 'suspended') return;

  const buffer = await loadAudioFile('se', seName);
  if(!buffer) return;
  try{
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    const gain = ctx.createGain();
    gain.gain.value = seVolumeNow();
    source.connect(gain);
    gain.connect(ctx.destination);
    source.start(0);
  }catch(err){
    console.warn('効果音の再生に失敗:', err);
  }
}

// 認証のエラーを日本語にする
function authErrorText(err){
  const c = err && err.code;
  const map = {
    'auth/invalid-email': 'メールアドレスの形式が正しくありません',
    'auth/user-not-found': 'そのメールアドレスのアカウントが見つかりません',
    'auth/wrong-password': 'パスワードが違います',
    'auth/invalid-credential': 'メールアドレスまたはパスワードが違います',
    'auth/email-already-in-use': 'そのメールアドレスはすでに使われています',
    'auth/weak-password': 'パスワードは6文字以上にしてください',
    'auth/popup-closed-by-user': 'ログインが中断されました',
    'auth/popup-blocked': 'ポップアップがブロックされました。設定を確認してください',
    'auth/cancelled-popup-request': '',
    'auth/operation-not-allowed': 'この方法でのログインが有効になっていません',
    'auth/unauthorized-domain': 'このドメインが許可されていません',
    'auth/network-request-failed': '通信できませんでした。ネットワークを確認してください',
    'auth/credential-already-in-use': 'そのアカウントはすでに別の利用者が使っています',
    'auth/requires-recent-login': 'もう一度ログインしてから操作してください'
  };
  if(c && map[c] !== undefined) return map[c];
  return '処理に失敗しました' + (c ? '（' + c + '）' : '');
}

// メールでアカウントを作る。ゲストで遊んでいた場合はそのまま引き継ぐ
async function accountSignUpEmail(email, password){
  if(accountBusy) return;
  accountBusy = true; accountError = ''; render();
  try{
    if(!(await ensureFirebase({passive:true}))) throw new Error(fbInitError);
    const cred = firebase.auth.EmailAuthProvider.credential(email, password);
    const cur = firebase.auth().currentUser;
    if(cur && cur.isAnonymous){
      try{
        await cur.linkWithCredential(cred);   // ゲストの記録を引き継ぐ
      }catch(err){
        const code = err && err.code;
        // すでにそのアドレスで登録済みなら、そのままログインする
        if(code === 'auth/email-already-in-use' || code === 'auth/credential-already-in-use'){
          await firebase.auth().signInWithEmailAndPassword(email, password);
          toast('登録済みのアカウントにログインしました');
          sub.settings = 'home';
          return;
        }
        throw err;
      }
    } else {
      await firebase.auth().createUserWithEmailAndPassword(email, password);
    }
    // 実在するメールアドレスかどうかを確かめるため、確認メールを送る。
    // 確認が済むまでは、大会エントリーなど荒らしに使われやすい一部の機能を制限する
    fbUser = firebase.auth().currentUser;
    try{
      if(fbUser && !fbUser.emailVerified) await sendVerifyMailWithFallback(fbUser);
    }catch(err){ console.warn('確認メールの送信に失敗:', err); }
    recomputeEmailVerified();
    toast('アカウントを作成しました。届いたメールのリンクから、メールアドレスの認証をお願いします');
    sub.settings = 'home';
  }catch(err){
    console.error(err);
    accountError = authErrorText(err);
    if(accountError) toast(accountError);
  }finally{
    accountBusy = false; render();
  }
}

async function accountLoginEmail(email, password){

    console.error(err);

    if(accountError) toast(accountError);

async function accountLoginGoogle(){
  if(accountBusy) return;
  accountBusy = true; accountError = ''; render();
  // 万一応答が返らない場合にそなえ、一定時間で操作できる状態に戻す
  const guard = setTimeout(()=>{
    if(accountBusy && !accountRedirecting){
      accountBusy = false;
      accountError = 'ログインの応答がありませんでした。もう一度お試しください';
      toast(accountError);
      render();
    }
  }, 45000);
  try{
    if(!(await ensureFirebase({passive:true}))) throw new Error(fbInitError);
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    const cur = firebase.auth().currentUser;

    if(cur && cur.isAnonymous){
      try{
        // ゲストの記録をそのまま引き継ぐ
        await cur.linkWithPopup(provider);
      }catch(err){
        const code = err && err.code;
        // すでに使われているアカウントだった場合、
        // 失敗時に返る認証情報でそのままログインする。
        // （ここで再びポップアップを開くとブラウザに阻まれて止まってしまう）
        if(code === 'auth/credential-already-in-use' || code === 'auth/email-already-in-use'){
          const cred = err.credential
            || (firebase.auth.GoogleAuthProvider.credentialFromError
                ? firebase.auth.GoogleAuthProvider.credentialFromError(err)
                : null);
          if(cred){
            await firebase.auth().signInWithCredential(cred);
          } else {
            // 認証情報が取れない場合だけ、あらためてログインし直す
            await googleSignInWithFallback(provider);
          }
        } else if(isPopupProblem(code)){
          await firebase.auth().signInWithRedirect(provider);
          return;   // 画面が切り替わるのでここで終了
        } else throw err;
      }
    } else {
      await googleSignInWithFallback(provider);
      if(accountRedirecting) return;
    }
    toast('ログインしました');
    sub.settings = 'home';
  }catch(err){
    console.error(err);
    accountError = authErrorText(err);
    if(accountError) toast(accountError);
  }finally{
    clearTimeout(guard);
    accountBusy = false; render();
  }
}

// ポップアップが使えない環境では、画面遷移でのログインに切り替える
let accountRedirecting = false;
function isPopupProblem(code){
  return code === 'auth/popup-blocked'
      || code === 'auth/operation-not-supported-in-this-environment'
      || code === 'auth/web-storage-unsupported'
      || code === 'auth/popup-closed-by-user' && false;   // 利用者が閉じた場合は切り替えない
}
async function googleSignInWithFallback(provider){
  try{
    await saveBeforeSwitchingAccount();
    await firebase.auth().signInWithPopup(provider);
  }catch(err){
    if(isPopupProblem(err && err.code)){
      accountRedirecting = true;
      await firebase.auth().signInWithRedirect(provider);
      return;
    }
    throw err;
  }
}

   端末のデータの「持ち主」の管理

// 端末のデータを初期状態に戻す。音量など、端末ごとの設定だけは残す
function resetLocalSaveForNewOwner(){
  const keep = {};
  for(const k of DEVICE_ONLY_SETTINGS) keep[k] = state.settings[k];
  state = structuredClone(DEFAULT_STATE);
  Object.assign(state.settings, keep);
  state.lineageId = newLineageId();
}
// ログイン（ゲスト含む）が確定したとき、端末のデータの持ち主を確かめる。
// 別の登録アカウントのデータが残っていたら、引き継がずに初期化する。戻り値：初期化したかどうか
function reconcileLocalOwner(user){
  if(!user) return false;
  const own = state.owner || {};
  let wiped = false;
  if(own.uid && own.uid !== user.uid && own.anon === false){
    resetLocalSaveForNewOwner();
    wiped = true;
  }
  const cur = { uid: user.uid, anon: !!user.isAnonymous };
  const changed = wiped || !state.owner || state.owner.uid !== cur.uid || state.owner.anon !== cur.anon || !state.lineageId;
  state.owner = cur;
  ensureLineage();
  if(changed) saveState({ noCloud:true });   // このあと同期の処理が、クラウドと見比べて正しく保存する
  return wiped;
}

// フレンド用の短いID（見間違えやすい文字は使わない）
const ID_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function makeUserCode(){
  let s = '';
  for(let i=0;i<8;i++) s += ID_CHARS[Math.floor(Math.random()*ID_CHARS.length)];
  return s;
}

// 利用者の登録情報を用意する（無ければ作る）
// users/<自分> の記録を用意する（なければ作り、IDがなければ付ける）。同時に何度呼ばれても、動くのは1回だけ
let ensureUserRecordPromise = null, ensureUserRecordUid = '', myUserRecordUid = '';
function ensureUserRecord(){
  if(!fbDb || !fbUid) return Promise.resolve(null);
  if(ensureUserRecordPromise && ensureUserRecordUid === fbUid) return ensureUserRecordPromise;
  ensureUserRecordUid = fbUid;
  const p = ensureUserRecordInner().finally(() => { if(ensureUserRecordPromise === p) ensureUserRecordPromise = null; });
  ensureUserRecordPromise = p;
  return p;
}
// 自分の記録（ID付き）が用意できているか。users/<自分> の下に何かを書く前に確かめる。
// 先に別の項目だけが書かれると、IDのない記録が残ってしまうため
function userRecordReady(){
  return !!(myUserRecord && myUserRecord.code && myUserRecordUid && myUserRecordUid === fbUid);
}
// 重複しないIDが取れるまで数回試す
async function allocateUserCode(uid){
  for(let i=0;i<6;i++){
    const cand = makeUserCode();
    const res = await fbDb.ref('userCodes/' + cand).transaction(cur => (cur === null) ? uid : undefined);
    if(res.committed) return cand;
  }
  return uid.slice(0,8).toUpperCase();
}
async function ensureUserRecordInner(){
  const uid = fbUid;
  try{
    const ref = fbDb.ref('users/' + uid);
    const snap = await ref.once('value');
    let rec = snap.val();
    // 停止中で、データを削除済みの人：記録を書き足して「復活」させない（停止の記録だけが残っている状態）
    if(rec && rec.banned && rec.deletedAt){
      if(fbUid === uid){ myUserRecord = rec; myUserRecordUid = uid; }
      return rec;
    }
    // データ削除済みのあと、停止が解除された人：新しいアカウントとして作り直す
    const reborn = !!(rec && rec.deletedAt && !rec.banned);
    if(!rec || reborn){
      rec = {
        code: await allocateUserCode(uid),
        name: state.username || 'プレイヤー',
        guest: !!(fbUser && fbUser.isAnonymous),
        createdAt: Date.now()
      };
      if(reborn) rec.deletedAt = null;   // 削除済みの印を外す
      // set だと users/<自分> 全体への書き込みとして判定され、ルールで拒否される。
      // update なら項目ごとの権限で判定されるので通る。
      await ref.update(rec);
      if(reborn) delete rec.deletedAt;
    } else {
      // 名前やゲスト状態が変わっていたら更新する
      const patch = {};
      // 何かの拍子にIDのない記録ができていたら、ここでIDを付け直す
      if(!rec.code){
        patch.code = await allocateUserCode(uid);
        if(!rec.createdAt) patch.createdAt = Date.now();
      }
      const nm = state.username || 'プレイヤー';
      if(rec.name !== nm) patch.name = nm;
      const g = !!(fbUser && fbUser.isAnonymous);
      if(rec.guest !== g) patch.guest = g;
      patch.lastSeen = Date.now();
      await ref.update(patch);
      Object.assign(rec, patch);
    }
    if(fbUid === uid){ myUserRecord = rec; myUserRecordUid = uid; }
    return rec;
  }catch(err){
    console.warn('利用者情報の用意に失敗:', err);
    return null;
  }
}
let myUserRecord = null;
function myUserCode(){ return myUserRecord && myUserRecord.code ? myUserRecord.code : '--------'; }

// どちらのデータが進んでいるかを数値にする
function progressScore(st){
  if(!st) return -1;
  const unlocked = st.casual && st.casual.unlocked
    ? Object.keys(st.casual.unlocked).filter(k => st.casual.unlocked[k]).length : 0;
  const rankIdx = (st.training && st.training.rankIndex) || 0;
  const xNum    = (st.training && st.training.xNumber) || 0;
  const rank    = st.playerRank || 0;
  const games   = st.totalGames || 0;
  const wins    = st.totalWins || 0;
  const stella  = (st.settings && st.settings.stellaUnlocked) ? 1 : 0;
  // 解禁数をいちばん重く見て、次に特訓ランク、最後に対局数で比べる
  const fs = st.flipside || {};
  const flipGate = fs.unlocked ? 1 : 0;
  const flipUnl = fs.flip && fs.flip.unlocked ? Object.keys(fs.flip.unlocked).filter(k => fs.flip.unlocked[k]).length : 0;
  return flipGate*2e11 + flipUnl*1e9 + unlocked*1e9 + rankIdx*1e7 + xNum*1e5 + stella*5e4 + rank*100 + wins*2 + games;
}

// 進捗を人が読める形でまとめる（記録の選択画面に出すため）
function progressSummary(st){
  if(!st) return null;
  const unlocked = st.casual && st.casual.unlocked
    ? Object.keys(st.casual.unlocked).filter(k => st.casual.unlocked[k]).length : 0;
  const rankIdx = (st.training && st.training.rankIndex) || 0;
  const games = st.totalGames || 0;
  const wins = st.totalWins || 0;
  const fs = st.flipside || {};
  const flipGate = !!fs.unlocked;
  const flipUnl = fs.flip && fs.flip.unlocked ? Object.keys(fs.flip.unlocked).filter(k => fs.flip.unlocked[k]).length : 0;
  return { unlocked, rankIdx, games, wins, flipGate, flipUnl };
}
function progressSummaryText(sum){
  if(!sum) return 'まだ記録がありません';
  const parts = [`ゆるモード解禁 ${sum.unlocked}/100`, `特訓ランク ${RANK_LADDER[sum.rankIdx] || RANK_LADDER[0]}`, `通算 ${sum.games}戦${sum.wins}勝`];
  if(sum.flipGate) parts.push('FlipSide解禁済み');
  return parts.join('・');
}
// 2つの進捗に「選んでもらうべき」ほどの大きな差があるかどうか
function progressDiffersALot(a, b){
  if(!a || !b) return false;
  if(Math.abs(a.unlocked - b.unlocked) >= 10) return true;   // ゆるモード解禁数が10個以上違う
  if(Math.abs(a.rankIdx - b.rankIdx) >= 3) return true;       // 特訓ランクが3段階以上違う
  if(a.flipGate !== b.flipGate) return true;                  // FlipSideの解禁状態が違う
  if(Math.abs(a.flipUnl - b.flipUnl) >= 3) return true;        // Flipモードの解禁数が3個以上違う
  if(Math.abs(a.games - b.games) >= 100) return true;          // 通算対局数が100以上違う
  return false;
}
// クラウドの記録を、この端末に適用する（端末ごとの音量設定は保ったまま）
function applyCloudSave(cloud){
  const myDeviceSettings = {};
  for(const k of DEVICE_ONLY_SETTINGS) myDeviceSettings[k] = state.settings[k];
  state = deepMerge(structuredClone(DEFAULT_STATE), cloud.data);
  Object.assign(state.settings, myDeviceSettings);
  stampLocalOwner();
  ensureLineage();
  trimHistories(HISTORY_LIMIT, REPLAY_LIMIT);
  saveState();
}

// 保存する形に整える（容量を抑えるため履歴を削る）
// 端末ごとに変えたい設定。クラウドには保存せず、この端末の localStorage にだけ残す
// （同じアカウントでも、端末によって音量を変えたい場合があるため）
const DEVICE_ONLY_SETTINGS = [
  'bgmEnabled', 'bgmVolume', 'seEnabled', 'seVolume',   // 旧設定（移行用に残っているだけ）
  'homeBgmEnabled', 'homeBgmVolume', 'homeSeEnabled', 'homeSeVolume',
  'battleBgmEnabled', 'battleBgmVolume', 'battleSeEnabled', 'battleSeVolume'
];
function stripDeviceOnlySettings(settingsObj){
  if(!settingsObj) return settingsObj;
  const copy = Object.assign({}, settingsObj);
  for(const k of DEVICE_ONLY_SETTINGS) delete copy[k];
  return copy;
}

function makeCloudPayload(){
  trimHistories(HISTORY_LIMIT, REPLAY_LIMIT);
  const copy = JSON.parse(JSON.stringify(state));
  copy.settings = stripDeviceOnlySettings(copy.settings);
  return { data: copy, progress: progressScore(copy), updatedAt: Date.now() };
}

async function cloudSaveNow(){
  if(!fbDb || !fbUid || cloudSaveSuspended) return false;
  try{
    await fbDb.ref('saves/' + fbUid).set(makeCloudPayload());
    return true;
  }catch(err){
    console.warn('クラウド保存に失敗:', err);
    return false;
  }
}

// ログイン直後：端末とクラウドを比べ、進んでいるほうを使う
let pendingSyncCloud = null;   // 選択待ちのクラウドデータ（差が大きいときだけ使う）
async function syncAfterLogin(){
  if(!fbDb || !fbUid) return;
  try{
    const snap = await fbDb.ref('saves/' + fbUid).once('value');
    const cloud = snap.val();

    if(!cloud || !cloud.data){
      // クラウドに記録がまだ無い（初めてのログイン）→ この端末の記録を保存するだけ
      await cloudSaveNow();
      await ensureUserRecord();
      return;
    }

    const localSummary = progressSummary(state);
    const cloudSummary = progressSummary(cloud.data);

    if(progressDiffersALot(localSummary, cloudSummary)){
      // 差が大きいので、自動では決めずに選んでもらう
      pendingSyncCloud = cloud;
      showSaveConflictChoice(localSummary, cloudSummary);
      await ensureUserRecord();
      return;
    }

    const localScore = progressScore(state);
    const cloudScore = cloud.progress ?? progressScore(cloud.data);
    if(cloudScore > localScore){
      applyCloudSave(cloud);
      toast('クラウドの記録を読み込みました');
    } else {
      await cloudSaveNow();
      toast('この端末の記録をクラウドに保存しました');
    }
    await ensureUserRecord();
  }catch(err){
    console.warn('同期に失敗:', err);
    toast('クラウドとの同期に失敗しました');
  }
}

/* ============================================================
   マイページ（プロフィール・在席状態）
   ※ここのデータはセーブデータとは別に保存するため、容量制限に含まれない
   ============================================================ */
const BIO_MAX = 300;
const ICON_SIZE = 160;        // 保存する画像の大きさ
const ICON_MAX_BYTES = 60000; // 保存できる上限

// 選んだ画像を正方形に切り抜いて縮小する。
// そのまま保存すると重すぎるため、端末側で小さくしてから送る。
function imageToIconDataUrl(file){
  return new Promise((resolve, reject) => {
    if(!file) return reject(new Error('ファイルがありません'));
    if(!/^image\//.test(file.type)) return reject(new Error('画像を選んでください'));
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('画像を読み込めませんでした'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('画像を読み込めませんでした'));
      img.onload = () => {
        try{
          const side = Math.min(img.width, img.height);
          const sx = (img.width - side) / 2;
          const sy = (img.height - side) / 2;
          const cv = document.createElement('canvas');
          cv.width = ICON_SIZE; cv.height = ICON_SIZE;
          const ctx = cv.getContext('2d');
          ctx.drawImage(img, sx, sy, side, side, 0, 0, ICON_SIZE, ICON_SIZE);
          let q = 0.82, out = cv.toDataURL('image/jpeg', q);
          // 大きすぎる場合は画質を落として収める
          while(out.length > ICON_MAX_BYTES && q > 0.35){
            q -= 0.12;
            out = cv.toDataURL('image/jpeg', q);
          }
          if(out.length > ICON_MAX_BYTES) return reject(new Error('画像が大きすぎます'));
          resolve(out);
        }catch(err){ reject(err); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// アイコンから代表的な色を取り出す。
// マイページの見出しの背景に使う。
function extractIconColor(dataUrl){
  return new Promise(resolve => {
    if(!dataUrl || !dataUrl.startsWith('data:')) return resolve(null);
    const img = new Image();
    img.onerror = () => resolve(null);
    img.onload = () => {
      try{
        const n = 24;
        const cv = document.createElement('canvas');
        cv.width = n; cv.height = n;
        const ctx = cv.getContext('2d');
        ctx.drawImage(img, 0, 0, n, n);
        const d = ctx.getImageData(0, 0, n, n).data;

        // 色みのまとまりごとに数える（灰色は候補から外す）
        const bins = {};
        let sumR=0, sumG=0, sumB=0, count=0;
        for(let i=0;i<d.length;i+=4){
          const r=d[i], g=d[i+1], b=d[i+2], a=d[i+3];
          if(a < 128) continue;
          sumR+=r; sumG+=g; sumB+=b; count++;
          const key = (r>>5)+'_'+(g>>5)+'_'+(b>>5);
          if(!bins[key]) bins[key] = {n:0, r:0, g:0, b:0};
          const t = bins[key];
          t.n++; t.r+=r; t.g+=g; t.b+=b;
        }
        if(!count) return resolve(null);

        let best=null, bestScore=-1;
        for(const k of Object.keys(bins)){
          const t = bins[k];
          const r=t.r/t.n, g=t.g/t.n, b=t.b/t.n;
          const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
          const sat = mx ? (mx-mn)/mx : 0;
          // 多く使われていて、かつ色みがはっきりしているものを選ぶ
          const score = t.n * (0.35 + sat);
          if(score > bestScore){ bestScore = score; best = {r,g,b}; }
        }
        const c = best || {r:sumR/count, g:sumG/count, b:sumB/count};
        resolve({ r:Math.round(c.r), g:Math.round(c.g), b:Math.round(c.b) });
      }catch(err){ resolve(null); }
    };
    img.src = dataUrl;
  });
}
// 背景の明るさから、読みやすい文字色を決める
function colorLum(c){
  const f = v => { v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
  return 0.2126*f(c.r) + 0.7152*f(c.g) + 0.0722*f(c.b);
}
function textColorFor(c){
  if(!c) return '#fff';
  return colorLum(c) > 0.18 ? '#1b1a17' : '#ffffff';
}
// 中くらいの明るさだと文字が沈むので、薄い影を敷いて読みやすくする
function textShadowFor(c){
  if(!c) return '';
  const L = colorLum(c);
  if(L > 0.55) return 'text-shadow:0 1px 2px rgba(255,255,255,.55);';
  if(L < 0.08) return '';
  return (textColorFor(c) === '#ffffff')
    ? 'text-shadow:0 1px 3px rgba(0,0,0,.55);'
    : 'text-shadow:0 1px 2px rgba(255,255,255,.6);';
}
function shade(c, k){
  const m = v => Math.max(0, Math.min(255, Math.round(v*k)));
  return `rgb(${m(c.r)},${m(c.g)},${m(c.b)})`;
}

function isPlayingBoard(){
  if(!game || game.over) return false;
  if(activeTab === 'basic'){
    const m = currentBasicMode;
    if(m === 'online') return game.mode === 'online' && sub.online === 'play';
    if(m === 'casual' && stellaChallengeActive) return game.mode === 'casual';
    return game.mode === m && sub[m] === 'play';
  }
  if(activeTab === 'flipside'){
    return game.mode === 'casual' && sub.flipside === 'play' && isFlipGame();
  }
  if(activeTab === 'ranker'){
    if(currentRankerMode === 'match') return game.mode === 'match' && sub.match === 'play';
    if(currentRankerMode === 'event') return game.mode === 'event' && sub.event === 'play';
    return false;
  }
  if(activeTab === 'adventure'){
    // バラエティモードは v.2.5.0 で廃止（工事中）のため、ここに来ることはない
    return currentAdventureMode === 'variety' && game.mode === 'variety' && sub.variety === 'play';
  }

// 自動で付く称号（条件を満たすと本人の端末が付与する）
const AUTO_TITLES = {
  auto_casual_master:      { name:'ゆるモード制覇者',   desc:'ゆるモードの全難易度を解禁し、すべてに勝利した', color:'#0f7a3f', createdAt:1, auto:true },
  auto_casual_master_true: { name:'真・ゆるモード制覇者', desc:'ゆるモードの全難易度で完封勝利した',               color:'#b8860b', createdAt:2, auto:true }
};
// 称号の一覧（管理者ページで作ったもの＋自動で付くもの）
let titleCatalog = Object.assign({}, AUTO_TITLES);
let myTitleIds = [];
let myTitlesRevoked = {};   // 管理者が外した自動の称号（付け直さない）
let myBanned = false, myBanReason = '';
let myEmailVerified = true;   // メールの認証が有効なら true（メール/パスワードのアカウントで未認証・期限切れなら false。ゲストやGoogleのみは常に true）
const EMAIL_REVERIFY_MS = 90*24*60*60*1000;   // 認証の有効期間（おおむね3ヶ月に1回、認証し直してもらう）
let myEmailVerifiedAt = 0;         // 最後にメールで認証した時刻（users/<uid>/emailVerifiedAt）
let emailLinkUnavailable = false;  // 再認証用のメールリンクが、サーバー側でまだ有効化されていない場合
let emailAuthBusy = false;
let emailVerifiedJustNow = false;  // メールのリンクで認証した直後（ログインし直した後に記録するため）
let emailLinkHandled = false;

// 対象はメール/パスワードで登録したアカウントだけ（ゲストや、Googleだけで登録した人は対象外）
function emailAuthApplies(){ return !!(fbUser && !fbUser.isAnonymous && hasProvider('password')); }
function emailAuthDaysLeft(){
  if(!myEmailVerifiedAt) return 0;
  return Math.ceil((myEmailVerifiedAt + EMAIL_REVERIFY_MS - Date.now()) / 86400000);
}
function persistEmailVerifiedAt(){
  if(!fbDb || !fbUid || !myEmailVerifiedAt || !userRecordReady()) return;
  fbDb.ref('users/' + fbUid + '/emailVerifiedAt').set(myEmailVerifiedAt).catch(()=>{});
}
// 認証が有効かどうかを、いまの状態から決め直す
function recomputeEmailVerified(){
  if(!emailAuthApplies()){ myEmailVerified = true; return; }
  if(fbUser.emailVerified && !myEmailVerifiedAt){
    // メールの確認は済んでいるが記録がまだ無い＝いま確認できたところなので、この時刻を認証日時にする
    myEmailVerifiedAt = Date.now();
    persistEmailVerifiedAt();
  }
  const fresh = myEmailVerifiedAt && (Date.now() - myEmailVerifiedAt) < EMAIL_REVERIFY_MS;
  myEmailVerified = !!(fbUser.emailVerified && fresh);
  // 再認証のメールを送れない設定のときは、確認済みの人を止めない（お知らせだけ出す）
  if(!myEmailVerified && emailLinkUnavailable && fbUser.emailVerified) myEmailVerified = true;
}
// 認証が必要な機能の入り口で使う
function requireEmailAuth(){
  if(myEmailVerified) return true;
  toast('この機能を使うには、メールアドレスの認証が必要です。ホームの案内から認証してください');
  return false;
}
function authContinueUrl(){ return location.origin + location.pathname; }
function cleanAuthUrl(){ try{ history.replaceState(null, '', location.origin + location.pathname); }catch(e){} }
// 確認メール（初めての認証用）を送る。戻り先を指定できない設定なら、指定なしで送り直す
async function sendVerifyMailWithFallback(user){
  try{ await user.sendEmailVerification({ url: authContinueUrl() }); }
  catch(err){
    const c = err && err.code;
    if(c === 'auth/unauthorized-continue-uri' || c === 'auth/invalid-continue-uri' || c === 'auth/missing-continue-uri'){
      await user.sendEmailVerification();
    } else throw err;
  }
}
function fmtMonthDay(ms){ const d = new Date(ms); return `${d.getMonth()+1}月${d.getDate()}日`; }
// 設定画面のアカウント欄に出す、メール認証の状態と案内
function emailAuthCardMarkup(){
  if(!emailAuthApplies()) return '';
  const firstTime = !fbUser.emailVerified;

  const row = `<div class="acc-row"><span class="acc-k">メール認証</span><span class="acc-v" style="color:${myEmailVerified?'var(--jade-deep)':'#b3261e'};">${stateText}</span></div>`;

      ${firstTime ? `<button class="btn btn-ghost" data-action="refresh-email-auth" style="width:100%; margin-top:8px;">メールのリンクを開いた（状態を更新）</button>` : ''}

// ホームに出す、メール認証のお知らせ
function emailAuthBannerMarkup(){
  if(!emailAuthApplies()) return '';
  if(!myEmailVerified){
    return `<button class="home-email-banner is-required" data-action="go-email-auth">

// 「認証メールを送る」ボタン。初めての認証は確認メール、3ヶ月ごとの再認証はメールのリンク
async function sendAuthMail(){
  if(!emailAuthApplies() || emailAuthBusy) return;
  emailAuthBusy = true; render();
  try{
    if(!fbUser.emailVerified){
      await sendVerifyMailWithFallback(fbUser);
      toast('認証メールを送りました。メールのリンクを開いたあと、「認証した」を押してください');
    } else {
      try{ localStorage.setItem('olabo_email_link_addr', fbUser.email || ''); }catch(e){}
      await firebase.auth().sendSignInLinkToEmail(fbUser.email, { url: authContinueUrl(), handleCodeInApp: true });
      toast('認証メールを送りました。メールのリンクを開いてください');
    }
  }catch(err){
    const code = err && err.code;
    if(code === 'auth/operation-not-allowed'){
      emailLinkUnavailable = true; recomputeEmailVerified();
      toast('再認証メールの送信は準備中のため、今はそのままご利用いただけます');
    } else if(code === 'auth/too-many-requests'){ toast('少し時間をおいてから、もう一度お試しください'); }
    else if(code === 'auth/unauthorized-continue-uri'){ toast('認証メールを送れませんでした（サーバー側の設定が必要です）'); }
    else toast('認証メールを送れませんでした');
  }finally{ emailAuthBusy = false; render(); }
}
// メールのリンクを開いて戻ってきたあと、認証できたかを確かめる
async function refreshEmailAuth(showToast){
  if(!fbUser || fbUser.isAnonymous) return;
  const wasFirebaseVerified = !!fbUser.emailVerified;
  try{
    await fbUser.reload(); fbUser = firebase.auth().currentUser;
    if(fbDb && fbUid){
      const s = await fbDb.ref('users/' + fbUid + '/emailVerifiedAt').once('value');
      const v = s.val();
      if(typeof v === 'number') myEmailVerifiedAt = v;
    }
    // 確認済みに変わったら、サーバー側のルールにも伝わるよう、証明書(トークン)も作り直す
    if(!wasFirebaseVerified && fbUser.emailVerified) await fbUser.getIdToken(true);
  }catch(err){}
  const before = myEmailVerified;
  recomputeEmailVerified();
  syncEmailVerifiedFlag();
  if(showToast) toast(myEmailVerified ? '認証できました' : 'まだ認証を確認できません。メールのリンクを開いたあと、もう一度お試しください');
  if(!before && myEmailVerified) publishStats();
  render();
}
// 管理者が見られるよう、Firebase上で確認済みかどうかも控えておく
function syncEmailVerifiedFlag(){
  if(fbDb && fbUid && emailAuthApplies() && userRecordReady()){
    fbDb.ref('users/' + fbUid + '/emailVerified').set(!!fbUser.emailVerified).catch(()=>{});
  }
}
// 3ヶ月ごとの再認証メールのリンクを開いて戻ってきたとき。戻り値：false=何もしなかった / 'reauth'=認証できた / 'switched'=ログインし直した
async function handleEmailLinkReturn(user){
  if(emailLinkHandled) return false;
  const href = location.href;
  let isLink = false;
  try{ isLink = firebase.auth().isSignInWithEmailLink(href); }catch(e){}
  if(!isLink) return false;
  emailLinkHandled = true;
  let email = '';
  try{ email = localStorage.getItem('olabo_email_link_addr') || ''; }catch(e){}
  if(user && !user.isAnonymous && user.email) email = user.email;
  if(!email) email = window.prompt('認証メールを送った、メールアドレスを入力してください') || '';
  email = email.trim();
  if(!email){ cleanAuthUrl(); return false; }
  try{
    if(user && !user.isAnonymous){
      if(user.email && user.email.toLowerCase() !== email.toLowerCase()){
        toast('このリンクは、別のアカウント用の認証メールです'); cleanAuthUrl(); return false;
      }
      await user.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credentialWithLink(email, href));
      emailVerifiedJustNow = true; cleanAuthUrl();
      return 'reauth';
    }
    // ゲストのままリンクを開いた場合は、そのメールのアカウントにログインして認証する
    await firebase.auth().signInWithEmailLink(email, href);
    emailVerifiedJustNow = true; cleanAuthUrl();
    return 'switched';
  }catch(err){
    cleanAuthUrl();
    toast('認証できませんでした。リンクの有効期限が切れているかもしれません。もう一度メールを送ってください');
    return false;
  }
}
async function loadTitlesAndStatus(){
  if(!fbDb || !fbUid) return;
  try{
    const [t, me] = await Promise.all([
      fbDb.ref('titles').once('value'),
      fbDb.ref('users/' + fbUid).once('value')
    ]);
    const dbTitles = t.val() || {};
    titleCatalog = {};
    for(const [id,def] of Object.entries(AUTO_TITLES)) titleCatalog[id] = Object.assign({}, def, dbTitles[id] || {});
    for(const [id,v] of Object.entries(dbTitles)) if(!AUTO_TITLES[id]) titleCatalog[id] = v;
    const u = me.val() || {};
    myTitleIds = titleIdsOf(u);
    myTitlesRevoked = u.titlesRevoked || {};
    const wasBanned = myBanned;
    myBanned = !!u.banned;
    myBanReason = u.banReason || '';
    myEmailVerifiedAt = (typeof u.emailVerifiedAt === 'number') ? u.emailVerifiedAt : 0;
    // BANされたと分かった端末では、この端末に残っているセーブデータそのものを消す
    if(myBanned && !wasBanned){
      try{ localStorage.removeItem('genseki_othello_save_v1'); }catch(err){}
      state = structuredClone(DEFAULT_STATE);
    }
  }catch(err){ console.warn('称号の読み込みに失敗:', err); }
}

// 以前は1つだけ（title）、今は何個でも（titles）持てる。両方を読む
// ゆるモードの達成度を調べる
function casualMastery(){
  const res = (state.casual && state.casual.results) || {};
  const unl = (state.casual && state.casual.unlocked) || {};
  const all = CASUAL_DIFFS.every(d => !d.locked || unl[d.id]);
  const won = CASUAL_DIFFS.every(d => res[d.id] === 'won' || res[d.id] === 'perfect');
  const perfect = CASUAL_DIFFS.every(d => res[d.id] === 'perfect');
  return { allUnlocked: all, allWon: all && won, allPerfect: all && perfect };
}

// 条件を満たしていれば称号を付ける。
// 完封で制覇したら、ふつうの制覇者は外して「真」に置き換える。
let masteryChecking = false;
async function checkAutoTitles(){
  if(masteryChecking || !fbDb || !fbUid || !isSignedIn() || !userRecordReady()) return;
  const m = casualMastery();
  let want = null;
  if(m.allPerfect) want = 'auto_casual_master_true';
  else if(m.allWon) want = 'auto_casual_master';
  if(!want) return;
  // 管理者が外した称号は、条件を満たしていても付け直さない
  if(myTitlesRevoked[want]) return;
  if(myTitleIds.includes(want) && !(want === 'auto_casual_master_true' && myTitleIds.includes('auto_casual_master'))) return;

  masteryChecking = true;
  try{
    const ref = fbDb.ref('users/' + fbUid + '/titles');
    await ref.child(want).set(true);
    if(want === 'auto_casual_master_true') await ref.child('auto_casual_master').remove();
    const already = myTitleIds.includes(want);
    myTitleIds = myTitleIds.filter(id => id !== 'auto_casual_master' || want !== 'auto_casual_master_true');
    if(!myTitleIds.includes(want)) myTitleIds.push(want);
    if(!already) showTitleEarned(AUTO_TITLES[want].name);
  }catch(err){
    console.warn('称号を付けられませんでした:', err);
  }finally{
    masteryChecking = false;
  }
}

function titleIdsOf(u){
  const ids = [];
  if(u && u.titles) for(const k of Object.keys(u.titles)) if(u.titles[k]) ids.push(k);
  if(u && u.title && !ids.includes(u.title)) ids.push(u.title);
  // 作った順に並べる
  return ids.sort((a,b) => ((titleCatalog[a]||{}).createdAt||0) - ((titleCatalog[b]||{}).createdAt||0));
}
function isDarkNow(){
  const t = document.documentElement.getAttribute('data-theme');
  if(t === 'dark') return true;
  if(t === 'light') return false;
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
// 暗い画面では文字を明るくして読めるようにする
function titleTone(hex){
  if(!isDarkNow() || !/^#[0-9a-f]{6}$/i.test(hex)) return hex;
  const v=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));
  return '#'+v.map(x=>Math.round(x+(255-x)*0.45).toString(16).padStart(2,'0')).join('');
}

  }).join('')}</div>`;
}

// プロフィールを読み込む
async function loadMyProfile(){
  if(!fbDb || !fbUid) return;
  try{
    const snap = await fbDb.ref('users/' + fbUid + '/profile').once('value');
    const p = snap.val();
    if(p) myProfile = Object.assign({icon:'',displayName:'',bio:'',title:'',birthMonth:0,birthDay:0,birthPublic:false}, p);
    const pv = await fbDb.ref('private/' + fbUid).once('value');
    const v = pv.val() || {};
    myProfile.birthMonth = v.birthMonth || 0;
    myProfile.birthDay = v.birthDay || 0;
    myProfile.birthPublic = !!v.birthPublic;
  }catch(err){ console.warn('プロフィールの読み込みに失敗:', err); }
}

async function saveMyProfile(patch){
  if(!fbDb || !fbUid || !isSignedIn()) return false;
  if(!userRecordReady()){ await ensureUserRecord(); if(!userRecordReady()) return false; }   // 自分の記録（ID）を先に用意する
  Object.assign(myProfile, patch || {});
  try{
    await fbDb.ref('users/' + fbUid + '/profile').update({
      icon: myProfile.icon || '',
      displayName: myProfile.displayName || '',
      bio: myProfile.bio || '',
      updatedAt: Date.now()
    });
    // 誕生日は本人しか読めない場所に保存する
    await fbDb.ref('private/' + fbUid).update({
      birthMonth: myProfile.birthMonth || 0,
      birthDay: myProfile.birthDay || 0,
      birthPublic: !!myProfile.birthPublic
    });
    // 公開を選んだときだけ、誰でも見られる場所へ写す。
    // 非公開にしたら公開側からは消すので、他人からは読めなくなる。
    const pubRef = fbDb.ref('users/' + fbUid + '/profile/birthday');
    if(myProfile.birthPublic && myProfile.birthMonth && myProfile.birthDay){
      await pubRef.set({ month: myProfile.birthMonth, day: myProfile.birthDay });
    } else {
      await pubRef.remove();
    }
    // フレンド一覧に出る名前も合わせる
    await fbDb.ref('users/' + fbUid + '/name').set(profileName());
    return true;
  }catch(err){
    console.warn('プロフィールの保存に失敗:', err);
    return false;
  }
}

// 公開する戦績（相手のマイページでも見えるもの）
async function publishStats(){
  if(!fbDb || !fbUid || !userRecordReady()) return;
  const unlocked = CASUAL_DIFFS.filter(d => !d.locked || state.casual.unlocked[d.id]).length;
  try{
    await fbDb.ref('users/' + fbUid + '/stats').set({
      rank: state.playerRank || 0,
      games: state.totalGames || 0,
      wins: state.totalWins || 0,
      casualUnlocked: unlocked,
      casualTotal: CASUAL_DIFFS.length,
      training: rankLabel(state.training.rankIndex, state.training.xNumber),
      updatedAt: Date.now()
    });
  }catch(err){ console.warn('戦績の公開に失敗:', err); }

function myPresenceState(){
  if(game && game.mode === 'online') return 'playing_online';
  if(game) return 'playing';
  return 'online';
}
function startPresence(){
  if(!fbDb || !fbUid) return;
  presenceRef = fbDb.ref('presence/' + fbUid);
  const conn = fbDb.ref('.info/connected');
  conn.on('value', snap => {
    if(snap.val() === false) return;
    presenceRef.onDisconnect().set({ state:'offline', at: Date.now() });
    updatePresence(true);
  });
}
let lastPresenceState = null, lastPresenceAt = 0;
function updatePresence(force){
  if(!presenceRef) return;
  const st = myPresenceState();
  const now = Date.now();
  // 状態が同じなら書かない（書くたびにフレンドの画面が描き直されるため）。
  // ただし「生きている印」として、1分に1回だけは時刻を更新する。
  if(!force && st === lastPresenceState && now - lastPresenceAt < 60000) return;
  lastPresenceState = st;
  lastPresenceAt = now;
  presenceRef.set({ state: st, at: now }).catch(()=>{});
}
function watchFriendPresence(){
  // いま見る必要のあるフレンドだけ監視する
  const want = {};
  friendList.forEach(f => { want[f.uid] = true; });
  for(const uid of Object.keys(presenceWatch)){
    if(!want[uid]){ presenceWatch[uid].ref.off('value', presenceWatch[uid].cb); delete presenceWatch[uid]; }
  }
  for(const uid of Object.keys(want)){
    if(presenceWatch[uid]) continue;
    const ref = fbDb.ref('presence/' + uid);
    const cb = ref.on('value', s => {
      const v = s.val();
      const stale = !v || !v.at || (Date.now() - v.at > 5*60*1000);
      friendPresence[uid] = stale ? 'offline' : (v.state || 'offline');
      requestRender();
    });
    presenceWatch[uid] = {ref, cb};
  }
}
// フレンドが利用停止になっていないかを監視する。停止中の人は、あたかもデータが消えたかのように
// フレンド一覧から完全に見えなくする（フレンド関係のデータ自体は残すので、解除されれば自然に戻る）
function watchFriendBanned(){
  const want = {};
  friendList.forEach(f => { want[f.uid] = true; });
  for(const uid of Object.keys(bannedWatch)){
    if(!want[uid]){ bannedWatch[uid].ref.off('value', bannedWatch[uid].cb); delete bannedWatch[uid]; delete friendBanned[uid]; }
  }
  for(const uid of Object.keys(want)){
    if(bannedWatch[uid]) continue;
    const ref = fbDb.ref('users/' + uid + '/banned');
    const cb = ref.on('value', s => {
      friendBanned[uid] = !!s.val();
      requestRender();
    });
    bannedWatch[uid] = {ref, cb};
  }
}

/* ============================================================
   QRコード（フレンドコードの受け渡し）
   ライブラリは使うときだけ読み込む（普段の起動を重くしないため）
   ============================================================ */
const QR_LIBS = {
  gen:  'https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.js',
  scan: 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'
};
const loadedScripts = {};
function loadScriptOnce(url){
  if(loadedScripts[url]) return loadedScripts[url];
  loadedScripts[url] = new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = url; el.async = true;
    el.onload = () => resolve();
    el.onerror = () => { delete loadedScripts[url]; reject(new Error('読み込みに失敗しました')); };
    document.head.appendChild(el);
  });
  return loadedScripts[url];
}

// 自分のQRコードを描く
async function drawMyQR(canvas){
  await loadScriptOnce(QR_LIBS.gen);
  if(typeof qrcode !== 'function') throw new Error('QRコードを作れませんでした');
  const q = qrcode(0, 'M');
  q.addData(myUserCode());
  q.make();
  const n = q.getModuleCount(), margin = 4;
  const scale = Math.max(4, Math.floor(240 / (n + margin*2)));
  const size = (n + margin*2) * scale;
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#111111';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){
    if(q.isDark(r,c)) ctx.fillRect((c+margin)*scale, (r+margin)*scale, scale, scale);
  }
}

/* ---------- 読み取り ---------- */
let qrStream = null, qrLoopId = null, qrScanning = false;

async function startQRScan(){
  const video = document.getElementById('qrVideo');
  const status = document.getElementById('qrStatus');
  if(!video) return;
  const say = t => { if(status) status.textContent = t; };

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    say('この端末ではカメラが使えません');
    return;
  }
  try{
    say('準備しています…');
    await loadScriptOnce(QR_LIBS.scan);
    qrStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: false
    });
    video.srcObject = qrStream;
    video.setAttribute('playsinline', '');   // iPhone で全画面にならないように
    await video.play();
    qrScanning = true;
    say('QRコードを枠に合わせてください');
    scanFrame();
  }catch(err){
    console.warn(err);
    const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
    say(denied ? 'カメラの使用が許可されていません。端末の設定を確認してください'
               : 'カメラを起動できませんでした');
    stopQRScan();
  }
}

function scanFrame(){
  if(!qrScanning) return;
  const video = document.getElementById('qrVideo');
  if(!video || video.readyState < 2){ qrLoopId = requestAnimationFrame(scanFrame); return; }
  const w = video.videoWidth, h = video.videoHeight;
  if(!w || !h){ qrLoopId = requestAnimationFrame(scanFrame); return; }

  // 処理を軽くするため縮小して調べる
  const k = Math.min(1, 480 / Math.max(w, h));
  const cw = Math.round(w*k), ch = Math.round(h*k);
  const cv = scanFrame._cv || (scanFrame._cv = document.createElement('canvas'));
  cv.width = cw; cv.height = ch;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(video, 0, 0, cw, ch);
  const img = ctx.getImageData(0, 0, cw, ch);
  const res = (typeof jsQR === 'function') ? jsQR(img.data, cw, ch, { inversionAttempts: 'dontInvert' }) : null;

  if(res && res.data){
    const code = String(res.data).trim().toUpperCase();
    if(/^[A-Z0-9]{6,12}$/.test(code)){
      stopQRScan();
      onQRCodeRead(code);
      return;
    }
  }
  qrLoopId = requestAnimationFrame(scanFrame);
}

function stopQRScan(){
  qrScanning = false;
  if(qrLoopId) cancelAnimationFrame(qrLoopId);
  qrLoopId = null;
  if(qrStream){ qrStream.getTracks().forEach(t => t.stop()); qrStream = null; }
}

/* ---------- 画像からQRコードを読み取る ---------- */
async function readQRFromImage(file){
  if(!file) return;
  if(!/^image\//.test(file.type)){ toast('画像を選んでください'); return; }
  try{
    await loadScriptOnce(QR_LIBS.scan);
    const url = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = () => rej(new Error('画像を読み込めませんでした'));
      r.readAsDataURL(file);
    });
    const img = await new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(new Error('画像を読み込めませんでした'));
      im.src = url;
    });
    // 大きさを変えながら何度か試す（小さく写ったQRにも対応するため）
    for(const target of [800, 1200, 500, 1600]){
      const k = Math.min(1, target / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width*k)), h = Math.max(1, Math.round(img.height*k));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, w, h);
      const data = ctx.getImageData(0, 0, w, h);
      const res = jsQR(data.data, w, h, { inversionAttempts: 'attemptBoth' });
      if(res && res.data){
        const code = String(res.data).trim().toUpperCase();
        if(/^[A-Z0-9]{6,12}$/.test(code)){ onQRCodeRead(code); return; }
        toast('O-LABOのQRコードではありません');
        return;
      }
    }
    toast('画像からQRコードが見つかりませんでした');
  }catch(err){
    console.error(err);
    toast(err.message || '読み取れませんでした');
  }
}

/* ---------- 自分のQRコードを保存する ---------- */
async function saveMyQR(){
  try{
    // 保存用は余白と名前入りで大きめに描く
    const qrCv = document.createElement('canvas');
    await drawMyQR(qrCv);
    const pad = 36, label = 64;
    const out = document.createElement('canvas');
    out.width = qrCv.width + pad*2;
    out.height = qrCv.height + pad*2 + label;
    const ctx = out.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, out.width, out.height);
    ctx.drawImage(qrCv, pad, pad);
    ctx.fillStyle = '#1b1a17';
    ctx.textAlign = 'center';
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText(profileName(), out.width/2, qrCv.height + pad + 30);
    ctx.fillStyle = '#6b665d';
    ctx.font = '16px monospace';
    ctx.fillText('O-LABO  ID ' + myUserCode(), out.width/2, qrCv.height + pad + 54);

    const blob = await new Promise(res => out.toBlob(res, 'image/png'));
    const fileName = 'O-LABO_' + myUserCode() + '.png';
    const file = new File([blob], fileName, { type: 'image/png' });

    // 共有メニューが使えれば、そこから「画像を保存」で写真に入れられる
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      try{
        await navigator.share({ files: [file], title: 'O-LABO フレンドコード' });
        return;
      }catch(err){
        if(err && err.name === 'AbortError') return;   // 利用者が閉じた
      }
    }
    // 使えない端末ではファイルとして保存する
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
    toast('QRコードを保存しました');
  }catch(err){
    console.error(err);
    toast('保存できませんでした');
  }
}

/* ============================================================
   自己紹介の簡易マークダウン
   必ず先に全体を無害化してから、決まった記法だけを戻す。
   （書き込まれた文字列がそのまま HTML として動くのを防ぐため）
   ============================================================ */
function safeUrl(u){
  // http と https だけを許す（javascript: などは弾く）
  return /^https?:\/\/[^\s<>"']+$/i.test(u) ? u : null;
}
function bioToHtml(text){
  if(!text) return '';
  let s = escapeHtml(text);

  // [文字](URL)
  s = s.replace(/\[([^\]\n]{1,80})\]\((https?:\/\/[^\s)]+)\)/g, (m, label, url) => {
    const u = safeUrl(url.replace(/&amp;/g, '&'));
    if(!u) return m;
    return `<a href="${escapeHtml(u)}" target="_blank" rel="noopener noreferrer nofollow">${label}</a>`;
  });
  // そのまま書かれたURL（すでにリンクになった部分は除く）
  s = s.replace(/(^|[\s（(])((https?:\/\/)[^\s<]+)/g, (m, pre, url) => {
    const u = safeUrl(url.replace(/&amp;/g, '&'));
    if(!u) return m;
    const shown = url.length > 42 ? url.slice(0, 40) + '…' : url;
    return `${pre}<a href="${escapeHtml(u)}" target="_blank" rel="noopener noreferrer nofollow">${shown}</a>`;
  });
  // **太字** と *斜体*
  s = s.replace(/\*\*([^*\n]{1,100})\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]{1,100})\*(?!\*)/g, '$1<em>$2</em>');
  // ~~取り消し~~
  s = s.replace(/~~([^~\n]{1,100})~~/g, '<del>$1</del>');
  // 改行
  s = s.replace(/\n/g, '<br>');
  return s;
}

function firebaseConfigured(){
  return !!(FIREBASE_CONFIG && FIREBASE_CONFIG.databaseURL && FIREBASE_CONFIG.apiKey);
}

// ゲスト（匿名）としての接続を、必要になったときに作る
let guestSignInPromise = null;
async function ensureGuestSession(){
  try{
    if(firebase.auth().currentUser) return;
    if(!guestSignInPromise) guestSignInPromise = firebase.auth().signInAnonymously().finally(()=>{ guestSignInPromise = null; });
    await guestSignInPromise;
    fbUser = firebase.auth().currentUser; fbUid = fbUser ? fbUser.uid : null;
  }catch(err){ console.warn('ゲストとしての接続に失敗:', err); }
}
// opts.passive：開いただけ・ログイン画面を見ただけのときに使う。ログアウト中なら、勝手にゲストを作らない
async function ensureFirebase(opts){
  const passive = !!(opts && opts.passive);
  if(fbReady){
    if(!passive) await ensureGuestSession();   // 実際に機能を使うときは、ゲストとして接続する
    return true;
  }
  if(!firebaseConfigured()){ fbInitError = 'Firebase の設定が入力されていません'; return false; }
  if(typeof firebase === 'undefined'){ fbInitError = 'Firebase の読み込みに失敗しました（通信環境を確認してください）'; return false; }
  try{
    if(!fbApp){
      fbApp = firebase.initializeApp(FIREBASE_CONFIG);
      firebase.auth().onAuthStateChanged(async user => {
        fbUser = user;
        fbUid = user ? user.uid : null;
        accountReady = true;
        cloudSaveSuspended = false;
        // 3ヶ月ごとの再認証メールのリンクから戻ってきた場合は、ここで認証を済ませる
        if(user && !emailLinkHandled){
          const res = await handleEmailLinkReturn(user);
          if(res === 'switched') return;   // 別のアカウントとして入り直したので、新しい状態の通知に任せる
          fbUser = firebase.auth().currentUser;
        }
        // 確認メールのリンクを開いた直後は、手元の情報が古いままのことがあるので、最新の状態に合わせておく
        if(fbUser && !fbUser.isAnonymous && hasProvider('password') && !fbUser.emailVerified){
          try{ await fbUser.reload(); fbUser = firebase.auth().currentUser; }catch(err){}
        }
        // サーバー側のルールが使う証明書(トークン)にも、確認済みであることが載っているようにしておく
        if(fbUser && !fbUser.isAnonymous && fbUser.emailVerified){
          try{ const tr = await fbUser.getIdTokenResult(); if(!tr.claims.email_verified) await fbUser.getIdToken(true); }catch(err){}
        }
        if(!user){ myEmailVerifiedAt = 0; myEmailVerified = true; }
        if(user){
          onlineDebug.myUid = user.uid;
          // この端末のデータの持ち主を確かめる（別の登録アカウントのデータが残っていれば、引き継がない）
          reconcileLocalOwner(fbUser || user);
          setLoggedOutFlag(false);
          await ensureUserRecord();
          await loadMyProfile();
          await loadTitlesAndStatus();
          // メールの認証状態を決める（認証日時は loadTitlesAndStatus で読み込み済み）
          if(emailVerifiedJustNow){ myEmailVerifiedAt = Date.now(); emailVerifiedJustNow = false; persistEmailVerifiedAt(); toast('メールアドレスの認証ができました'); }
          recomputeEmailVerified();
          syncEmailVerifiedFlag();
          // 停止中は、セーブデータへのアクセスがルール側で拒否されるため、
          // 同期やオンライン関連の処理自体を行わない（エラーの原因にもなるため）
          if(!myBanned){
            startPresence();
            setTimeout(checkAutoTitles, 1500);
            watchFriends();
            watchInvites();
            watchFriendRequests();
            // ゲスト（匿名）でも、クラウド保存・ランキングへの反映は行う
            await syncAfterLogin(); publishStats();
          }
        } else {
          unwatchFriends(); unwatchInvites(); unwatchFriendRequests();
          friendList = []; pendingInvites = []; friendRequests = []; myUserRecord = null; myUserRecordUid = '';
        }
        render();
      });
    }
    fbDb = firebase.database();

    // 画面遷移でログインした場合、戻ってきたときに結果を受け取る
    try{
      const rr = await firebase.auth().getRedirectResult();
      if(rr && rr.user) toast('ログインしました');
    }catch(err){
      const t = authErrorText(err);
      if(t) toast(t);
    }

    // まだ誰もログインしていなければ、ゲストとして接続する
    if(!firebase.auth().currentUser && !(passive && loggedOutFlag())){
      await firebase.auth().signInAnonymously();
    }
    fbUser = firebase.auth().currentUser;
    fbUid = fbUser ? fbUser.uid : null;
    fbReady = true;
    onlineDebug.myUid = fbUid || '';
    onlineLog('接続完了 uid=' + (fbUid||'').slice(0,8));
    return true;
  }catch(err){
    console.error('Firebase 初期化に失敗:', err);
    const code = err && err.code;
    if(code === 'auth/operation-not-allowed'){
      fbInitError = '匿名ログインが有効になっていません（Authentication → Sign-in method → 匿名 を有効にしてください）';
    } else if(code === 'auth/unauthorized-domain'){
      fbInitError = 'このドメインが許可されていません（Authentication → Settings → 承認済みドメイン に追加してください）';
    } else if(code === 'auth/network-request-failed'){
      fbInitError = '通信できませんでした。ネットワークを確認してください';
    } else if(code === 'auth/api-key-not-valid' || code === 'auth/invalid-api-key'){
      fbInitError = 'Firebase の設定（apiKey）が正しくありません';
    } else {
      fbInitError = '接続に失敗しました: ' + (code || (err && err.message) || '不明なエラー');
    }
    console.warn('Firebase エラーコード:', code);
    return false;
  }
}

// 盤面を64文字の文字列にする（通信量を抑えるため）
function boardToStr(b){
  let s='';
  for(let r=0;r<8;r++) for(let c=0;c<8;c++) s += b[r][c];
  return s;
}
function strToBoard(s){
  const b = Array.from({length:8},()=>Array(8).fill(0));
  if(typeof s !== 'string' || s.length !== 64) return newBoard();
  for(let i=0;i<64;i++) b[Math.floor(i/8)][i%8] = parseInt(s[i],10) || 0;
  return b;
}

// 合言葉で入室（居なければ作成して待機、居れば参加）
async function onlineJoinByCode(code, myName){
  if(myBanned){ toast('このアカウントは利用が停止されています'); return; }
  if(!requireEmailAuth()) return;
  onlineState.isTournament = false; onlineState.tournamentRound = undefined; onlineState.tournamentIdx = undefined;
  const id = normalizeRoomCode(code);
  if(!id){ toast('合言葉を入力してください'); return; }

  // 押した瞬間に画面を切り替える
  onlineState.myName = myName;
  onlineState.mode = 'code';
  onlineState.phase = 'connecting';
  sub.online = 'room';
  render();

  if(!(await ensureFirebase())){
    toast(fbInitError);
    onlineState.phase = 'lobby';
    navigate(()=>{ sub.online = 'lobby'; });
    return;
  }
  onlineState.myName = myName;
  state.online.lastName = myName;
  saveState();

  const ref = fbDb.ref('rooms/'+id);
  let reason = '';
  try{
    const res = await ref.transaction(room => {
      const fresh = room && room.createdAt && (Date.now() - room.createdAt < 3*60*60*1000);
      const dead  = room && (room.status === 'abandoned' || room.status === 'finished');

      // 空き / 古すぎる / 終わった部屋 は作り直す
      if(room === null || !fresh || dead){
        return {
          status:'waiting', createdAt: Date.now(),
          host:{uid:fbUid, name:myName},
          board: boardToStr(newBoard()), turn:1, passStreak:0, moveCount:0
        };
      }
      // 自分が入っている部屋なら、そのまま戻る（再入室）
      if(room.host && room.host.uid === fbUid) return room;
      if(room.guest && room.guest.uid === fbUid) return room;
      // 相手を待っている部屋なら参加する
      if(room.status === 'waiting' && !room.guest){
        room.guest = {uid:fbUid, name:myName};
        room.status = 'playing';
        room.startedAt = Date.now();
        return room;
      }
      // すでに2人いる
      reason = 'full';
      return;
    });

    if(reason === 'full' || !res.committed || !res.snapshot.exists()){
      toast('その合言葉では、すでに2人が対局中です。別の合言葉にしてください');
      onlineState.phase = 'lobby';
      navigate(()=>{ sub.online = 'lobby'; });
      return;
    }
    const room = res.snapshot.val();
    if(room.host && room.host.uid === fbUid) onlineState.myColor = 1;
    else if(room.guest && room.guest.uid === fbUid) onlineState.myColor = 2;
    else {
      toast('その合言葉では、すでに2人が対局中です。別の合言葉にしてください');
      onlineState.phase = 'lobby';
      navigate(()=>{ sub.online = 'lobby'; });
      return;
    }

    onlineState.roomId = id;
    onlineState.mode = 'code';
    onlineAttachRoom(id);
  }catch(err){
    console.error(err);
    toast('入室できませんでした');
    onlineState.phase = 'lobby';
    navigate(()=>{ sub.online = 'lobby'; });
  }
}

// ランダムマッチ：待っている部屋があれば入り、なければ作って待つ
// 待っている人の一覧から、自分以外を探して入室を試みる
// 待っている部屋に入る。
// トランザクションは手元の空データで最初に実行され、そこで中止すると
// サーバーの値を見にいかないまま失敗するため、update で入室を試みる。
// 二重入室はセキュリティルール側（status が waiting で guest が居ない時だけ許可）で防ぐ。
async function onlineClaimRoom(roomId, myName){
  try{
    const snap = await fbDb.ref('rooms/'+roomId).once('value');
    const room = snap.val();
    if(!room){ onlineLog('入室不可: 部屋が無い ' + roomId); return false; }
    if(room.status !== 'waiting'){ onlineLog('入室不可: 状態が ' + room.status); return false; }
    if(room.guest){ onlineLog('入室不可: すでに相手がいる'); return false; }
    if(room.host && room.host.uid === fbUid){ onlineLog('入室不可: 自分の部屋'); return false; }

    await fbDb.ref('rooms/'+roomId).update({
      guest: {uid:fbUid, name:myName},
      status: 'playing',
      startedAt: Date.now()
    });
    onlineLog('入室成功 ' + roomId);
    return true;
  }catch(err){
    const code = (err && err.code) ? err.code : String(err);
    onlineDebug.lastError = '入室に失敗: ' + code;
    onlineLog(onlineDebug.lastError);
    return false;
  }
}

async function onlineTryJoinWaiting(myName, isMatch){
  let snap;
  try{
    snap = await fbDb.ref('waiting').limitToFirst(40).once('value');
  }catch(err){
    onlineDebug.lastError = '受付一覧を読めません: ' + (err && err.code ? err.code : err);
    onlineLog(onlineDebug.lastError);
    throw err;
  }
  const list = snap.val() || {};
  const now = Date.now();
  const keys = Object.keys(list);
  onlineDebug.waitingCount = keys.length;
  onlineDebug.entries = keys.map(k => ({
    room: k,
    uid: (list[k] && list[k].uid || '').slice(0,8),
    name: list[k] && list[k].name || '',
    mine: !!(list[k] && list[k].uid === fbUid),
    age: list[k] && list[k].createdAt ? Math.round((now - list[k].createdAt)/1000) : -1
  }));
  onlineLog('受付一覧 ' + keys.length + '件 / 自分以外 ' +
    onlineDebug.entries.filter(e=>!e.mine).length + '件');
  for(const roomId of Object.keys(list)){
    const e = list[roomId];
    if(!e || e.uid === fbUid) continue;
    if(roomId === onlineState.roomId) continue;
    // 競技モードと通常対戦は、別の待機列として扱う（混ざらないようにする）
    if(!!e.isMatch !== !!isMatch) continue;
    // 古い受付は掃除して次へ
    if(!e.createdAt || now - e.createdAt > ONLINE_QUEUE_TTL){
      fbDb.ref('waiting/'+roomId).remove().catch(()=>{});
      continue;
    }
    onlineState.oppName = e.name || '相手';
    onlineState.phase = 'joining';
    render();

    if(await onlineClaimRoom(roomId, myName)){
      fbDb.ref('waiting/'+roomId).remove().catch(()=>{});
      return roomId;
    }
    // 入れなかった場合、相手の受付は消さない（消すと相手が見つからなくなる）
    onlineState.oppName = '';
    onlineState.phase = 'waiting';
    render();
  }
  return null;
}

// matchOpts: { isMatch:true, timeLimitSec:600 } を渡すと、競技モード（公式ルール）の対局になる
async function onlineRandomMatch(myName, matchOpts){
  if(myBanned){ toast('このアカウントは利用が停止されています'); return; }
  if(!requireEmailAuth()) return;
  const isMatch = !!(matchOpts && matchOpts.isMatch);
  const timeLimitSec = (matchOpts && matchOpts.timeLimitSec) || 600;
  // 押した瞬間に画面を切り替える
  onlineState.myName = myName;
  onlineState.mode = 'random';
  onlineState.isMatch = isMatch;
  onlineState.isTournament = false; onlineState.tournamentRound = undefined; onlineState.tournamentIdx = undefined;
  onlineState.matchTimeLimitSec = timeLimitSec;
  onlineState.timeUpReported = false;
  onlineState.phase = 'connecting';
  sub.online = 'room';
  render();

  if(!(await ensureFirebase())){
    toast(fbInitError);
    onlineState.phase = 'lobby';
    navigate(()=>{ sub.online = 'lobby'; });
    return;
  }
  state.online.lastName = myName;
  saveState();

  try{
    // まず、すでに待っている人がいないか探す
    const found = await onlineTryJoinWaiting(myName, isMatch);
    if(found){
      onlineState.myColor = 2;
      onlineState.roomId = found;
      onlineAttachRoom(found);
      return;
    }

    // いなければ自分が待ち役になる
    const myRoomId = 'r' + Math.random().toString(36).slice(2,10);
    const roomData = {
      status:'waiting', createdAt: Date.now(),
      host:{uid:fbUid, name:myName},
      board: boardToStr(newBoard()), turn:1, passStreak:0, moveCount:0
    };
    if(isMatch){
      roomData.isMatch = true;
      roomData.timeLimitSec = timeLimitSec;
      roomData.timeLeftBlack = timeLimitSec;
      roomData.timeLeftWhite = timeLimitSec;
    }
    // 2つの書き込みを同時に投げる（順番に待つと、その分だけ遅くなる）
    await Promise.all([
      fbDb.ref('rooms/'+myRoomId).set(roomData),
      fbDb.ref('waiting/'+myRoomId).set({
        uid: fbUid, name: myName, createdAt: Date.now(), isMatch
      })
    ]);
    fbDb.ref('waiting/'+myRoomId).onDisconnect().remove();
    onlineLog('受付に登録した room=' + myRoomId);

    onlineState.myColor = 1;
    onlineState.roomId = myRoomId;
    onlineState.phase = 'waiting';
    onlineState.waitStartedAt = Date.now();
    // onlineAttachRoom は内部で監視を一度すべて止めるため、必ずその後に開始する
    onlineAttachRoom(myRoomId);
    onlineStartQueueHeartbeat();
    onlineStartRescan(myName);
  }catch(err){
    console.error(err);
    onlineDebug.lastError = (err && err.code ? err.code : (err && err.message) || String(err));
    onlineLog('失敗: ' + onlineDebug.lastError);
    toast('マッチングに失敗しました（' + onlineDebug.lastError + '）');
    onlineState.phase = 'lobby';
    navigate(()=>{ sub.online = 'lobby'; });
  }
}

// 部屋の変化を受け取り、盤面に反映する

/* ============================================================
   オンライン対局の絵文字リアクション
   rooms/<部屋>/reactions/<色> = { e: 絵文字, at: 送った時刻 }
   ============================================================ */
const REACTION_DEFAULTS = ['👍','😆','😎','🎉','👏'];
const REACTION_MAX = 10;          // パレットに並べる最大数
const REACTION_SHOW_MS = 5000;    // 相手の画面に出ている時間
const REACTION_MAX_SHOW = 3;      // 同時に画面へ表示できる最大数（それを超えたら古い順に消す）

let reactionShow = {};            // 色 → [{ e, until, startedAt, key }, ...]（最大 REACTION_MAX_SHOW 件）
let reactionSeen = {};            // 色 → 最後に見た at
let reactionInit = false;         // 部屋に入った直後の古いリアクションは出さない
let reactionPaletteOpen = false;
let reactionInputOpen = false;

function reactionList(){
  const l = state.settings.reactionEmojis;
  return Array.isArray(l) && l.length ? l : REACTION_DEFAULTS.slice();
}
// 使った絵文字を一番左へ（よく使うものほど左に来る）
function reactionTouch(e){
  const l = reactionList().filter(x => x !== e);
  l.unshift(e);
  state.settings.reactionEmojis = l.slice(0, REACTION_MAX);
  saveState();
}

// 絵文字1つだけかを確かめる（文字や数字が混ざったものは弾く）
function isSingleEmoji(str){
  const s = String(str || '').trim();
  if(!s || s.length > 32) return false;
  let parts;
  if(typeof Intl !== 'undefined' && Intl.Segmenter){
    parts = [...new Intl.Segmenter('ja', { granularity:'grapheme' }).segment(s)].map(x => x.segment);
    if(parts.length !== 1) return false;
  }
  // キーキャップ（1️⃣ など）は数字を含むので別に扱う
  if(/^[0-9#*]\uFE0F?\u20E3$/u.test(s)) return true;
  if(/[\p{L}\p{N}\p{P}\s]/u.test(s.replace(/[\u200D\uFE0F\u20E3]/g, ''))) {
    // 旗（地域指示記号）は文字扱いされることがあるので例外にする
    if(!/^(\p{Regional_Indicator}{2})$/u.test(s)) return false;
  }
  return /\p{Extended_Pictographic}|\p{Regional_Indicator}/u.test(s);
}

// クールタイムは設けない。連打すれば連打しただけ相手に届く（画面には最大3つまで同時表示）
async function sendReaction(e){
  if(!game || game.mode !== 'online' || !onlineRoomRef) return;
  if(!isSingleEmoji(e)){ toast('絵文字を1つだけ入力してください'); return; }
  const now = Date.now();
  const c = String(onlineState.myColor);
  reactionSeen[c] = now;                 // 自分の送信は監視側で二重に出さない
  showReaction(c, e);
  reactionTouch(e);
  try{
    await onlineRoomRef.child('reactions/' + c).set({ e, at: now });
  }catch(err){
    console.warn('リアクションを送れませんでした:', err);
    toast('送れませんでした');
  }
}

// 画面に絵文字を1つ追加する。同時に出せるのは REACTION_MAX_SHOW 個までで、
// それを超えたら一番古いものから消える（新しいものは必ず表示される）
function showReaction(color, e){
  playSE('online_emoji');   // 送るとき・送られてきたとき、どちらもここを通る
  const list = reactionShow[color] = reactionShow[color] || [];
  const item = { e, until: Date.now() + REACTION_SHOW_MS, startedAt: Date.now(), key: Math.random() };
  list.push(item);
  while(list.length > REACTION_MAX_SHOW) list.shift();
  requestRender();
  setTimeout(() => {
    const l = reactionShow[color];
    if(l){
      const idx = l.indexOf(item);
      if(idx >= 0) l.splice(idx, 1);
    }
    requestRender();
  }, REACTION_SHOW_MS + 60);
}

// 部屋の更新を受け取ったときに呼ぶ
function onRoomReactions(room){
  const r = (room && room.reactions) || {};
  if(!reactionInit){
    // 入室時点ですでにあるものは古いので出さない
    for(const c of Object.keys(r)) reactionSeen[c] = r[c] && r[c].at;
    reactionInit = true;
    return;
  }
  for(const c of Object.keys(r)){
    const x = r[c];
    if(!x || !x.at || x.at === reactionSeen[c]) continue;
    reactionSeen[c] = x.at;
    if(isSingleEmoji(x.e)) showReaction(c, x.e);
  }
}
function resetReactions(){
  reactionShow = {}; reactionSeen = {}; reactionInit = false;
  closeReactionPalette();
}

// スコアの札の下に出す吹き出し（同時に最大 REACTION_MAX_SHOW 個まで横に並ぶ）
function reactionBubbleMarkup(color){
  const list = (reactionShow[String(color)] || []).filter(r => r.until > Date.now());
  if(!list.length) return '';
  return `<span class="react-bubble-group">${list.map(r => {
    const fresh = Date.now() - r.startedAt < 350;
    return `<span class="react-bubble ${fresh ? 'pop' : ''}" aria-live="polite">${escapeHtml(r.e)}</span>`;
  }).join('')}</span>`;
}

// 盤の下に出すボタン
function reactionButtonMarkup(){
  if(!game || game.mode !== 'online' || game.over) return '';
  return `
    <div class="react-row">
      <button class="react-btn ${reactionPaletteOpen ? 'on' : ''}" data-action="react-toggle" aria-label="絵文字を送る" id="reactBtn">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 5C13.5 5 5 13.1 5 23.2c0 10 8.5 18.2 19 18.2 2.4 0 4.7-.4 6.8-1.2l8.4 3.6c.9.4 1.8-.5 1.4-1.4l-2.7-6.4C41 32.8 43 28.2 43 23.2 43 13.1 34.5 5 24 5z"
                fill="#fff" stroke="#b9b9b9" stroke-width="2.4" stroke-linejoin="round"/>
          <circle cx="24" cy="23" r="9.2" fill="none" stroke="#b9b9b9" stroke-width="2.2"/>
          <circle cx="20.6" cy="20.4" r="1.4" fill="#b9b9b9"/>
          <circle cx="27.4" cy="20.4" r="1.4" fill="#b9b9b9"/>
          <path d="M19.6 25.2c1.1 1.9 2.6 2.8 4.4 2.8s3.3-.9 4.4-2.8" fill="none" stroke="#b9b9b9" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
