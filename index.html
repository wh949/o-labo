function firebaseConfigured(){
  return !!(FIREBASE_CONFIG && FIREBASE_CONFIG.databaseURL && FIREBASE_CONFIG.apiKey);
}

async function ensureFirebase(){
  if(fbReady) return true;
  if(!firebaseConfigured()){ fbInitError = 'Firebase の設定が入力されていません'; return false; }
  if(typeof firebase === 'undefined'){ fbInitError = 'Firebase の読み込みに失敗しました（通信環境を確認してください）'; return false; }
  try{
    if(!fbApp){
      fbApp = firebase.initializeApp(FIREBASE_CONFIG);
      firebase.auth().onAuthStateChanged(async user => {
        fbUser = user;
        fbUid = user ? user.uid : null;
        accountReady = true;
        if(user){
          onlineDebug.myUid = user.uid;
          await ensureUserRecord();
          await loadMyProfile();
          startPresence();
          watchFriends();
          watchInvites();
          watchFriendRequests();
          if(!user.isAnonymous){ await syncAfterLogin(); publishStats(); }
        } else {
          unwatchFriends(); unwatchInvites(); unwatchFriendRequests();
          friendList = []; pendingInvites = []; friendRequests = []; myUserRecord = null;
        }
        render();
      });
    }
    fbDb = firebase.database();

    // 画面遷移でログインした場合、戻ってきたときに結果を受け取る
    try{
      const rr = await firebase.auth().getRedirectResult();
      if(rr && rr.user) toast('ログインしました');
    }catch(err){
      const t = authErrorText(err);
      if(t) toast(t);
    }

    // まだ誰もログインしていなければ、ゲストとして接続する
    if(!firebase.auth().currentUser){
      await firebase.auth().signInAnonymously();
    }
    fbUser = firebase.auth().currentUser;
    fbUid = fbUser ? fbUser.uid : null;
    fbReady = true;
    onlineDebug.myUid = fbUid || '';
    onlineLog('接続完了 uid=' + (fbUid||'').slice(0,8));
    return true;
  }catch(err){
    console.error('Firebase 初期化に失敗:', err);
    const code = err && err.code;
    if(code === 'auth/operation-not-allowed'){
      fbInitError = '匿名ログインが有効になっていません（Authentication → Sign-in method → 匿名 を有効にしてください）';
    } else if(code === 'auth/unauthorized-domain'){
      fbInitError = 'このドメインが許可されていません（Authentication → Settings → 承認済みドメイン に追加してください）';
    } else if(code === 'auth/network-request-failed'){
      fbInitError = '通信できませんでした。ネットワークを確認してください';
    } else if(code === 'auth/api-key-not-valid' || code === 'auth/invalid-api-key'){
      fbInitError = 'Firebase の設定（apiKey）が正しくありません';
    } else {
      fbInitError = '接続に失敗しました: ' + (code || (err && err.message) || '不明なエラー');
    }
    console.warn('Firebase エラーコード:', code);
    return false;
  }
}

// 盤面を64文字の文字列にする（通信量を抑えるため）
function boardToStr(b){
  let s='';
  for(let r=0;r<8;r++) for(let c=0;c<8;c++) s += b[r][c];
  return s;
}
function strToBoard(s){
  const b = Array.from({length:8},()=>Array(8).fill(0));
  if(typeof s !== 'string' || s.length !== 64) return newBoard();
  for(let i=0;i<64;i++) b[Math.floor(i/8)][i%8] = parseInt(s[i],10) || 0;
  return b;
}

function onlineDefaultName(){
  return (state.online && state.online.lastName) || state.username || 'プレイヤー';
}

function normalizeRoomCode(v){
  return String(v||'').trim().toLowerCase().replace(/\s+/g,'');
}

// 合言葉で入室（居なければ作成して待機、居れば参加）
async function onlineJoinByCode(code, myName){
  const id = normalizeRoomCode(code);
  if(!id){ toast('合言葉を入力してください'); return; }

  // 押した瞬間に画面を切り替える
  onlineState.myName = myName;
  onlineState.mode = 'code';
  onlineState.phase = 'connecting';
  sub.online = 'room';
  render();

  if(!(await ensureFirebase())){
    toast(fbInitError);
    onlineState.phase = 'lobby';
    navigate(()=>{ sub.online = 'lobby'; });
    return;
  }
  onlineState.myName = myName;
  state.online.lastName = myName;
  saveState();

  const ref = fbDb.ref('rooms/'+id);
  let reason = '';
  try{
    const res = await ref.transaction(room => {
      const fresh = room && room.createdAt && (Date.now() - room.createdAt < 3*60*60*1000);
      const dead  = room && (room.status === 'abandoned' || room.status === 'finished');

      // 空き / 古すぎる / 終わった部屋 は作り直す
      if(room === null || !fresh || dead){
        return {
          status:'waiting', createdAt: Date.now(),
          host:{uid:fbUid, name:myName},
          board: boardToStr(newBoard()), turn:1, passStreak:0, moveCount:0
        };
      }
      // 自分が入っている部屋なら、そのまま戻る（再入室）
      if(room.host && room.host.uid === fbUid) return room;
      if(room.guest && room.guest.uid === fbUid) return room;
      // 相手を待っている部屋なら参加する
      if(room.status === 'waiting' && !room.guest){
        room.guest = {uid:fbUid, name:myName};
        room.status = 'playing';
        room.startedAt = Date.now();
        return room;
      }
      // すでに2人いる
      reason = 'full';
      return;
    });

    if(reason === 'full' || !res.committed || !res.snapshot.exists()){
      toast('その合言葉では、すでに2人が対局中です。別の合言葉にしてください');
      onlineState.phase = 'lobby';
      navigate(()=>{ sub.online = 'lobby'; });
      return;
    }
    const room = res.snapshot.val();
    if(room.host && room.host.uid === fbUid) onlineState.myColor = 1;
    else if(room.guest && room.guest.uid === fbUid) onlineState.myColor = 2;
    else {
      toast('その合言葉では、すでに2人が対局中です。別の合言葉にしてください');
      onlineState.phase = 'lobby';
      navigate(()=>{ sub.online = 'lobby'; });
      return;
    }

    onlineState.roomId = id;
    onlineState.mode = 'code';
    onlineAttachRoom(id);
  }catch(err){
    console.error(err);
    toast('入室できませんでした');
    onlineState.phase = 'lobby';
    navigate(()=>{ sub.online = 'lobby'; });
  }
}

// ランダムマッチ：待っている部屋があれば入り、なければ作って待つ
// 待っている人の一覧から、自分以外を探して入室を試みる
// 待っている部屋に入る。
// トランザクションは手元の空データで最初に実行され、そこで中止すると
// サーバーの値を見にいかないまま失敗するため、update で入室を試みる。
// 二重入室はセキュリティルール側（status が waiting で guest が居ない時だけ許可）で防ぐ。
async function onlineClaimRoom(roomId, myName){
  try{
    const snap = await fbDb.ref('rooms/'+roomId).once('value');
    const room = snap.val();
    if(!room){ onlineLog('入室不可: 部屋が無い ' + roomId); return false; }
    if(room.status !== 'waiting'){ onlineLog('入室不可: 状態が ' + room.status); return false; }
    if(room.guest){ onlineLog('入室不可: すでに相手がいる'); return false; }
    if(room.host && room.host.uid === fbUid){ onlineLog('入室不可: 自分の部屋'); return false; }

    await fbDb.ref('rooms/'+roomId).update({
      guest: {uid:fbUid, name:myName},
      status: 'playing',
      startedAt: Date.now()
    });
    onlineLog('入室成功 ' + roomId);
    return true;
  }catch(err){
    const code = (err && err.code) ? err.code : String(err);
    onlineDebug.lastError = '入室に失敗: ' + code;
    onlineLog(onlineDebug.lastError);
    return false;
  }
}

async function onlineTryJoinWaiting(myName){
  let snap;
  try{
    snap = await fbDb.ref('waiting').limitToFirst(20).once('value');
  }catch(err){
    onlineDebug.lastError = '受付一覧を読めません: ' + (err && err.code ? err.code : err);
    onlineLog(onlineDebug.lastError);
    throw err;
  }
  const list = snap.val() || {};
  const now = Date.now();
  const keys = Object.keys(list);
  onlineDebug.waitingCount = keys.length;
  onlineDebug.entries = keys.map(k => ({
    room: k,
    uid: (list[k] && list[k].uid || '').slice(0,8),
    name: list[k] && list[k].name || '',
    mine: !!(list[k] && list[k].uid === fbUid),
    age: list[k] && list[k].createdAt ? Math.round((now - list[k].createdAt)/1000) : -1
  }));
  onlineLog('受付一覧 ' + keys.length + '件 / 自分以外 ' +
    onlineDebug.entries.filter(e=>!e.mine).length + '件');
  for(const roomId of Object.keys(list)){
    const e = list[roomId];
    if(!e || e.uid === fbUid) continue;
    if(roomId === onlineState.roomId) continue;
    // 古い受付は掃除して次へ
    if(!e.createdAt || now - e.createdAt > ONLINE_QUEUE_TTL){
      fbDb.ref('waiting/'+roomId).remove().catch(()=>{});
      continue;
    }
    onlineState.oppName = e.name || '相手';
    onlineState.phase = 'joining';
    render();

    if(await onlineClaimRoom(roomId, myName)){
      fbDb.ref('waiting/'+roomId).remove().catch(()=>{});
      return roomId;
    }
    // 入れなかった場合、相手の受付は消さない（消すと相手が見つからなくなる）
    onlineState.oppName = '';
    onlineState.phase = 'waiting';
    render();
  }
  return null;
}

async function onlineRandomMatch(myName){
  // 押した瞬間に画面を切り替える
  onlineState.myName = myName;
  onlineState.mode = 'random';
  onlineState.phase = 'connecting';
  sub.online = 'room';
  render();

  if(!(await ensureFirebase())){
    toast(fbInitError);
    onlineState.phase = 'lobby';
    navigate(()=>{ sub.online = 'lobby'; });
    return;
  }
  state.online.lastName = myName;
  saveState();

  try{
    // まず、すでに待っている人がいないか探す
    const found = await onlineTryJoinWaiting(myName);
    if(found){
      onlineState.myColor = 2;
      onlineState.roomId = found;
      onlineAttachRoom(found);
      return;
    }

    // いなければ自分が待ち役になる
    const myRoomId = 'r' + Math.random().toString(36).slice(2,10);
    // 2つの書き込みを同時に投げる（順番に待つと、その分だけ遅くなる）
    await Promise.all([
      fbDb.ref('rooms/'+myRoomId).set({
        status:'waiting', createdAt: Date.now(),
        host:{uid:fbUid, name:myName},
        board: boardToStr(newBoard()), turn:1, passStreak:0, moveCount:0
      }),
      fbDb.ref('waiting/'+myRoomId).set({
        uid: fbUid, name: myName, createdAt: Date.now()
      })
    ]);
    fbDb.ref('waiting/'+myRoomId).onDisconnect().remove();
    onlineLog('受付に登録した room=' + myRoomId);

    onlineState.myColor = 1;
    onlineState.roomId = myRoomId;
    onlineState.phase = 'waiting';
    onlineState.waitStartedAt = Date.now();
    // onlineAttachRoom は内部で監視を一度すべて止めるため、必ずその後に開始する
    onlineAttachRoom(myRoomId);
    onlineStartQueueHeartbeat();
    onlineStartRescan(myName);
  }catch(err){
    console.error(err);
    onlineDebug.lastError = (err && err.code ? err.code : (err && err.message) || String(err));
    onlineLog('失敗: ' + onlineDebug.lastError);
    toast('マッチングに失敗しました（' + onlineDebug.lastError + '）');
    onlineState.phase = 'lobby';
    navigate(()=>{ sub.online = 'lobby'; });
  }
}

// 部屋の変化を受け取り、盤面に反映する
function onlineAttachRoom(id){
  onlineDetachRoomOnly();
  onlineRoomRef = fbDb.ref('rooms/'+id);
  onlineState.phase = 'waiting';
  // navigate() は少し遅れて実行されるため、ここで直接切り替える。
  // （遅れて動くと、先に始まった対局画面の指定を上書きしてしまう）
  sub.online = 'room';
  render();

  onlineRoomUnsub = onlineRoomRef.on('value', snap => {
    const room = snap.val();
    if(!room){
      if(onlineState.phase === 'playing'){
        onlineState.message = '相手が退出しました';
        onlineState.oppLeft = true;
        onlineState.phase = 'finished';
        sub.online = 'room';
        render();
      }
      return;
    }
    if(room.status === 'waiting'){
      onlineState.phase = 'waiting';
      sub.online = 'room';
      render();
      return;
    }
    if(room.status === 'abandoned'){
      if(onlineState.phase === 'playing'){
        onlineState.message = '相手の接続が切れました';
        onlineState.oppLeft = true;
        onlineState.phase = 'finished';
        sub.online = 'room';
        render();
      }
      return;
    }

    // 対局中
    const oppSide = (onlineState.myColor === 1) ? room.guest : room.host;
    const newOpp = (oppSide && oppSide.name) || '相手';
    const newOppUid = (oppSide && oppSide.uid) || '';
    if(newOppUid && newOppUid !== onlineState.oppUid){
      onlineState.oppUid = newOppUid;
      fetchOpponentIcon(newOppUid);
    }
    const firstTime = onlineState.phase !== 'playing';
    onlineState.oppName = newOpp;

    if(firstTime){
      onlineState.phase = 'playing';
      game = makeGameSession('online', {
        playerStarts: onlineState.myColor === 1,
        myColor: onlineState.myColor,
        showHints: true
      });
      sub.online = 'play';
      onlineState.lastChangeAt = Date.now();
      onlineStopQueueHeartbeat();
      onlineStopRescan();
      onlineStartIdleWatch();
      if(onlineState.mode === 'random') showMatchFound(newOpp);
    }
    // 手が進んだら、放置判定の起点を更新する
    const movedOn = (room.moveCount || 0) !== (game.moveCount || 0) || firstTime;
    if(movedOn) onlineState.lastChangeAt = Date.now();

    game.board = strToBoard(room.board);
    game.current = room.turn || 1;
    game.passStreak = room.passStreak || 0;
    game.moveCount = room.moveCount || 0;
    game.over = (room.status === 'finished');

    // 手番が自分に回ってきて置けない場合、自動でパスする
    if(room.status === 'playing' && !game.over){
      setTimeout(onlineAutoPassIfNeeded, 300);
    }

    if(room.status === 'finished' && onlineState.phase !== 'finished'){
      onlineState.phase = 'finished';
      onlineStopIdleWatch();
      onlineFinish(room);
      sub.online = 'room';
    }
    render();
  });

  onlineRoomRef.child('status').onDisconnect().set('abandoned');
}

// 相手が動かないまま3分たったら、放棄とみなして決着させる
// 待っているあいだ、受付が期限切れにならないよう更新し続ける
function onlineStartQueueHeartbeat(){
  onlineStopQueueHeartbeat();
  onlineQueueBeat = setInterval(()=>{
    if(!fbDb || onlineState.phase !== 'waiting' || onlineState.mode !== 'random' || !onlineState.roomId){
      onlineStopQueueHeartbeat();
      return;
    }
    // 通信が一瞬切れると受付が消えることがあるので、丸ごと書き直して復活させる
    fbDb.ref('waiting/'+onlineState.roomId).set({
      uid: fbUid, name: onlineState.myName || '', createdAt: Date.now()
    }).catch(()=>{});
    render();   // 経過時間の表示を更新する
  }, 10000);
}
function onlineStopQueueHeartbeat(){
  if(onlineQueueBeat){ clearInterval(onlineQueueBeat); onlineQueueBeat = null; }
}

// 待っているあいだ、受付一覧を監視して相手が現れた瞬間に動く。
// 定期的に探すのではなく通知を受け取るので、待ち時間がほぼ無くなる。
let onlineWaitingRef = null, onlineWaitingCb = null, onlineJoinBusy = false;

function onlineStartRescan(myName){
  onlineStopRescan();
  onlineWaitingRef = fbDb.ref('waiting');
  onlineWaitingCb = onlineWaitingRef.on('value', async snap => {
    if(onlineJoinBusy) return;
    if(onlineState.phase !== 'waiting' || onlineState.mode !== 'random') return;

    const list = snap.val() || {};
    const now = Date.now();
    const keys = Object.keys(list);
    onlineDebug.waitingCount = keys.length;
    onlineDebug.entries = keys.map(k => ({
      room: k,
      uid: (list[k] && list[k].uid || '').slice(0,8),
      name: list[k] && list[k].name || '',
      mine: !!(list[k] && list[k].uid === fbUid),
      age: list[k] && list[k].createdAt ? Math.round((now - list[k].createdAt)/1000) : -1
    }));
    const others = onlineDebug.entries.filter(e=>!e.mine).length;
    onlineLog('監視: 受付 ' + keys.length + '件 / 自分以外 ' + others + '件');
    render();

    for(const roomId of keys){
      const e = list[roomId];
      if(!e || e.uid === fbUid || roomId === onlineState.roomId) continue;
      if(!e.createdAt || now - e.createdAt > ONLINE_QUEUE_TTL) continue;

      // 両方が同時に相手へ入室しにいくと二重に成立してしまうため、
      // 識別子の大きいほうだけが動く、と決めておく
      if(!(String(fbUid) > String(e.uid))){
        onlineLog('相手を発見（' + (e.name||'?') + '）: 相手側が入室する番なので待つ');
        continue;
      }
      onlineLog('相手を発見（' + (e.name||'?') + '）: 入室します');

      onlineJoinBusy = true;
      try{
        onlineState.oppName = e.name || '相手';
        onlineState.phase = 'joining';
        render();

        if(await onlineClaimRoom(roomId, myName)){
          const myOld = onlineState.roomId;
          onlineStopRescan();
          onlineStopQueueHeartbeat();
          fbDb.ref('waiting/'+roomId).remove().catch(()=>{});
          if(myOld){
            fbDb.ref('waiting/'+myOld).remove().catch(()=>{});
            fbDb.ref('rooms/'+myOld).remove().catch(()=>{});
          }
          onlineState.myColor = 2;
          onlineState.roomId = roomId;
          onlineAttachRoom(roomId);
          return;
        }
        // 入れなかった場合も、相手の受付は消さずに待機へ戻る
        onlineState.oppName = '';
        onlineState.phase = 'waiting';
        render();
      }catch(err){
        console.warn('入室に失敗:', err);
        onlineState.oppName = '';
        onlineState.phase = 'waiting';
      }finally{
        onlineJoinBusy = false;
      }
      break;
    }
  });
}
function onlineStopRescan(){
  if(onlineWaitingRef && onlineWaitingCb){
    onlineWaitingRef.off('value', onlineWaitingCb);
  }
  onlineWaitingRef = null; onlineWaitingCb = null; onlineJoinBusy = false;
  if(onlineRescanTimer){ clearInterval(onlineRescanTimer); onlineRescanTimer = null; }
}

function onlineStartIdleWatch(){
  onlineStopIdleWatch();
  onlineIdleTimer = setInterval(onlineIdleTick, 5000);
}
function onlineStopIdleWatch(){
  if(onlineIdleTimer){ clearInterval(onlineIdleTimer); onlineIdleTimer = null; }
}
function onlineIdleRemaining(){
  if(!onlineState.lastChangeAt) return ONLINE_IDLE_LIMIT;
  return Math.max(0, ONLINE_IDLE_LIMIT - (Date.now() - onlineState.lastChangeAt));
}
async function onlineIdleTick(){
  if(onlineState.phase !== 'playing' || !game || game.over){ return; }
  // 自分の番なら、待たせているのは自分なので何もしない
  if(game.current === onlineState.myColor){ render(); return; }
  if(onlineIdleRemaining() > 0){
    // 残り1分を切ったら画面に出す
    if(onlineIdleRemaining() <= 60000) render();
    return;
  }
  // 相手が放棄した
  onlineStopIdleWatch();
  try{
    if(onlineRoomRef){
      await onlineRoomRef.update({
        status: 'finished',
        abandonedBy: onlineState.myColor === 1 ? 2 : 1,
        updatedAt: Date.now()
      });
    }
  }catch(err){ console.warn('放棄の記録に失敗:', err); }
}

// 部屋の監視だけを外す（相手探しの監視には触れない）
function onlineDetachRoomOnly(){
  if(onlineRoomRef && onlineRoomUnsub){
    onlineRoomRef.off('value', onlineRoomUnsub);
  }
  onlineRoomRef = null; onlineRoomUnsub = null;
}
// すべての監視を止める（対局終了・退出時に使う）
function onlineDetach(){
  onlineStopIdleWatch();
  onlineStopQueueHeartbeat();
  onlineStopRescan();
  onlineDetachRoomOnly();
}

async function onlineLeave(){
  try{
    if(onlineRoomRef){
      onlineRoomRef.child('status').onDisconnect().cancel();
    }
    // 待っている途中でやめた場合は、受付と部屋を片付ける
    if(fbDb && onlineState.roomId && onlineState.phase !== 'playing'){
      if(onlineState.mode === 'random'){
        await fbDb.ref('waiting/'+onlineState.roomId).remove().catch(()=>{});
      }
      // 自分がホストで、まだ相手が来ていない部屋なら消す
      try{
        const snap = await fbDb.ref('rooms/'+onlineState.roomId).once('value');
        const room = snap.val();
        if(room && room.status === 'waiting' && room.host && room.host.uid === fbUid && !room.guest){
          await fbDb.ref('rooms/'+onlineState.roomId).remove();
        }
      }catch(err){ console.warn('部屋の片付けに失敗:', err); }
    }
  }catch(err){ console.warn(err); }
  onlineDetach();
  onlineState.phase='lobby'; onlineState.roomId=null; onlineState.myColor=null;
  onlineState.oppLeft=false; onlineState.message=''; onlineState.mode=null; onlineState.abandoned=false; onlineState.waitStartedAt=0;
  game = null;
  navigate(()=>{ sub.online='lobby'; });
}

// 自分の手を送信する
// 自分の手番なのに置ける場所が無いとき、自動でパスする。
// （オンラインには手動のパス手段が無いため、放っておくと進まなくなる）
let onlinePassBusy = false;
async function onlineAutoPassIfNeeded(){
  if(onlinePassBusy) return;
  if(!onlineRoomRef || !game || game.over) return;
  if(onlineState.phase !== 'playing') return;
  if(game.current !== onlineState.myColor) return;
  if(validMoves(game.board, onlineState.myColor).length > 0) return;

  const me = onlineState.myColor, opp = me===1?2:1;
  const oppCanMove = validMoves(game.board, opp).length > 0;
  onlinePassBusy = true;
  try{
    if(oppCanMove){
      onlineLog('置ける場所が無いのでパスします');
      await onlineRoomRef.update({
        turn: opp,
        passStreak: (game.passStreak||0) + 1,
        updatedAt: Date.now()
      });
    } else {
      // 双方とも置けない＝終局
      onlineLog('双方とも置けないため終局します');
      await onlineRoomRef.update({
        status: 'finished',
        updatedAt: Date.now()
      });
    }
  }catch(err){
    console.error(err);
    onlineDebug.lastError = 'パスに失敗: ' + ((err && err.code) || err);
  }finally{
    onlinePassBusy = false;
  }
}

async function onlineSendMove(r, c){
  if(!onlineRoomRef || !game) return;
  const flips = getFlips(game.board, r, c, onlineState.myColor);
  if(!flips.length) return;

  const nb = applyMove(game.board, r, c, onlineState.myColor, flips);
  const me = onlineState.myColor, opp = me===1?2:1;
  let nextTurn, passStreak = 0, finished = false;
  if(validMoves(nb, opp).length > 0){
    nextTurn = opp;
  } else if(validMoves(nb, me).length > 0){
    nextTurn = me; passStreak = (game.passStreak||0) + 1;
  } else {
    nextTurn = opp; finished = true;
  }

  try{
    await onlineRoomRef.update({
      board: boardToStr(nb),
      turn: nextTurn,
      passStreak,
      moveCount: (game.moveCount||0) + 1,
      lastMove: {row:r, col:c, by:me},
      status: finished ? 'finished' : 'playing',
      updatedAt: firebase.database.ServerValue.TIMESTAMP
    });
  }catch(err){
    console.error(err);
    toast('通信に失敗しました');
  }
}

function onlineFinish(room){
  const {black, white} = countStones(game.board);
  const mine = onlineState.myColor === 1 ? black : white;
  const theirs = onlineState.myColor === 1 ? white : black;
  let result;
  if(room && room.abandonedBy){
    // 放置した側の負けにする
    result = (room.abandonedBy === onlineState.myColor) ? 'lose' : 'win';
    onlineState.message = (room.abandonedBy === onlineState.myColor)
      ? '3分動きがなかったため、対局を放棄した扱いになりました'
      : '相手が3分動かなかったため、あなたの勝ちです';
    onlineState.abandoned = true;
  } else {
    result = mine > theirs ? 'win' : (mine < theirs ? 'lose' : 'draw');
  }
  state.totalGames = (state.totalGames||0) + 1;
  if(result === 'win'){
    state.totalWins = (state.totalWins||0) + 1;
    state.playerRank = Math.min(999, state.playerRank + 1);
  }
  state.online.history = state.online.history || [];
  state.online.history.unshift({
    timestamp: Date.now(), myScore: mine, aiScore: theirs,
    result, oppName: onlineState.oppName, difficulty: 'オンライン'
  });
  saveState();
  game.lastResult = {result, myScore:mine, aiScore:theirs};
}

function friendSectionMarkup(){

/* ============================================================
   8. shared game session + board rendering
   ============================================================ */
function generateLuckyUnluckyMap(){
  const map = Array(8).fill(null).map(()=>Array(8).fill(0));
  const count = Math.floor(Math.random() * 5) + 4;
  for(let i = 0; i < count; i++){
    const r = Math.floor(Math.random() * 8);
    const c = Math.floor(Math.random() * 8);
    if(map[r][c] === 0){
      map[r][c] = Math.random() < 0.5 ? 1 : -1;
    }
  }
  return map;
}

function generateWarpMap(){
  const warpPairs = [
    {from:[0,0], to:[7,7]},
    {from:[0,7], to:[7,0]},
    {from:[0,3], to:[7,4]},
    {from:[0,4], to:[7,3]},
  ];
  const map = {};
  warpPairs.forEach(p=>{
    const key1 = `${p.from[0]},${p.from[1]}`;
    const key2 = `${p.to[0]},${p.to[1]}`;
    map[key1] = {r:p.to[0], c:p.to[1]};
    map[key2] = {r:p.from[0], c:p.from[1]};
  });
  return map;
}

function makeGameSession(mode, opts){
  const playerStarts = opts.playerStarts !== undefined ? opts.playerStarts : true;
  const session = {
    mode, opts,
    board:newBoard(),
    current: playerStarts ? 1 : 2, // 1 black (player), 2 white (AI)
    startedAt: Date.now(),
    moveCount:0,
    boardStates:[], // snapshot after each ply (for replay)
    passStreak:0,
    pendingFlips:null, // {row,col,player,flips:[[r,c]],done:[]}
    over:false,
    lastResult:null,
    thinking:false,
    animPlaced:null,
    animFlips:null,
    aiStartTime:null,
    aiTimeoutPassed:false,
  };
  
  // バラエティモード用フィールド
  if(mode === 'variety'){
    session.varietyState = {
      rules: opts.varietyRules || {},
      eventTriggered: false,
      eventMessage: '',
      luckyUnluckyMap: opts.luckyUnluckyMap || generateLuckyUnluckyMap(),
      warpMap: opts.warpMap || generateWarpMap(),
      eventQueue: [],
    };
  }
  
  return session;
}
function turnColorMeta(g){
  if(g.mode==='battle'){
    return g.current===1
      ? {name:state.settings.battle.p1, color:'black'}
      : {name:state.settings.battle.p2, color:'white'};
  }
  if(g.mode==='online'){
    const mine = g.current === onlineState.myColor;
    return {
      name: mine ? (onlineState.myName || 'あなた') : (onlineState.oppName || '相手'),
      color: g.current===1 ? 'black' : 'white'
    };
  }
  return g.current===1 ? {name:'あなた', color:'black'} : {name:'AI', color:'white'};
}
// Stella スキンを使う場面か
//  ・解禁のための挑戦中は必ず使う
//  ・解禁後は、ゆるモードでスキンに Stella を選んでいるとき
function useStellaSkin(){
  if(stellaChallengeActive && game && game.mode==='casual') return true;
  return !!(game && game.mode==='casual'
            && state.settings.stellaUnlocked
            && state.settings.casualSkin === 'stella');
}
function boardStyleClass(){ 
  return (state.settings.boardStyle==='illust' ? 'illust' : '') + (useStellaSkin() ? ' stella' : '');
}

function renderBoardScreen(){
  const g = game;
  const {black,white} = countStones(g.board);
  const meta = turnColorMeta(g);
  // 表示は「左が黒・右が白」で固定なので、名前も色にあわせて割り当てる
  let leftName, rightName;
  if(g.mode==='battle'){
    leftName = state.settings.battle.p1;
    rightName = state.settings.battle.p2;
  } else if(g.mode==='online'){
    const meName = onlineState.myName || 'あなた';
    const oppName = onlineState.oppName || '相手';
    // 自分が黒（先手）なら左が自分、白（後手）なら右が自分
    leftName  = onlineState.myColor === 1 ? meName : oppName;
    rightName = onlineState.myColor === 1 ? oppName : meName;
  } else {
    leftName = 'あなた';
    rightName = (g.mode==='training' ? 'AI（特訓）' : 'AI');
  }
  const cells = [];
  const animateOn = state.settings.animFlip;
  const placed = g.animPlaced;
  const flipsAnim = g.animFlips || [];
  const myTurnNow = g.mode==='battle' ? true
                  : (g.mode==='online' ? g.current===onlineState.myColor : g.current===1);
  const actualMoves = (!g.over && !g.pendingFlips && !g.thinking && myTurnNow) ? validMoves(g.board,g.current) : [];
  let showHints;
  if(g.mode==='battle') showHints = g.current===1 ? g.opts.p1ShowHints : g.opts.p2ShowHints;
  else if(g.mode==='training') showHints = false;
  else if(g.mode==='online') showHints = true;
  else showHints = !!g.opts.showHints;
  const hintMoves = showHints ? actualMoves : [];
  const moveMap = {}; hintMoves.forEach(m=>moveMap[m.row+'_'+m.col]=true);
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const v=g.board[r][c];
    let cls='cell';
    let inner='';
    if(v===0 && moveMap[r+'_'+c]) cls+=' hint';
    if(g.pendingFlips && g.pendingFlips.flips.some(([fr,fc])=>fr===r&&fc===c) && !g.pendingFlips.done.some(([dr,dc])=>dr===r&&dc===c)){
      cls+=' flip-target';
    }
    if(v!==0){
      let stoneCls='stone '+(v===1?'black':'white');
      let stoneStyle='';
      if(animateOn && placed && placed.row===r && placed.col===c) stoneCls+=' dropping';
      if(animateOn){
        const idx = flipsAnim.findIndex(([fr,fc])=>fr===r&&fc===c);
        if(idx!==-1){ stoneCls+=' flipping'; stoneStyle=` style="animation-delay:${idx*75}ms"`; }
      }
      // Stella スキン用の星型石
      if(useStellaSkin()){
        const starColor = v===1 ? '#FFD34D' : '#FFFFFF';
        const glow = v===1 ? '#FFF0B8' : '#DFF1FF';
        inner = `<div class="${stoneCls}"${stoneStyle}><svg viewBox="0 0 100 100" style="width:100%; height:100%;">
          <defs><radialGradient id="sg${r}${c}" cx="38%" cy="30%" r="72%">
            <stop offset="0%" stop-color="${glow}"/><stop offset="100%" stop-color="${starColor}"/>
          </radialGradient></defs>
          <path d="M47.5,16.5 Q50.0,10.0 52.5,16.5 L58.8,32.8 Q60.6,37.4 65.6,37.7 L83.0,38.6 Q89.9,39.0 84.5,43.4 L71.0,54.4 Q67.1,57.6 68.4,62.4 L72.9,79.2 Q74.7,86.0 68.8,82.2 L54.2,72.7 Q50.0,70.0 45.8,72.7 L31.2,82.2 Q25.3,86.0 27.1,79.2 L31.6,62.4 Q32.9,57.6 29.0,54.4 L15.5,43.4 Q10.1,39.0 17.0,38.6 L34.4,37.7 Q39.4,37.4 41.2,32.8 Z" fill="url(#sg${r}${c})"/>
        </svg></div>`;
      } else {
        inner = `<div class="${stoneCls}"${stoneStyle}></div>`;
      }
    }
    cells.push(`<div class="${cls}" data-action="cell" data-r="${r}" data-c="${c}">${inner}</div>`);
  }
  g.animPlaced=null; g.animFlips=null;
  const timer = state.settings.showTimer ? `<span class="timer" id="liveTimer">00:00</span>` : '';
  let statusNote='';
  if(g.over){
    statusNote = `<div class="pass-note">対局が終了しました</div>`;
  } else if(g.thinking){
    statusNote = `<div class="pass-note">AIが考えています…</div>`;
  } else if(g.pendingFlips){
    statusNote = `<div class="pass-note">ひっくり返す石をタップしてください（残り${g.pendingFlips.flips.length-g.pendingFlips.done.length}個）</div>`;
  } else if(g.mode==='online' && g.current !== onlineState.myColor){
    const left = Math.ceil(onlineIdleRemaining()/1000);
    const warn = (left <= 60) ? `<br><span style="font-size:11px;">あと${left}秒動きがないと、相手の放棄になります</span>` : '';
    const oppStuck = validMoves(g.board, g.current).length === 0;
    statusNote = oppStuck
      ? `<div class="pass-note">${escapeHtml(onlineState.oppName||'相手')}は置ける場所がないためパスします…</div>`
      : `<div class="pass-note">${escapeHtml(onlineState.oppName||'相手')}の番です…${warn}</div>`;
  } else if(actualMoves.length===0 && !g.over){
    statusNote = `<div class="pass-note">置ける場所がないため、パスします</div>`;
  }
  if(g.mode==='online' && !g.over && g.current === onlineState.myColor
     && validMoves(g.board, g.current).length === 0){
    statusNote = `<div class="pass-note">置ける場所がないため、パスします…</div>`;
  }
  
  // バラエティモードのイベント表示
  let varietyEventMarkup = '';
  if(g.mode === 'variety' && g.varietyState && g.varietyState.eventMessage){
    varietyEventMarkup = `<div style="background:var(--urushi-light); color:var(--urushi); padding:10px; border-radius:8px; margin-bottom:12px; text-align:center; font-weight:700; font-size:14px;">${g.varietyState.eventMessage}</div>`;
    // イベント表示を一度だけ表示させる（次のレンダリングで消す）
    setTimeout(()=>{ if(g.varietyState) g.varietyState.eventMessage = ''; }, 2000);
  }
  
  // パスボタンの表示判定
  const showPassBtn = state.settings.allowPass && !g.over && !g.thinking && !g.pendingFlips && 
                      (g.mode==='battle' || g.current===1);
  
  return `
    <div class="board-wrap">
      <div class="turn-banner">
        <div class="who"><span class="dot" style="background:${meta.color==='black'?'#111':'#fff'};"></span>${g.over? '対局終了':escapeHtml(meta.name)+'さんのターン'}</div>
        ${timer}
      </div>
      <div class="score-strip">
        <div class="score-chip ${black>=white?'leading':''} ${g.mode==='online'&&onlineState.myColor===1?'is-me':''}"><span class="sc-stone" style="background:#111;"></span><span class="sc-name">${escapeHtml(leftName)}</span><span class="sc-num">${black}</span></div>
        <div class="score-chip ${white>black?'leading':''} ${g.mode==='online'&&onlineState.myColor===2?'is-me':''}"><span class="sc-stone" style="background:#eee; box-shadow:inset 0 0 0 1px #ccc;"></span><span class="sc-name">${escapeHtml(rightName)}</span><span class="sc-num">${white}</span></div>
      </div>
      <div class="board ${boardStyleClass()}" id="boardEl">${cells.join('')}</div>
      ${varietyEventMarkup}
      ${stellaChallengeActive ? '<div class="stella-banner">この対局に勝利すると Stella が解禁！</div>' : ''}
      ${statusNote}
    </div>
    ${showPassBtn?`<div style="margin-top:10px;"><button class="btn btn-soft" data-action="player-pass">このターンをパスする</button></div>`:''}
    <div class="btn-row" style="margin-top:14px;">
      ${g.mode==='online' ? '' : `<button class="btn btn-ghost" data-action="give-up">${ruby('投了','とうりょう',1)}してもどる</button>`}
      ${g.over?'<button class="btn btn-primary" data-action="see-result">結果を見る</button>':''}
    </div>
  `;
}

let timerHandle=null;
function startLiveTimer(){
  stopLiveTimer();
  timerHandle=setInterval(()=>{
    const el=document.getElementById('liveTimer');
    if(!el || !game){ return; }
    const sec = Math.floor((Date.now()-game.startedAt)/1000);
    el.textContent = String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
  },1000);
}
function stopLiveTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } }

/* ---- interaction: placing stones ---- */
function onCellClick(r,c){
  const g=game;
  if(!g || g.over || g.thinking) return;
  if(g.pendingFlips){
    const idx = g.pendingFlips.flips.findIndex(([fr,fc])=>fr===r&&fc===c);
    const already = g.pendingFlips.done.some(([dr,dc])=>dr===r&&dc===c);
    if(idx===-1 || already) return;
    g.pendingFlips.done.push([r,c]);
    g.board[r][c]=g.pendingFlips.player;
    g.animFlips=[[r,c]]; g.animPlaced=null;
    if(g.pendingFlips.done.length===g.pendingFlips.flips.length){
      g.pendingFlips=null;
      finishPly(g);
    } else {
      render(); startLiveTimer();
    }
    return;
  }
  if(g.mode==='battle'){
    tryHumanMove(g,r,c);
  } else if(g.mode==='online'){
    // オンラインは自分の色の手番だけ操作できる
    if(g.current !== onlineState.myColor) return;
    tryHumanMove(g,r,c);
  } else {
    if(g.current!==1) return; // only human's (black) turn is clickable
    tryHumanMove(g,r,c);
  }
}
function tryHumanMove(g,r,c){
  // オンラインは自分の手番のときだけ、サーバーに送る
  if(g.mode==='online'){
    if(g.over || g.current !== onlineState.myColor) return;
    if(!getFlips(g.board,r,c,g.current).length) return;
    onlineSendMove(r,c);
    return;
  }
  let flips = getFlips(g.board,r,c,g.current);
  if(!flips.length) return;
  
  // バラエティモード: ワープルール適用
  let finalRow = r, finalCol = c;
  let eventMsg = '';
  if(g.mode==='variety' && g.varietyState && g.varietyState.rules.warp){
    const key = `${r},${c}`;
    if(g.varietyState.warpMap[key]){
      const warp = g.varietyState.warpMap[key];
      finalRow = warp.r;
      finalCol = warp.c;
      eventMsg = '✨ワープした！';
      // ワープ後の位置でフリップ位置を再計算
      flips = getFlips(g.board, finalRow, finalCol, g.current);
      if(!flips.length) {
        // ワープ後の位置が置けない場合は元の位置に戻す
        finalRow = r;
        finalCol = c;
        flips = getFlips(g.board, r, c, g.current);
        eventMsg = '✨ワープしたが戻ってきた...';
      }
    }
  }
  
  // バラエティモード: ラッキー/アンラッキールール適用
  let luckyEffect = 0;
  if(g.mode==='variety' && g.varietyState && g.varietyState.rules.lucky_unlucky){
    const effect = g.varietyState.luckyUnluckyMap[finalRow]?.[finalCol];
    if(effect === 1){
      eventMsg = '🍀ラッキー！';
      luckyEffect = 1;
    } else if(effect === -1){
      eventMsg = '💔アンラッキー...';
      luckyEffect = -1;
    }
  }
  
  if(eventMsg && g.varietyState) g.varietyState.eventMessage = eventMsg;
  
  const manual = g.mode==='battle' && g.opts.flipMode==='manual';
  g.board[finalRow][finalCol]=g.current;
  g.moveCount++;
  g.animPlaced={row:finalRow,col:finalCol};
  
  // ラッキーボーナス: 追加で1マス多くフリップ
  if(luckyEffect === 1 && flips.length > 0){
    // ラッキーマスでは、フリップ数が増える（追加ボーナス）
    g.luckyBonus = true;
  } else if(luckyEffect === -1 && flips.length > 0){
    // アンラッキーでは、フリップが減る
    const reducedFlips = flips.slice(0, Math.max(1, Math.floor(flips.length / 2)));
    flips = reducedFlips.length > 0 ? reducedFlips : flips;
  }
  
  if(manual && flips.length){
    g.pendingFlips={row:finalRow,col:finalCol,player:g.current,flips,done:[]};
    g.animFlips=null;
    render(); startLiveTimer();
    return;
  }
  g.animFlips=flips;
  flips.forEach(([fr,fc])=>{ g.board[fr][fc]=g.current; });
  finishPly(g);
}
function finishPly(g){
  g.boardStates.push(g.board.map(row=>row.slice()));
  
  // バラエティモード: ランダムイベント処理
  if(g.mode==='variety' && g.varietyState && g.varietyState.rules.random){
    if(Math.random() < 0.3){  // 30%の確率でイベント発生
      const randomEvents = [
        {msg:'🔄盤面が反転した！', effect:()=>{
          // ランダムに3-5個の石を反転
          const count = Math.floor(Math.random() * 3) + 3;
          for(let i=0; i<count; i++){
            const r = Math.floor(Math.random() * 8);
            const c = Math.floor(Math.random() * 8);
            if(g.board[r][c]!==0){
              g.board[r][c] = g.board[r][c]===1?2:1;
            }
          }
        }},
        {msg:'⭐ボーナスターン！', effect:()=>{
          // 追加ターン（AI側がパスする）
          const otherMoves = validMoves(g.board, g.current===1?2:1);
          if(otherMoves.length === 0){
            g.passStreak++;
          }
        }},
        {msg:'🎲運試し！', effect:()=>{
          // 特に何もしない（メッセージだけ）
        }},
      ];
      const event = randomEvents[Math.floor(Math.random() * randomEvents.length)];
      g.varietyState.eventMessage = event.msg;
      event.effect();
    }
  }
  
  const other = g.current===1?2:1;
  const otherMoves = validMoves(g.board,other);
  const selfMoves = validMoves(g.board,g.current);
  if(otherMoves.length>0){
    g.current=other; g.passStreak=0;
  } else if(selfMoves.length>0){
    g.passStreak++;
    // other has no moves, stays same player's turn (pass for opponent)
  } else {
    endGame(g);
    render();
    return;
  }
  render(); startLiveTimer();
  maybeTriggerAI(g);
}
function maybeTriggerAI(g){
  try{
    if(g.over) return;
    const isAiTurn = (g.mode==='training'||g.mode==='casual'||g.mode==='variety') && g.current===2;
    if(!isAiTurn) return;
    const moves = validMoves(g.board,2);
    if(moves.length===0){
      // AI passes - check if game should end
      const humanMoves = validMoves(g.board,1);
      if(humanMoves.length===0){ 
        endGame(g); 
        sub[g.mode === 'training' ? 'training' : g.mode === 'casual' ? 'casual' : 'variety'] = 'result';
        render(); 
        return; 
      }
      // Pass to human and show pass message
      g.current=1;
      g.passStreak++;
      g.statusNote = `<div class="pass-note">AIがパスしました</div>`;
      
      // 連続パス（両者がパス）で即終了
      if(g.passStreak >= 2){ 
        endGame(g); 
        sub[g.mode === 'training' ? 'training' : g.mode === 'casual' ? 'casual' : 'variety'] = 'result';
        render(); 
        return; 
      }
      render();
      startLiveTimer();
      return;
    }
    g.thinking=true;
    g.aiStartTime=Date.now();
    render();
    setTimeout(()=>{
      try{
        if(!g.thinking) return;
        const elapsed = Date.now() - g.aiStartTime;
        if(elapsed >= 5000){
          g.thinking=false;
          const humanMoves = validMoves(g.board,1);
          const aiMoves2 = validMoves(g.board,2);
          if(humanMoves.length>0){ 
            g.current=1; 
            g.passStreak++;
            g.statusNote = `<div class="pass-note">AIがパスしました（制限時間）</div>`;
            if(g.passStreak >= 2){
              endGame(g);
              sub[g.mode === 'training' ? 'training' : g.mode === 'casual' ? 'casual' : 'variety'] = 'result';
              render();
              return;
            }
          }
          else if(aiMoves2.length>0){ maybeTriggerAI(g); return; }
          else { endGame(g); sub[g.mode === 'training' ? 'training' : g.mode === 'casual' ? 'casual' : 'variety'] = 'result'; render(); return; }
          render();
          startLiveTimer();
          return;
        }
        const mv = aiChooseMove(g.board, 2, g.opts.aiDepth, g.opts.aiRnd, g.opts.boost, g.opts.aiGreedy);
        g.thinking=false;
        if(mv){
          g.board = applyMove(g.board, mv.row, mv.col, 2, mv.flips);
          g.moveCount++;
          g.animPlaced={row:mv.row,col:mv.col};
          g.animFlips=mv.flips;
          g.boardStates.push(g.board.map(row=>row.slice()));
          g.passStreak=0;
          const humanMoves = validMoves(g.board,1);
          const aiMoves2 = validMoves(g.board,2);
          if(humanMoves.length>0){ g.current=1; }
          else if(aiMoves2.length>0){ maybeTriggerAI(g); return; }
          else { endGame(g); sub[g.mode === 'training' ? 'training' : g.mode === 'casual' ? 'casual' : 'variety'] = 'result'; render(); return; }
        } else {
          // No move found - AI passes
          const humanMoves = validMoves(g.board,1);
          const aiMoves3 = validMoves(g.board,2);
          if(humanMoves.length>0){ 
            g.current=1; 
            g.passStreak++;
            g.statusNote = `<div class="pass-note">AIがパスしました</div>`;
            if(g.passStreak >= 2){
              endGame(g);
              sub[g.mode === 'training' ? 'training' : g.mode === 'casual' ? 'casual' : 'variety'] = 'result';
              render();
              return;
            }
          }
          else if(aiMoves3.length>0){ maybeTriggerAI(g); return; }
          else { endGame(g); sub[g.mode === 'training' ? 'training' : g.mode === 'casual' ? 'casual' : 'variety'] = 'result'; render(); return; }
        }
        render();
        startLiveTimer();
      }catch(err){
        console.error('AI error:', err);
        g.thinking=false;
        render();
      }
    }, 420);
  }catch(err){
    console.error('maybeTriggerAI error:', err);
    g.thinking=false;
    render();
  }
}
function endGame(g){
  g.over=true;
  stopLiveTimer();
  const {black,white} = countStones(g.board);
  const durationSec = Math.floor((Date.now()-g.startedAt)/1000);
  const entry = {
    timestamp: Date.now(),
    durationSec,
    moves: g.moveCount,
    boardStates: g.boardStates,
  };
  // 統計を更新
  state.totalGames = (state.totalGames || 0) + 1;
  if(g.mode==='battle'){
    entry.p1Name=state.settings.battle.p1; entry.p2Name=state.settings.battle.p2;
    entry.p1Score=black; entry.p2Score=white;
    entry.winner = black>white?'p1':(white>black?'p2':'draw');
    if(entry.winner==='p1') state.totalWins = (state.totalWins || 0) + 1;
    state.battleHistory.unshift(entry);
    g.lastResult=entry;
  } else if(g.mode==='training'){
    entry.myScore=black; entry.aiScore=white; entry.rankAtTime=rankLabel(state.training.rankIndex,state.training.xNumber);
    entry.speedLabel=speedLabel(durationSec,g.moveCount);
    entry.result = black>white?'win':(white>black?'lose':'draw');
    if(entry.result==='win'){
      state.totalWins = (state.totalWins || 0) + 1;
      state.training.winCount = (state.training.winCount || 0) + 1;
      const winsNeeded = winsRequiredForRank(state.training.rankIndex);
      if(state.training.winCount >= winsNeeded){
        // ランク昇格
        state.training.winCount = 0;
        if(state.training.rankIndex < RANK_LADDER.length-1) state.training.rankIndex++;
        else state.training.xNumber = Math.min(RANK_MAX_X-1, (state.training.xNumber||1)+1);
        state.playerRank = Math.min(999, state.playerRank+1);
      }
    } else {
      state.training.winCount = 0;
    }
    state.training.history.unshift(entry);
    g.lastResult=entry;
  } else if(g.mode==='casual'){
    entry.myScore=black; entry.aiScore=white; entry.difficulty=g.opts.diffName;
    entry.result = black>white?'win':(white>black?'lose':'draw');

    // Stella の挑戦は、通常の難易度とは別あつかいにする
    if(stellaChallengeActive){
      stellaChallengeWon = (entry.result === 'win');
      state.totalGames = (state.totalGames || 0) + 1;
      if(stellaChallengeWon) state.totalWins = (state.totalWins || 0) + 1;
      state.casual.history.unshift(entry);
      g.lastResult = entry;
      sub.casual = 'result';
      saveState();
      return;
    }

    // 難易度ごとの成績を記録する（未挑戦 → 敗北 → 勝利 → 完封 の順に上書き）
    state.casual.results = state.casual.results || {};
    const isPerfect = entry.result==='win' && white===0;   // 相手の石が無くなった＝完封
    const newMark = isPerfect ? 'perfect' : (entry.result==='win' ? 'won' : 'tried');
    const order = {tried:1, won:2, perfect:3};
    const prev = state.casual.results[g.opts.diffId];
    if(!prev || order[newMark] > (order[prev]||0)){
      state.casual.results[g.opts.diffId] = newMark;
    }

    if(entry.result==='win'){
      state.totalWins = (state.totalWins || 0) + 1;
      
      if(black-white>=5){
        const order = CASUAL_DIFFS.map(d=>d.id);
        const i = order.indexOf(g.opts.diffId);
        const nextD = CASUAL_DIFFS[i+1];
        if(nextD && !state.casual.unlocked[nextD.id]){
          state.casual.unlocked[nextD.id]=true;
          g.unlockedDiffId = nextD.id;
          g.unlockedDiffName = nextD.name;
          toast('「'+nextD.name+'」が解禁されました！');
        }
        state.playerRank = Math.min(999, state.playerRank+1);
      }
    }
    state.casual.history.unshift(entry);
    g.lastResult=entry;
  } else if(g.mode==='variety'){
    entry.myScore=black; entry.aiScore=white;
    entry.presetName = g.opts.varietyPresetId;
    entry.result = black>white?'win':(white>black?'lose':'draw');
    if(entry.result==='win'){
      state.totalWins = (state.totalWins || 0) + 1;
      state.playerRank = Math.min(999, state.playerRank+1);
    }
    state.variety.history = state.variety.history || [];
    state.variety.history.unshift(entry);
    g.lastResult=entry;
  }
  
  // ゲーム終了時に結果画面に遷移する状態をセット
  if(g.mode === 'battle') sub.battle = 'result';
  else if(g.mode === 'training') sub.training = 'result';
  else if(g.mode === 'casual') sub.casual = 'result';
  else if(g.mode === 'variety') sub.variety = 'result';
  else if(g.mode === 'training') sub.training = 'result';
  else if(g.mode === 'variety') sub.variety = 'result';
  else if(g.mode === 'casual') sub.casual = 'result';
  
  saveState();
}
function speedLabel(durationSec, moves){
  if(!moves) return 'ふつう';
  const avg = durationSec/moves;
  if(avg<2) return '超はやい';
  if(avg<4) return 'はやい';
  if(avg<7) return 'ふつう';
  if(avg<12) return 'ゆっくり';
  return '超ゆっくり';
}

function renderHistItem(e,i){
  if(libTab==='battle'){
    const pill = e.winner==='draw'?'draw':'win';
    const resTxt = e.winner==='draw'?'引き分け':(e.winner==='p1'?e.p1Name:e.p2Name)+'の勝ち';
    return `<div class="hist-item">
      <div class="hist-top"><span class="hist-title">${escapeHtml(e.p1Name)} vs ${escapeHtml(e.p2Name)}</span><span class="hist-date">${fmtDate(e.timestamp)}</span></div>
      <div class="hist-meta">
        <span><b>${e.p1Score}</b> - <b>${e.p2Score}</b></span>
        <span>${fmtDuration(e.durationSec)}</span>
        <span>${e.moves}手</span>
        <span class="result-pill ${pill}">${resTxt}</span>
      </div>
      <button class="btn btn-soft" data-action="watch-replay" data-scope="battle" data-idx="${i}">一手一手を再生する</button>
    </div>`;
  }
  if(libTab==='training'){
    return `<div class="hist-item">
      <div class="hist-top"><span class="hist-title">特訓局（ランク ${e.rankAtTime}）</span><span class="hist-date">${fmtDate(e.timestamp)}</span></div>
      <div class="hist-meta">
        <span><b>${e.myScore}</b> - <b>${e.aiScore}</b></span>
        <span>${fmtDuration(e.durationSec)}</span>
        <span>${e.moves}手</span>
        <span>${e.speedLabel}</span>
        <span class="result-pill ${e.result==='win'?'win':(e.result==='lose'?'lose':'draw')}">${e.result==='win'?'勝ち':e.result==='lose'?'負け':'分け'}</span>
      </div>
      <button class="btn btn-soft" data-action="watch-replay" data-scope="training" data-idx="${i}">一手一手を再生する</button>
    </div>`;
  }
  return `<div class="hist-item">
    <div class="hist-top"><span class="hist-title">ゆる対局（${e.difficulty}）</span><span class="hist-date">${fmtDate(e.timestamp)}</span></div>
    <div class="hist-meta">
      <span><b>${e.myScore}</b> - <b>${e.aiScore}</b></span>
      <span>${fmtDuration(e.durationSec)}</span>
      <span>${e.moves}手</span>
      <span class="result-pill ${e.result==='win'?'win':(e.result==='lose'?'lose':'draw')}">${e.result==='win'?'勝ち':e.result==='lose'?'負け':'分け'}</span>
    </div>
    <button class="btn btn-soft" data-action="watch-replay" data-scope="casual" data-idx="${i}">一手一手を再生する</button>
  </div>`;
}
function fmtDate(ts){
  const d=new Date(ts);
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

let replayState=null;
function openReplay(scope, idx){
  const list = scope==='battle'?state.battleHistory : scope==='training'?state.training.history : state.casual.history;
  const entry = list[idx];
  if(!entry) return;
  if(!Array.isArray(entry.boardStates) || entry.boardStates.length===0){
    toast('古い対局のため、リプレイは残っていません');
    return;
  }
  replayState = {entry, step:0, playing:false};
  sub.library='replay';
  render();
}
function renderReplayScreen(){
  const {entry, step} = replayState;
  const states = Array.isArray(entry.boardStates) ? entry.boardStates : [];
  const total = states.length;
  const board = (step===0 || !states[step-1]) ? newBoard() : states[step-1];
  const cells=[];
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const v=board[r][c];
    cells.push(`<div class="cell">${v!==0?`<div class="stone ${v===1?'black':'white'}"></div>`:''}</div>`);
  }
  return `
    <div class="section-title">${ruby('対局','たいきょく',2)}リプレイ</div>
    <div class="board-wrap replay-board">
      <div class="board ${boardStyleClass()}">${cells.join('')}</div>
    </div>
    <div class="replay-step-label">${step} / ${total} 手目</div>
    <input class="replay-range" type="range" min="0" max="${total}" value="${step}" data-action="replay-seek">
    <div class="replay-ctrl">
      <button data-action="replay-first">⏮</button>
      <button data-action="replay-prev">◀</button>
      <button class="big" data-action="replay-play">${replayState.playing?'❚❚':'▶'}</button>
      <button data-action="replay-next">▶</button>
      <button data-action="replay-last">⏭</button>
    </div>
    <button class="btn btn-ghost" data-action="replay-close" style="margin-top:16px;">ライブラリに戻る</button>
  `;
}
let replayTimer=null;
function replayTick(){
  if(!replayState || !replayState.playing) return;
  const total = replayState.entry.boardStates.length;
  if(replayState.step>=total){ replayState.playing=false; render(); return; }
  replayState.step++;
  render();
  replayTimer=setTimeout(replayTick, 650);
}

/* ============================================================
   11. save export / import ("encrypted" txt)
   ============================================================ */
function encodeSave(obj){
  const json = JSON.stringify(obj);
  const bytes = new TextEncoder().encode(json);
  let bin = '';
  for(let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  const b64 = btoa(bin);
  const reversed = b64.split('').reverse().join('');
  const shifted = reversed.split('').map(ch=>String.fromCharCode(ch.charCodeAt(0)+7)).join('');
  return 'GENSEKI-OTHELLO-SAVE::' + btoa(shifted);
}
function decodeSave(text){
  const marker='GENSEKI-OTHELLO-SAVE::';
  const idx = text.indexOf(marker);
  if(idx===-1) throw new Error('セーブデータの形式が正しくありません');
  const payload = text.slice(idx+marker.length).trim();
  try {
    const shifted = atob(payload);
    const reversed = shifted.split('').map(ch=>String.fromCharCode(ch.charCodeAt(0)-7)).join('');
    const b64 = reversed.split('').reverse().join('');
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const json = new TextDecoder('utf-8').decode(bytes);
    return JSON.parse(json);
  } catch(err) {
    console.error('Decode error:', err);
    throw new Error('セーブデータの形式が正しくありません: ' + err.message);
  }
}
function exportSave(scope){
  let payload, filename;
  const stamp = new Date().toISOString().slice(0,10).replace(/-/g,'');
  if(scope==='all'){ payload=state; filename=`genseki_othello_save_${stamp}.txt`; }
  else if(scope==='training'){ payload={training:state.training}; filename=`genseki_othello_training_${stamp}.txt`; }
  else if(scope==='casual'){ payload={casual:state.casual}; filename=`genseki_othello_casual_${stamp}.txt`; }
  const text = encodeSave(payload);
  const blob = new Blob([text], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  toast('セーブデータを書き出しました');
}
function importSave(scope){
  const input = document.getElementById('importFile');
  input.onchange = ()=>{
    const file = input.files[0];
    if(!file) return;
    if(file.size > 20*1024*1024){ toast('ファイルサイズが20MBを超えています'); return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = decodeSave(reader.result);
        if(scope==='all'){
          state = deepMerge(structuredClone(DEFAULT_STATE), data);
        } else if(scope==='training' && data.training){
          state.training = deepMerge(structuredClone(DEFAULT_STATE.training), data.training);
        } else if(scope==='casual' && data.casual){
          state.casual = deepMerge(structuredClone(DEFAULT_STATE.casual), data.casual);
        } else {
          toast('この画面のデータ形式ではありません'); return;
        }
        saveState();
        toast('セーブデータを読み込みました');
        render();
      }catch(e){
        toast('読み込みに失敗しました。ファイルを確認してください');
      }
    };
    reader.readAsText(file);
    input.value='';
  };
  input.click();
}

let navTimer=null;
let pendingSheetCallback=null; // for modal start choice callbacks
let pendingSheetData=null;     // for passing data to callbacks
function applyTheme(theme){
  const root = document.documentElement;
  if(theme === 'dark'){
    root.setAttribute('data-theme', 'dark');
  } else if(theme === 'light'){
    root.setAttribute('data-theme', 'light');
  } else {
    // device: remove attribute to use system preference
    root.removeAttribute('data-theme');
  }
}
function navigate(mutateFn, afterFn){
  window.scrollTo(0, 0);  // スクロール初期化
  const root = document.getElementById('view-root');
  if(!state.settings.animTransition || !root){
    mutateFn(); render(); if(afterFn) afterFn();
    return;
  }
  clearTimeout(navTimer);
  root.style.transition = 'transform .16s cubic-bezier(.4,0,1,1), opacity .16s cubic-bezier(.4,0,1,1)';
  root.style.transform = 'translateX(-22px)';
  root.style.opacity = '0';
  navTimer = setTimeout(()=>{
    mutateFn();
    render();
    const r2 = document.getElementById('view-root');
    r2.style.transition = 'none';
    r2.style.transform = 'translateX(22px)';
    r2.style.opacity = '0';
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        r2.style.transition = 'transform .34s cubic-bezier(.16,1,.3,1), opacity .28s cubic-bezier(.16,1,.3,1)';
        r2.style.transform = 'translateX(0)';
        r2.style.opacity = '1';
      });
    });
    if(afterFn) afterFn();
  }, 150);
}

document.addEventListener('click', (e)=>{
  try{
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;
  switch(action){
    case 'tab':
      navigate(()=>{
        const tabId = el.dataset.tab;
        if(tabId === 'battle' || tabId === 'training' || tabId === 'casual' || tabId === 'online'){
          // 挑戦中にタブで抜けた場合は、挑戦を終わらせてスキンも戻す
          if(stellaChallengeActive){ endStellaChallenge(); game = null; sub.casual = 'home'; }
          currentBasicMode = tabId;
          activeTab = 'basic';
          checkStellaCommand(tabId);
        } else if(tabId === 'variety' || tabId === 'story' || tabId === 'memory'){
          currentAdventureMode = tabId;
          activeTab = 'adventure';
          stellaCommandSequence = [];
        } else {
          if(tabId === 'library'){ sub.library='list'; }
          activeTab = tabId;
          stellaCommandSequence = [];
        }
      });
      break;
    case 'go-home':
      navigate(()=>{ activeTab = 'home'; });
      break;
    case 'view-news-list':
      // 先に「読み込み中」を描画してから、取得完了後に再描画する
      cachedNewsListHtml = '';
      navigate(()=>{ activeTab = 'news'; });
      viewNewsList()
        .then(html => {
          cachedNewsListHtml = html;
          if(activeTab === 'news') render();
        })
        .catch(err => {
          console.error('お知らせ一覧の取得に失敗:', err);
          cachedNewsListHtml = `
            <div class="hero" style="background:linear-gradient(150deg, var(--jade-light), var(--jade-deep) 75%);">
              <div class="hero-eyebrow">NEWS</div>
              <h2>お知らせ</h2>
            </div>
            <div class="card">
              <p style="text-align:center; color:var(--ink-soft); margin:0;">お知らせを読み込めませんでした</p>
            </div>`;
          if(activeTab === 'news') render();
        });
      break;
    case 'go-basic':
      navigate(()=>{ activeTab = 'basic'; currentBasicMode = 'battle'; });
      break;
    case 'go-adventure':
      navigate(()=>{ activeTab = 'adventure'; currentAdventureMode = 'variety'; });
      break;
    case 'battle-flip':
      state.settings.battle.flipMode = el.dataset.v; saveState(); render(); break;
    case 'battle-start': startBattle(); break;
    case 'training-start': startTraining(); break;
    case 'casual-pick': endStellaChallenge(); startCasual(el.dataset.id); break;
    case 'variety-pick': startVariety(el.dataset.presetId); break;
    case 'variety-custom': navigate(()=>{ sub.variety='custom'; }); break;
    case 'variety-back': navigate(()=>{ sub.variety='home'; }); break;
    case 'variety-toggle-rule':
      const ruleId = el.dataset.rule;
      state.variety.customRules[ruleId] = el.checked;
      saveState();
      render();
      break;
    case 'variety-start-custom': startVarietyCustom(); break;
    case 'cell': onCellClick(parseInt(el.dataset.r), parseInt(el.dataset.c)); break;
    case 'player-pass':
      if(game && !game.over && !game.thinking){
        game.passStreak++;
        game.animPlaced = null;
        game.animFlips = null;
        
        // ターン交代後のチェック
        const other = game.current === 1 ? 2 : 1;
        const otherMoves = validMoves(game.board, other);
        const selfMoves = validMoves(game.board, game.current);
        
        if(otherMoves.length > 0){
          // 相手が置ける → 相手ターンに
          game.current = other;
          game.passStreak = 0;
          render();
          startLiveTimer();
          if(game.current === 2) maybeTriggerAI(game);
        } else if(selfMoves.length > 0){
          // 相手が置けず、自分が置ける → 自分ターン継続（パス）
          render();
          startLiveTimer();
        } else {
          // どちらも置けない → ゲーム終了
          endGame(game);
          render();
          startLiveTimer();
        }
      }
      break;
    case 'give-up':
      // オンライン対局では投了できない（相手を置き去りにしないため）
      if(game && game.mode==='online') break;
      navigate(()=>{ if(game){ game=null; } sub[activeTab]='home'; });
      break;
    case 'see-result':
      if(game && game.mode==='online'){ navigate(()=>{ sub.online='room'; }); break; }
      navigate(()=>{ sub[activeTab]='result'; });
      break;
    case 'enable-stella':
      state.settings.stellaUnlocked = true;
      state.settings.casualSkin = 'stella';
      saveState();
      endStellaChallenge();
      toast('「Stella」スキンを有効にしました');
      navigate(()=>{ game=null; sub.casual='home'; });
      break;
    case 'set-casual-skin':
      state.settings.casualSkin = (el.dataset.skin === 'stella') ? 'stella' : 'default';
      saveState();
      render();
      break;
    case 'back-home':
      // 挑戦から抜けるときは挑戦の状態も解除する
      endStellaChallenge();
      navigate(()=>{ 
        game=null; 
        if(activeTab==='basic' && currentBasicMode==='casual'){
          sub.casual='modeSelect';
        } else {
          sub[activeTab]='home';
        }
      });
      break;
    case 'play-again': {
      const mode=game.mode, opts=game.opts;
      // 挑戦をやり直す場合、勝利の記録は持ち越さない
      if(stellaChallengeActive) stellaChallengeWon = false;
      navigate(()=>{ 
        game = makeGameSession(mode, opts);
        // モードに応じて sub を初期化
        if(mode === 'battle') sub.battle = 'play';
        else if(mode === 'training') sub.training = 'play';
        else if(mode === 'casual') sub.casual = 'play';
        else if(mode === 'variety') sub.variety = 'play';
      }, ()=>{
        startLiveTimer();
        if(game.current === 2) maybeTriggerAI(game);
      });
      break;
    }
    case 'lib-tab': navigate(()=>{ libTab=el.dataset.id; }); break;
    case 'watch-replay': openReplay(el.dataset.scope, parseInt(el.dataset.idx)); break;
    case 'replay-close':
      clearTimeout(replayTimer); navigate(()=>{ replayState=null; sub.library='list'; }); break;
    case 'replay-first': replayState.step=0; render(); break;
    case 'replay-last': replayState.step=replayState.entry.boardStates.length; render(); break;
    case 'replay-prev': replayState.step=Math.max(0,replayState.step-1); render(); break;
    case 'replay-next': replayState.step=Math.min(replayState.entry.boardStates.length,replayState.step+1); render(); break;
    case 'replay-play':
      replayState.playing = !replayState.playing;
      if(replayState.playing) replayTick(); else clearTimeout(replayTimer);
      render(); break;
    case 'set-graphics': state.settings.graphics=el.dataset.v; saveState(); render(); break;
    case 'set-boardstyle': state.settings.boardStyle=el.dataset.v; saveState(); render(); break;
    case 'set-theme': state.settings.theme=el.dataset.v; saveState(); render(); break;
    case 'set-defaultflip': state.settings.battle.flipMode=el.dataset.v; saveState(); render(); break;
    case 'set-furigana': state.settings.furiganaLevel=parseInt(el.dataset.v); saveState(); render(); break;
    case 'training-start-mode': state.training.startMode=el.dataset.v; saveState(); render(); break;
    case 'casual-start-mode': state.casual.startMode=el.dataset.v; saveState(); render(); break;
    case 'toggle-casual-hint': state.casual.showHints = !state.casual.showHints; saveState(); render(); break;
    case 'toggle-bgm':
      state.settings.bgmEnabled = !(state.settings.bgmEnabled !== false);
      saveState();
      if(state.settings.bgmEnabled) playBGM(bgmForCurrentScreen(), true);
      else stopBGM(true);
      render();
      break;
    case 'toggle-se':
      state.settings.seEnabled = !(state.settings.seEnabled !== false);
      saveState();
      if(state.settings.seEnabled) playSE('tap');
      render();
      break;
    case 'online-join-code': {
      const nameEl = document.getElementById('onlineName');
      const codeEl = document.getElementById('onlineCode');
      const nm = (nameEl && nameEl.value.trim()) || onlineDefaultName();
      onlineJoinByCode(codeEl ? codeEl.value : '', nm);
      break;
    }
    case 'online-random': {
      const nameEl2 = document.getElementById('onlineName');
      const nm2 = (nameEl2 && nameEl2.value.trim()) || onlineDefaultName();
      onlineRandomMatch(nm2);
      break;
    }
    case 'online-leave': onlineLeave(); break;
    case 'account-open':
      accountFormMode = el.dataset.mode === 'login' ? 'login' : 'signup';
      accountError = '';
      ensureFirebase();
      navigate(()=>{ sub.settings = 'account'; });
      break;
    case 'account-switch':
      accountFormMode = accountFormMode === 'signup' ? 'login' : 'signup';
      accountError = '';
      render();
      break;
    case 'account-close':
      accountError = '';
      navigate(()=>{ sub.settings = 'home'; });
      break;
    case 'account-signup-email': {
      const em = (document.getElementById('accEmail')||{}).value || '';
      const pw = (document.getElementById('accPass')||{}).value || '';
      if(!em.trim() || !pw){ toast('メールアドレスとパスワードを入力してください'); break; }
      accountSignUpEmail(em.trim(), pw);
      break;
    }
    case 'account-login-email': {
      const em2 = (document.getElementById('accEmail')||{}).value || '';
      const pw2 = (document.getElementById('accPass')||{}).value || '';
      if(!em2.trim() || !pw2){ toast('メールアドレスとパスワードを入力してください'); break; }
      accountLoginEmail(em2.trim(), pw2);
      break;
    }
    case 'account-google': accountLoginGoogle(); break;
    case 'account-reset': {
      const em3 = (document.getElementById('accEmail')||{}).value || '';
      if(!em3.trim()){ toast('メールアドレスを入力してください'); break; }
      accountResetPassword(em3.trim());
      break;
    }
    case 'account-logout': accountLogout(); break;
    case 'cloud-save-now':
      cloudSaveNow().then(ok => toast(ok ? 'クラウドに保存しました' : '保存できませんでした'));
      break;
    case 'go-account':
      accountFormMode = 'signup';
      ensureFirebase();
      navigate(()=>{ activeTab = 'settings'; sub.settings = 'account'; });
      break;
    case 'friend-add': {
      const fc = (document.getElementById('friendCode')||{}).value || '';
      friendAddByCode(fc);
      break;
    }
    case 'friend-remove': friendRemove(el.dataset.uid); break;
    case 'friend-request': friendRequestSend(el.dataset.uid, el.dataset.name); break;
    case 'req-accept': friendRequestAccept(el.dataset.uid); break;
    case 'req-reject': friendRequestReject(el.dataset.uid); break;
    case 'open-mypage':
      iconPickerOpen = false;
      navigate(()=>{ activeTab='settings'; sub.settings='mypage'; });
      break;
    case 'open-other': openOtherProfile(el.dataset.uid, el.dataset.name); break;
    case 'other-close': otherProfile = null; navigate(()=>{ sub.settings='mypage'; }); break;
    case 'icon-choose': {
      const inp = document.getElementById('iconFile');
      if(!inp) break;
      inp.value = '';
      inp.onchange = async () => {
        const f = inp.files && inp.files[0];
        if(!f) return;
        profileBusy = true; render();
        try{
          const url = await imageToIconDataUrl(f);
          const ok = await saveMyProfile({icon: url});
          toast(ok ? 'アイコンを変えました' : '保存できませんでした');
        }catch(err){
          console.error(err);
          toast(err.message || '画像を使えませんでした');
        }finally{
          profileBusy = false; render();
        }
      };
      inp.click();
      break;
    }
    case 'icon-clear':
      saveMyProfile({icon: ''}).then(()=>{ toast('アイコンを削除しました'); render(); });
      break;
    case 'profile-save': {
      const nm = (document.getElementById('mpName')||{}).value || '';
      const bi = (document.getElementById('mpBio')||{}).value || '';
      if(bi.length > BIO_MAX){ toast('自己紹介は' + BIO_MAX + '文字までです'); break; }
      profileBusy = true; render();
      saveMyProfile({displayName: nm.trim(), bio: bi}).then(ok => {
        profileBusy = false;
        toast(ok ? 'プロフィールを保存しました' : '保存できませんでした');
        publishStats();
        render();
      });
      break;
    }
    case 'link-google': linkGoogle(); break;
    case 'link-email-open': accountFormMode = 'link'; navigate(()=>{ sub.settings='account'; }); break;
    case 'link-email-do': {
      const le = (document.getElementById('accEmail')||{}).value || '';
      const lp = (document.getElementById('accPass')||{}).value || '';
      if(!le.trim() || !lp){ toast('メールアドレスとパスワードを入力してください'); break; }
      linkEmail(le.trim(), lp);
      break;
    }
    case 'friend-invite': friendInvite(el.dataset.uid, el.dataset.name); break;
    case 'invite-accept': acceptInvite(el.dataset.id); break;
    case 'invite-decline': declineInvite(el.dataset.id); break;
    case 'export-save': exportSave(el.dataset.scope); break;
    case 'import-save': importSave(el.dataset.scope); break;
    case 'reset-settings':
      state.settings = structuredClone(DEFAULT_STATE.settings);
      saveState(); toast('設定をデフォルトに戻しました'); render(); break;
    case 'delete-cache': showConfirmDeleteCache(); break;
    case 'confirm-delete-1': showConfirmDeleteCache2(); break;
    case 'confirm-delete-2':
      localStorage.removeItem('genseki_othello_save_v1');
      state = structuredClone(DEFAULT_STATE);
      closeSheet(); toast('キャッシュを削除しました'); render(); break;
    case 'close-sheet': closeSheet(); break;
    case 'confirm-sheet-choice':
      const sheetType = el.dataset.sheetType;
      let selectedValue = null;
      if(sheetType === 'training'){
        const chosen = document.querySelector('[data-training-start-choice]:checked');
        selectedValue = chosen ? chosen.value : 'black';
      } else if(sheetType === 'casual'){
        const chosen = document.querySelector('[data-casual-start-choice]:checked');
        selectedValue = chosen ? chosen.value : 'black';
      }
      closeSheet();
      if(selectedValue){
        const isBlack = selectedValue === 'black';
        if(sheetType === 'training'){
          const t = state.training;
          const depth = trainingDepthForRank(t.rankIndex, t.xNumber);
          doStartTraining(depth, isBlack);
        } else if(sheetType === 'casual' && pendingSheetData){
          const d = pendingSheetData.difficulty;
          doStartCasual(d, isBlack);
          pendingSheetData = null;
        }
        pendingSheetCallback = null;
      }
      break;
    case 'overlay-bg': if(e.target===el) closeSheet(); break;
  }
  }catch(err){
    console.error('Click handler error:', err);
  }
});
document.addEventListener('change', (e)=>{
  try{
    const el = e.target.closest('[data-action]');
    if(!el) return;
    if(el.dataset.action==='toggle-anim-flip'){ state.settings.animFlip=el.checked; saveState(); render(); }
    if(el.dataset.action==='toggle-anim-trans'){ state.settings.animTransition=el.checked; saveState(); render(); }
    if(el.dataset.action==='toggle-timer'){ state.settings.showTimer=el.checked; saveState(); render(); }
    if(el.dataset.action==='toggle-casual-hint'){ state.casual.showHints=el.checked; saveState(); render(); }
    if(el.dataset.action==='toggle-allow-pass'){ state.settings.allowPass=el.checked; saveState(); render(); }
    if(el.dataset.action==='replay-seek'){ replayState.step=parseInt(el.value); render(); }
  }catch(err){
    console.error('Change handler error:', err);
  }
});
document.addEventListener('input', (e)=>{
  try{
    if(e.target.id==='p1name'){ state.settings.battle.p1=e.target.value; }
    if(e.target.id==='p2name'){ state.settings.battle.p2=e.target.value; }
    if(e.target.id==='setP1'){ state.settings.battle.p1=e.target.value; saveState(); }
    if(e.target.id==='setP2'){ state.settings.battle.p2=e.target.value; saveState(); }
    if(e.target.id==='usernameInput'){ state.username=e.target.value; saveState(); }
  }catch(err){
    console.error('Input handler error:', err);
  }
});

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

/* ============================================================
   14. boot
   ============================================================ */
// ズーム・スクロール防止（対局中のみ）
document.addEventListener('wheel', (e)=>{ if(game && e.ctrlKey) e.preventDefault(); }, {passive:false});
document.addEventListener('touchmove', (e)=>{
  if(game && e.touches.length>1) e.preventDefault();
}, {passive:false});
document.addEventListener('gesturestart', (e)=>{ if(game) e.preventDefault(); }, {passive:false});
// ダブルタップズーム防止（対局中のみ）
let lastTouchEnd = 0;
document.addEventListener('touchend', (e)=>{
  if(!game) return;
  const now = Date.now();
  if(now - lastTouchEnd <= 300){ e.preventDefault(); }
  lastTouchEnd = now;
}, {passive:false});
applyTheme(state.settings.theme);
render();
preloadAudioFiles();
setupAudioUnlock();
// アカウント状態と招待を受け取れるよう、開いた時点で接続する
if(firebaseConfigured()) ensureFirebase();
// 開いた時点でBGMを鳴らす（スマホでは最初の操作の直後に鳴り出す）
updateBGM();
</script>
</body>
</html>
