/* ============================================================
   8. shared game session + board rendering
   ============================================================ */
function generateLuckyUnluckyMap(){
  const map = Array(8).fill(null).map(()=>Array(8).fill(0));
  const count = Math.floor(Math.random() * 5) + 4;
  for(let i = 0; i < count; i++){
    const r = Math.floor(Math.random() * 8);
    const c = Math.floor(Math.random() * 8);
    if(map[r][c] === 0){
      map[r][c] = Math.random() < 0.5 ? 1 : -1;
    }
  }
  return map;
}

function generateWarpMap(){
  const warpPairs = [
    {from:[0,0], to:[7,7]},
    {from:[0,7], to:[7,0]},
    {from:[0,3], to:[7,4]},
    {from:[0,4], to:[7,3]},
  ];
  const map = {};
  warpPairs.forEach(p=>{
    const key1 = `${p.from[0]},${p.from[1]}`;
    const key2 = `${p.to[0]},${p.to[1]}`;
    map[key1] = {r:p.to[0], c:p.to[1]};
    map[key2] = {r:p.from[0], c:p.from[1]};
  });
  return map;
}

function makeGameSession(mode, opts){
  const playerStarts = opts.playerStarts !== undefined ? opts.playerStarts : true;
  const session = {
    mode, opts,
    board:newBoard(),
    current: playerStarts ? 1 : 2, // 1 black (player), 2 white (AI)
    startedAt: Date.now(),
    moveCount:0,
    boardStates:[], // snapshot after each ply (for replay)
    passStreak:0,
    pendingFlips:null, // {row,col,player,flips:[[r,c]],done:[]}
    over:false,
    lastResult:null,
    thinking:false,
    animPlaced:null,
    animFlips:null,
    aiStartTime:null,
    aiTimeoutPassed:false,
  };
  
  // バラエティモード用フィールド
  if(mode === 'variety'){
    session.varietyState = {
      rules: opts.varietyRules || {},
      eventTriggered: false,
      eventMessage: '',
      luckyUnluckyMap: opts.luckyUnluckyMap || generateLuckyUnluckyMap(),
      warpMap: opts.warpMap || generateWarpMap(),
      eventQueue: [],
    };
  }
  
  return session;
}
function turnColorMeta(g){
  if(g.mode==='battle'){
    return g.current===1
      ? {name:state.settings.battle.p1, color:'black'}
      : {name:state.settings.battle.p2, color:'white'};
  }
  if(g.mode==='online'){
    const mine = g.current === onlineState.myColor;
    return {
      name: mine ? (onlineState.myName || 'あなた') : (onlineState.oppName || '相手'),
      color: g.current===1 ? 'black' : 'white'
    };
  }
  return g.current===1 ? {name:'あなた', color:'black'} : {name:'AI', color:'white'};
}
function boardStyleClass(){ 
  const stella = (game && game.mode==='casual' && state.settings.stellaEnabled) ? ' stella' : '';
  return (state.settings.boardStyle==='illust' ? 'illust' : '') + stella;
}

function renderBoardScreen(){
  const g = game;
  const {black,white} = countStones(g.board);
  const meta = turnColorMeta(g);
  const leftName = g.mode==='battle' ? state.settings.battle.p1
                 : (g.mode==='online' ? (onlineState.myName||'あなた') : 'あなた');
  const rightName = g.mode==='battle' ? state.settings.battle.p2
                  : (g.mode==='online' ? (onlineState.oppName||'相手')
                  : (g.mode==='training'?'AI（特訓）':'AI'));
  const cells = [];
  const animateOn = state.settings.animFlip;
  const placed = g.animPlaced;
  const flipsAnim = g.animFlips || [];
  const myTurnNow = g.mode==='battle' ? true
                  : (g.mode==='online' ? g.current===onlineState.myColor : g.current===1);
  const actualMoves = (!g.over && !g.pendingFlips && !g.thinking && myTurnNow) ? validMoves(g.board,g.current) : [];
  let showHints;
  if(g.mode==='battle') showHints = g.current===1 ? g.opts.p1ShowHints : g.opts.p2ShowHints;
  else if(g.mode==='training') showHints = false;
  else if(g.mode==='online') showHints = true;
  else showHints = !!g.opts.showHints;
  const hintMoves = showHints ? actualMoves : [];
  const moveMap = {}; hintMoves.forEach(m=>moveMap[m.row+'_'+m.col]=true);
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const v=g.board[r][c];
    let cls='cell';
    let inner='';
    if(v===0 && moveMap[r+'_'+c]) cls+=' hint';
    if(g.pendingFlips && g.pendingFlips.flips.some(([fr,fc])=>fr===r&&fc===c) && !g.pendingFlips.done.some(([dr,dc])=>dr===r&&dc===c)){
      cls+=' flip-target';
    }
    if(v!==0){
      let stoneCls='stone '+(v===1?'black':'white');
      let stoneStyle='';
      if(animateOn && placed && placed.row===r && placed.col===c) stoneCls+=' dropping';
      if(animateOn){
        const idx = flipsAnim.findIndex(([fr,fc])=>fr===r&&fc===c);
        if(idx!==-1){ stoneCls+=' flipping'; stoneStyle=` style="animation-delay:${idx*75}ms"`; }
      }
      // Stella スキン用の星型石
      const isStellaMode = game && game.mode==='casual' && state.settings.stellaEnabled;
      if(isStellaMode){
        const starColor = v===1 ? '#FFD700' : '#FFF';
        inner = `<div class="${stoneCls}"${stoneStyle}><svg viewBox="0 0 100 100" style="width:100%; height:100%; fill:${starColor};">
          <polygon points="50,10 61,40 92,40 68,60 79,90 50,70 21,90 32,60 8,40 39,40"/>
        </svg></div>`;
      } else {
        inner = `<div class="${stoneCls}"${stoneStyle}></div>`;
      }
    }
    cells.push(`<div class="${cls}" data-action="cell" data-r="${r}" data-c="${c}">${inner}</div>`);
  }
  g.animPlaced=null; g.animFlips=null;
  const timer = state.settings.showTimer ? `<span class="timer" id="liveTimer">00:00</span>` : '';
  let statusNote='';
  if(g.over){
    statusNote = `<div class="pass-note">対局が終了しました</div>`;
  } else if(g.thinking){
    statusNote = `<div class="pass-note">AIが考えています…</div>`;
  } else if(g.pendingFlips){
    statusNote = `<div class="pass-note">ひっくり返す石をタップしてください（残り${g.pendingFlips.flips.length-g.pendingFlips.done.length}個）</div>`;
  } else if(g.mode==='online' && g.current !== onlineState.myColor){
    const left = Math.ceil(onlineIdleRemaining()/1000);
    const warn = (left <= 60) ? `<br><span style="font-size:11px;">あと${left}秒動きがないと、相手の放棄になります</span>` : '';
    statusNote = `<div class="pass-note">${escapeHtml(onlineState.oppName||'相手')}の番です…${warn}</div>`;
  } else if(actualMoves.length===0 && !g.over){
    statusNote = `<div class="pass-note">置ける場所がないため、パスします</div>`;
  }
  
  // バラエティモードのイベント表示
  let varietyEventMarkup = '';
  if(g.mode === 'variety' && g.varietyState && g.varietyState.eventMessage){
    varietyEventMarkup = `<div style="background:var(--urushi-light); color:var(--urushi); padding:10px; border-radius:8px; margin-bottom:12px; text-align:center; font-weight:700; font-size:14px;">${g.varietyState.eventMessage}</div>`;
    // イベント表示を一度だけ表示させる（次のレンダリングで消す）
    setTimeout(()=>{ if(g.varietyState) g.varietyState.eventMessage = ''; }, 2000);
  }
  
  // パスボタンの表示判定
  const showPassBtn = state.settings.allowPass && !g.over && !g.thinking && !g.pendingFlips && 
                      (g.mode==='battle' || g.current===1);
  
  return `
    <div class="board-wrap">
      <div class="turn-banner">
        <div class="who"><span class="dot" style="background:${meta.color==='black'?'#111':'#fff'};"></span>${g.over? '対局終了':escapeHtml(meta.name)+'さんのターン'}</div>
        ${timer}
      </div>
      <div class="score-strip">
        <div class="score-chip ${black>=white?'leading':''}"><span class="sc-stone" style="background:#111;"></span><span class="sc-name">${escapeHtml(leftName)}</span><span class="sc-num">${black}</span></div>
        <div class="score-chip ${white>black?'leading':''}"><span class="sc-stone" style="background:#eee; box-shadow:inset 0 0 0 1px #ccc;"></span><span class="sc-name">${escapeHtml(rightName)}</span><span class="sc-num">${white}</span></div>
      </div>
      <div class="board ${boardStyleClass()}" id="boardEl">${cells.join('')}</div>
      ${varietyEventMarkup}
      ${statusNote}
    </div>
    ${showPassBtn?`<div style="margin-top:10px;"><button class="btn btn-soft" data-action="player-pass">このターンをパスする</button></div>`:''}
    <div class="btn-row" style="margin-top:14px;">
      ${g.mode==='online' ? '' : `<button class="btn btn-ghost" data-action="give-up">${ruby('投了','とうりょう',1)}してもどる</button>`}
      ${g.over?'<button class="btn btn-primary" data-action="see-result">結果を見る</button>':''}
    </div>
  `;
}

let timerHandle=null;
function startLiveTimer(){
  stopLiveTimer();
  timerHandle=setInterval(()=>{
    const el=document.getElementById('liveTimer');
    if(!el || !game){ return; }
    const sec = Math.floor((Date.now()-game.startedAt)/1000);
    el.textContent = String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
  },1000);
}
function stopLiveTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } }

/* ---- interaction: placing stones ---- */
function onCellClick(r,c){
  const g=game;
  if(!g || g.over || g.thinking) return;
  if(g.pendingFlips){
    const idx = g.pendingFlips.flips.findIndex(([fr,fc])=>fr===r&&fc===c);
    const already = g.pendingFlips.done.some(([dr,dc])=>dr===r&&dc===c);
    if(idx===-1 || already) return;
    g.pendingFlips.done.push([r,c]);
    g.board[r][c]=g.pendingFlips.player;
    g.animFlips=[[r,c]]; g.animPlaced=null;
    if(g.pendingFlips.done.length===g.pendingFlips.flips.length){
      g.pendingFlips=null;
      finishPly(g);
    } else {
      render(); startLiveTimer();
    }
    return;
  }
  if(g.mode==='battle'){
    tryHumanMove(g,r,c);
  } else if(g.mode==='online'){
    // オンラインは自分の色の手番だけ操作できる
    if(g.current !== onlineState.myColor) return;
    tryHumanMove(g,r,c);
  } else {
    if(g.current!==1) return; // only human's (black) turn is clickable
    tryHumanMove(g,r,c);
  }
}
function tryHumanMove(g,r,c){
  // オンラインは自分の手番のときだけ、サーバーに送る
  if(g.mode==='online'){
    if(g.over || g.current !== onlineState.myColor) return;
    if(!getFlips(g.board,r,c,g.current).length) return;
    onlineSendMove(r,c);
    return;
  }
  let flips = getFlips(g.board,r,c,g.current);
  if(!flips.length) return;
  
  // バラエティモード: ワープルール適用
  let finalRow = r, finalCol = c;
  let eventMsg = '';
  if(g.mode==='variety' && g.varietyState && g.varietyState.rules.warp){
    const key = `${r},${c}`;
    if(g.varietyState.warpMap[key]){
      const warp = g.varietyState.warpMap[key];
      finalRow = warp.r;
      finalCol = warp.c;
      eventMsg = '✨ワープした！';
      // ワープ後の位置でフリップ位置を再計算
      flips = getFlips(g.board, finalRow, finalCol, g.current);
      if(!flips.length) {
        // ワープ後の位置が置けない場合は元の位置に戻す
        finalRow = r;
        finalCol = c;
        flips = getFlips(g.board, r, c, g.current);
        eventMsg = '✨ワープしたが戻ってきた...';
      }
    }
  }
  
  // バラエティモード: ラッキー/アンラッキールール適用
  let luckyEffect = 0;
  if(g.mode==='variety' && g.varietyState && g.varietyState.rules.lucky_unlucky){
    const effect = g.varietyState.luckyUnluckyMap[finalRow]?.[finalCol];
    if(effect === 1){
      eventMsg = '🍀ラッキー！';
      luckyEffect = 1;
    } else if(effect === -1){
      eventMsg = '💔アンラッキー...';
      luckyEffect = -1;
    }
  }
  
  if(eventMsg && g.varietyState) g.varietyState.eventMessage = eventMsg;
  
  const manual = g.mode==='battle' && g.opts.flipMode==='manual';
  g.board[finalRow][finalCol]=g.current;
  g.moveCount++;
  g.animPlaced={row:finalRow,col:finalCol};
  
  // ラッキーボーナス: 追加で1マス多くフリップ
  if(luckyEffect === 1 && flips.length > 0){
    // ラッキーマスでは、フリップ数が増える（追加ボーナス）
    g.luckyBonus = true;
  } else if(luckyEffect === -1 && flips.length > 0){
    // アンラッキーでは、フリップが減る
    const reducedFlips = flips.slice(0, Math.max(1, Math.floor(flips.length / 2)));
    flips = reducedFlips.length > 0 ? reducedFlips : flips;
  }
  
  if(manual && flips.length){
    g.pendingFlips={row:finalRow,col:finalCol,player:g.current,flips,done:[]};
    g.animFlips=null;
    render(); startLiveTimer();
    return;
  }
  g.animFlips=flips;
  flips.forEach(([fr,fc])=>{ g.board[fr][fc]=g.current; });
  finishPly(g);
}
function finishPly(g){
  g.boardStates.push(g.board.map(row=>row.slice()));
  
  // バラエティモード: ランダムイベント処理
  if(g.mode==='variety' && g.varietyState && g.varietyState.rules.random){
    if(Math.random() < 0.3){  // 30%の確率でイベント発生
      const randomEvents = [
        {msg:'🔄盤面が反転した！', effect:()=>{
          // ランダムに3-5個の石を反転
          const count = Math.floor(Math.random() * 3) + 3;
          for(let i=0; i<count; i++){
            const r = Math.floor(Math.random() * 8);
            const c = Math.floor(Math.random() * 8);
            if(g.board[r][c]!==0){
              g.board[r][c] = g.board[r][c]===1?2:1;
            }
          }
        }},
        {msg:'⭐ボーナスターン！', effect:()=>{
          // 追加ターン（AI側がパスする）
          const otherMoves = validMoves(g.board, g.current===1?2:1);
          if(otherMoves.length === 0){
            g.passStreak++;
          }
        }},
        {msg:'🎲運試し！', effect:()=>{
          // 特に何もしない（メッセージだけ）
        }},
      ];
      const event = randomEvents[Math.floor(Math.random() * randomEvents.length)];
      g.varietyState.eventMessage = event.msg;
      event.effect();
    }
  }
  
  const other = g.current===1?2:1;
  const otherMoves = validMoves(g.board,other);
  const selfMoves = validMoves(g.board,g.current);
  if(otherMoves.length>0){
    g.current=other; g.passStreak=0;
  } else if(selfMoves.length>0){
    g.passStreak++;
    // other has no moves, stays same player's turn (pass for opponent)
  } else {
    endGame(g);
    render();
    return;
  }
  render(); startLiveTimer();
  maybeTriggerAI(g);
}
function maybeTriggerAI(g){
  try{
    if(g.over) return;
    const isAiTurn = (g.mode==='training'||g.mode==='casual'||g.mode==='variety') && g.current===2;
    if(!isAiTurn) return;
    const moves = validMoves(g.board,2);
    if(moves.length===0){
      // AI passes - check if game should end
      const humanMoves = validMoves(g.board,1);
      if(humanMoves.length===0){ 
        endGame(g); 
        sub[g.mode === 'training' ? 'training' : g.mode === 'casual' ? 'casual' : 'variety'] = 'result';
        render(); 
        return; 
      }
      // Pass to human and show pass message
      g.current=1;
      g.passStreak++;
      g.statusNote = `<div class="pass-note">AIがパスしました</div>`;
      
      // 連続パス（両者がパス）で即終了
      if(g.passStreak >= 2){ 
        endGame(g); 
        sub[g.mode === 'training' ? 'training' : g.mode === 'casual' ? 'casual' : 'variety'] = 'result';
        render(); 
        return; 
      }
      render();
      startLiveTimer();
      return;
    }
    g.thinking=true;
    g.aiStartTime=Date.now();
    render();
    setTimeout(()=>{
      try{
        if(!g.thinking) return;
        const elapsed = Date.now() - g.aiStartTime;
        if(elapsed >= 5000){
          g.thinking=false;
          const humanMoves = validMoves(g.board,1);
          const aiMoves2 = validMoves(g.board,2);
          if(humanMoves.length>0){ 
            g.current=1; 
            g.passStreak++;
            g.statusNote = `<div class="pass-note">AIがパスしました（制限時間）</div>`;
            if(g.passStreak >= 2){
              endGame(g);
              sub[g.mode === 'training' ? 'training' : g.mode === 'casual' ? 'casual' : 'variety'] = 'result';
              render();
              return;
            }
          }
          else if(aiMoves2.length>0){ maybeTriggerAI(g); return; }
          else { endGame(g); sub[g.mode === 'training' ? 'training' : g.mode === 'casual' ? 'casual' : 'variety'] = 'result'; render(); return; }
          render();
          startLiveTimer();
          return;
        }
        const mv = aiChooseMove(g.board, 2, g.opts.aiDepth, g.opts.aiRnd, g.opts.boost);
        g.thinking=false;
        if(mv){
          g.board = applyMove(g.board, mv.row, mv.col, 2, mv.flips);
          g.moveCount++;
          g.animPlaced={row:mv.row,col:mv.col};
          g.animFlips=mv.flips;
          g.boardStates.push(g.board.map(row=>row.slice()));
          g.passStreak=0;
          const humanMoves = validMoves(g.board,1);
          const aiMoves2 = validMoves(g.board,2);
          if(humanMoves.length>0){ g.current=1; }
          else if(aiMoves2.length>0){ maybeTriggerAI(g); return; }
          else { endGame(g); sub[g.mode === 'training' ? 'training' : g.mode === 'casual' ? 'casual' : 'variety'] = 'result'; render(); return; }
        } else {
          // No move found - AI passes
          const humanMoves = validMoves(g.board,1);
          const aiMoves3 = validMoves(g.board,2);
          if(humanMoves.length>0){ 
            g.current=1; 
            g.passStreak++;
            g.statusNote = `<div class="pass-note">AIがパスしました</div>`;
            if(g.passStreak >= 2){
              endGame(g);
              sub[g.mode === 'training' ? 'training' : g.mode === 'casual' ? 'casual' : 'variety'] = 'result';
              render();
              return;
            }
          }
          else if(aiMoves3.length>0){ maybeTriggerAI(g); return; }
          else { endGame(g); sub[g.mode === 'training' ? 'training' : g.mode === 'casual' ? 'casual' : 'variety'] = 'result'; render(); return; }
        }
        render();
        startLiveTimer();
      }catch(err){
        console.error('AI error:', err);
        g.thinking=false;
        render();
      }
    }, 420);
  }catch(err){
    console.error('maybeTriggerAI error:', err);
    g.thinking=false;
    render();
  }
}
function endGame(g){
  g.over=true;
  stopLiveTimer();
  const {black,white} = countStones(g.board);
  const durationSec = Math.floor((Date.now()-g.startedAt)/1000);
  const entry = {
    timestamp: Date.now(),
    durationSec,
    moves: g.moveCount,
    boardStates: g.boardStates,
  };
  // 統計を更新
  state.totalGames = (state.totalGames || 0) + 1;
  if(g.mode==='battle'){
    entry.p1Name=state.settings.battle.p1; entry.p2Name=state.settings.battle.p2;
    entry.p1Score=black; entry.p2Score=white;
    entry.winner = black>white?'p1':(white>black?'p2':'draw');
    if(entry.winner==='p1') state.totalWins = (state.totalWins || 0) + 1;
    state.battleHistory.unshift(entry);
    g.lastResult=entry;
  } else if(g.mode==='training'){
    entry.myScore=black; entry.aiScore=white; entry.rankAtTime=rankLabel(state.training.rankIndex,state.training.xNumber);
    entry.speedLabel=speedLabel(durationSec,g.moveCount);
    entry.result = black>white?'win':(white>black?'lose':'draw');
    if(entry.result==='win'){
      state.totalWins = (state.totalWins || 0) + 1;
      state.training.winCount = (state.training.winCount || 0) + 1;
      const winsNeeded = winsRequiredForRank(state.training.rankIndex);
      if(state.training.winCount >= winsNeeded){
        // ランク昇格
        state.training.winCount = 0;
        if(state.training.rankIndex < RANK_LADDER.length-1) state.training.rankIndex++;
        else state.training.xNumber = Math.min(RANK_MAX_X-1, (state.training.xNumber||1)+1);
        state.playerRank = Math.min(999, state.playerRank+1);
      }
    } else {
      state.training.winCount = 0;
    }
    state.training.history.unshift(entry);
    g.lastResult=entry;
  } else if(g.mode==='casual'){
    entry.myScore=black; entry.aiScore=white; entry.difficulty=g.opts.diffName;
    entry.result = black>white?'win':(white>black?'lose':'draw');

    // 難易度ごとの成績を記録する（未挑戦 → 敗北 → 勝利 → 完封 の順に上書き）
    state.casual.results = state.casual.results || {};
    const isPerfect = entry.result==='win' && white===0;   // 相手の石が無くなった＝完封
    const newMark = isPerfect ? 'perfect' : (entry.result==='win' ? 'won' : 'tried');
    const order = {tried:1, won:2, perfect:3};
    const prev = state.casual.results[g.opts.diffId];
    if(!prev || order[newMark] > (order[prev]||0)){
      state.casual.results[g.opts.diffId] = newMark;
    }

    if(entry.result==='win'){
      state.totalWins = (state.totalWins || 0) + 1;
      
      if(black-white>=5){
        const order = CASUAL_DIFFS.map(d=>d.id);
        const i = order.indexOf(g.opts.diffId);
        const nextD = CASUAL_DIFFS[i+1];
        if(nextD && !state.casual.unlocked[nextD.id]){
          state.casual.unlocked[nextD.id]=true;
          g.unlockedDiffId = nextD.id;
          g.unlockedDiffName = nextD.name;
          toast('「'+nextD.name+'」が解禁されました！');
        }
        state.playerRank = Math.min(999, state.playerRank+1);
      }
    }
    state.casual.history.unshift(entry);
    g.lastResult=entry;
  } else if(g.mode==='variety'){
    entry.myScore=black; entry.aiScore=white;
    entry.presetName = g.opts.varietyPresetId;
    entry.result = black>white?'win':(white>black?'lose':'draw');
    if(entry.result==='win'){
      state.totalWins = (state.totalWins || 0) + 1;
      state.playerRank = Math.min(999, state.playerRank+1);
    }
    state.variety.history = state.variety.history || [];
    state.variety.history.unshift(entry);
    g.lastResult=entry;
  }
  
  // ゲーム終了時に結果画面に遷移する状態をセット
  if(g.mode === 'battle') sub.battle = 'result';
  else if(g.mode === 'training') sub.training = 'result';
  else if(g.mode === 'casual') sub.casual = 'result';
  else if(g.mode === 'variety') sub.variety = 'result';
  else if(g.mode === 'training') sub.training = 'result';
  else if(g.mode === 'variety') sub.variety = 'result';
  else if(g.mode === 'casual') sub.casual = 'result';
  
  saveState();
}
function speedLabel(durationSec, moves){
  if(!moves) return 'ふつう';
  const avg = durationSec/moves;
  if(avg<2) return '超はやい';
  if(avg<4) return 'はやい';
  if(avg<7) return 'ふつう';
  if(avg<12) return 'ゆっくり';
  return '超ゆっくり';
}

  const {entry, step} = replayState;

  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const v=board[r][c];
    cells.push(`<div class="cell">${v!==0?`<div class="stone ${v===1?'black':'white'}"></div>`:''}</div>`);

  return `

      <div class="board ${boardStyleClass()}">${cells.join('')}</div>

      <button class="big" data-action="replay-play">${replayState.playing?'❚❚':'▶'}</button>
      <button data-action="replay-next">▶</button>
      <button data-action="replay-last">⏭</button>
    </div>
    <button class="btn btn-ghost" data-action="replay-close" style="margin-top:16px;">ライブラリに戻る</button>
  `;
}
let replayTimer=null;
function replayTick(){
  if(!replayState || !replayState.playing) return;
  const total = replayState.entry.boardStates.length;
  if(replayState.step>=total){ replayState.playing=false; render(); return; }
  replayState.step++;
  render();
  replayTimer=setTimeout(replayTick, 650);
}

/* ============================================================
   11. save export / import ("encrypted" txt)
   ============================================================ */
function encodeSave(obj){
  const json = JSON.stringify(obj);
  const bytes = new TextEncoder().encode(json);
  let bin = '';
  for(let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  const b64 = btoa(bin);
  const reversed = b64.split('').reverse().join('');
  const shifted = reversed.split('').map(ch=>String.fromCharCode(ch.charCodeAt(0)+7)).join('');
  return 'GENSEKI-OTHELLO-SAVE::' + btoa(shifted);
}
function decodeSave(text){
  const marker='GENSEKI-OTHELLO-SAVE::';
  const idx = text.indexOf(marker);
  if(idx===-1) throw new Error('セーブデータの形式が正しくありません');
  const payload = text.slice(idx+marker.length).trim();
  try {
    const shifted = atob(payload);
    const reversed = shifted.split('').map(ch=>String.fromCharCode(ch.charCodeAt(0)-7)).join('');
    const b64 = reversed.split('').reverse().join('');
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const json = new TextDecoder('utf-8').decode(bytes);
    return JSON.parse(json);
  } catch(err) {
    console.error('Decode error:', err);
    throw new Error('セーブデータの形式が正しくありません: ' + err.message);
  }
}
function exportSave(scope){
  let payload, filename;
  const stamp = new Date().toISOString().slice(0,10).replace(/-/g,'');
  if(scope==='all'){ payload=state; filename=`genseki_othello_save_${stamp}.txt`; }
  else if(scope==='training'){ payload={training:state.training}; filename=`genseki_othello_training_${stamp}.txt`; }
  else if(scope==='casual'){ payload={casual:state.casual}; filename=`genseki_othello_casual_${stamp}.txt`; }
  const text = encodeSave(payload);
  const blob = new Blob([text], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  toast('セーブデータを書き出しました');
}
function importSave(scope){
  const input = document.getElementById('importFile');
  input.onchange = ()=>{
    const file = input.files[0];
    if(!file) return;
    if(file.size > 20*1024*1024){ toast('ファイルサイズが20MBを超えています'); return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = decodeSave(reader.result);
        if(scope==='all'){
          state = deepMerge(structuredClone(DEFAULT_STATE), data);
        } else if(scope==='training' && data.training){
          state.training = deepMerge(structuredClone(DEFAULT_STATE.training), data.training);
        } else if(scope==='casual' && data.casual){
          state.casual = deepMerge(structuredClone(DEFAULT_STATE.casual), data.casual);
        } else {
          toast('この画面のデータ形式ではありません'); return;
        }
        saveState();
        toast('セーブデータを読み込みました');
        render();
      }catch(e){
        toast('読み込みに失敗しました。ファイルを確認してください');
      }
    };
    reader.readAsText(file);
    input.value='';
  };
  input.click();
}

   12b. page transition (slide, decelerating)
   ============================================================ */
let navTimer=null;
let pendingSheetCallback=null; // for modal start choice callbacks
let pendingSheetData=null;     // for passing data to callbacks
function applyTheme(theme){
  const root = document.documentElement;
  if(theme === 'dark'){
    root.setAttribute('data-theme', 'dark');
  } else if(theme === 'light'){
    root.setAttribute('data-theme', 'light');
  } else {
    // device: remove attribute to use system preference
    root.removeAttribute('data-theme');
  }
}
function navigate(mutateFn, afterFn){
  window.scrollTo(0, 0);  // スクロール初期化
  const root = document.getElementById('view-root');
  if(!state.settings.animTransition || !root){
    mutateFn(); render(); if(afterFn) afterFn();
    return;
  }
  clearTimeout(navTimer);
  root.style.transition = 'transform .16s cubic-bezier(.4,0,1,1), opacity .16s cubic-bezier(.4,0,1,1)';
  root.style.transform = 'translateX(-22px)';
  root.style.opacity = '0';
  navTimer = setTimeout(()=>{
    mutateFn();
    render();
    const r2 = document.getElementById('view-root');
    r2.style.transition = 'none';
    r2.style.transform = 'translateX(22px)';
    r2.style.opacity = '0';
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        r2.style.transition = 'transform .34s cubic-bezier(.16,1,.3,1), opacity .28s cubic-bezier(.16,1,.3,1)';
        r2.style.transform = 'translateX(0)';
        r2.style.opacity = '1';
      });
    });
    if(afterFn) afterFn();
  }, 150);
}

/* ============================================================
   13. event delegation
   ============================================================ */
function attachDynamic(){ /* no-op, using delegation on document */ }

document.addEventListener('click', (e)=>{
  try{
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;
  switch(action){
    case 'tab':
      navigate(()=>{
        const tabId = el.dataset.tab;
        if(tabId === 'battle' || tabId === 'training' || tabId === 'casual' || tabId === 'online'){
          currentBasicMode = tabId;
          activeTab = 'basic';
          checkStellaCommand(tabId);
        } else if(tabId === 'variety' || tabId === 'story' || tabId === 'memory'){
          currentAdventureMode = tabId;
          activeTab = 'adventure';
          stellaCommandSequence = [];
        } else {
          if(tabId === 'library'){ sub.library='list'; }
          activeTab = tabId;
          stellaCommandSequence = [];
        }
      });
      break;
    case 'go-home':
      navigate(()=>{ activeTab = 'home'; });
      break;
    case 'view-news-list':
      // 先に「読み込み中」を描画してから、取得完了後に再描画する
      cachedNewsListHtml = '';
      navigate(()=>{ activeTab = 'news'; });
      viewNewsList()
        .then(html => {
          cachedNewsListHtml = html;
          if(activeTab === 'news') render();
        })
        .catch(err => {
          console.error('お知らせ一覧の取得に失敗:', err);
          cachedNewsListHtml = `
            <div class="hero" style="background:linear-gradient(150deg, var(--jade-light), var(--jade-deep) 75%);">
              <div class="hero-eyebrow">NEWS</div>
              <h2>お知らせ</h2>
            </div>
            <div class="card">
              <p style="text-align:center; color:var(--ink-soft); margin:0;">お知らせを読み込めませんでした</p>
            </div>`;
          if(activeTab === 'news') render();
        });
      break;
    case 'go-basic':
      navigate(()=>{ activeTab = 'basic'; currentBasicMode = 'battle'; });
      break;
    case 'go-adventure':
      navigate(()=>{ activeTab = 'adventure'; currentAdventureMode = 'variety'; });
      break;
    case 'battle-flip':
      state.settings.battle.flipMode = el.dataset.v; saveState(); render(); break;
    case 'battle-start': startBattle(); break;
    case 'training-start': startTraining(); break;
    case 'casual-pick': startCasual(el.dataset.id); break;
    case 'variety-pick': startVariety(el.dataset.presetId); break;
    case 'variety-custom': navigate(()=>{ sub.variety='custom'; }); break;
    case 'variety-back': navigate(()=>{ sub.variety='home'; }); break;
    case 'variety-toggle-rule':
      const ruleId = el.dataset.rule;
      state.variety.customRules[ruleId] = el.checked;
      saveState();
      render();
      break;
    case 'variety-start-custom': startVarietyCustom(); break;
    case 'cell': onCellClick(parseInt(el.dataset.r), parseInt(el.dataset.c)); break;
    case 'player-pass':
      if(game && !game.over && !game.thinking){
        game.passStreak++;
        game.animPlaced = null;
        game.animFlips = null;
        
        // ターン交代後のチェック
        const other = game.current === 1 ? 2 : 1;
        const otherMoves = validMoves(game.board, other);
        const selfMoves = validMoves(game.board, game.current);
        
        if(otherMoves.length > 0){
          // 相手が置ける → 相手ターンに
          game.current = other;
          game.passStreak = 0;
          render();
          startLiveTimer();
          if(game.current === 2) maybeTriggerAI(game);
        } else if(selfMoves.length > 0){
          // 相手が置けず、自分が置ける → 自分ターン継続（パス）
          render();
          startLiveTimer();
        } else {
          // どちらも置けない → ゲーム終了
          endGame(game);
          render();
          startLiveTimer();
        }
      }
      break;
    case 'give-up':
      // オンライン対局では投了できない（相手を置き去りにしないため）
      if(game && game.mode==='online') break;
      navigate(()=>{ if(game){ game=null; } sub[activeTab]='home'; });
      break;
    case 'see-result':
      if(game && game.mode==='online'){ navigate(()=>{ sub.online='room'; }); break; }
      navigate(()=>{ sub[activeTab]='result'; });
      break;
    case 'back-home':
      navigate(()=>{ 
        game=null; 
        if(activeTab==='basic' && currentBasicMode==='casual'){
          sub.casual='modeSelect';
        } else {
          sub[activeTab]='home';
        }
      });
      break;
    case 'play-again': {
      const mode=game.mode, opts=game.opts;
      navigate(()=>{ 
        game = makeGameSession(mode, opts);
        // モードに応じて sub を初期化
        if(mode === 'battle') sub.battle = 'play';
        else if(mode === 'training') sub.training = 'play';
        else if(mode === 'casual') sub.casual = 'play';
        else if(mode === 'variety') sub.variety = 'play';
      }, ()=>{
        startLiveTimer();
        if(game.current === 2) maybeTriggerAI(game);
      });
      break;
    }
    case 'lib-tab': navigate(()=>{ libTab=el.dataset.id; }); break;
    case 'watch-replay': openReplay(el.dataset.scope, parseInt(el.dataset.idx)); break;
    case 'replay-close':
      clearTimeout(replayTimer); navigate(()=>{ replayState=null; sub.library='list'; }); break;
    case 'replay-first': replayState.step=0; render(); break;
    case 'replay-last': replayState.step=replayState.entry.boardStates.length; render(); break;
    case 'replay-prev': replayState.step=Math.max(0,replayState.step-1); render(); break;
    case 'replay-next': replayState.step=Math.min(replayState.entry.boardStates.length,replayState.step+1); render(); break;
    case 'replay-play':
      replayState.playing = !replayState.playing;
      if(replayState.playing) replayTick(); else clearTimeout(replayTimer);
      render(); break;
    case 'set-graphics': state.settings.graphics=el.dataset.v; saveState(); render(); break;
    case 'set-boardstyle': state.settings.boardStyle=el.dataset.v; saveState(); render(); break;
    case 'set-theme': state.settings.theme=el.dataset.v; saveState(); render(); break;
    case 'set-defaultflip': state.settings.battle.flipMode=el.dataset.v; saveState(); render(); break;
    case 'set-furigana': state.settings.furiganaLevel=parseInt(el.dataset.v); saveState(); render(); break;
    case 'training-start-mode': state.training.startMode=el.dataset.v; saveState(); render(); break;
    case 'casual-start-mode': state.casual.startMode=el.dataset.v; saveState(); render(); break;
    case 'toggle-casual-hint': state.casual.showHints = !state.casual.showHints; saveState(); render(); break;
    case 'toggle-bgm': audioState.bgmEnabled = !audioState.bgmEnabled; render(); break;
    case 'toggle-se': audioState.seEnabled = !audioState.seEnabled; render(); break;
    case 'online-join-code': {
      const nameEl = document.getElementById('onlineName');
      const codeEl = document.getElementById('onlineCode');
      const nm = (nameEl && nameEl.value.trim()) || onlineDefaultName();
      onlineJoinByCode(codeEl ? codeEl.value : '', nm);
      break;
    }
    case 'online-random': {
      const nameEl2 = document.getElementById('onlineName');
      const nm2 = (nameEl2 && nameEl2.value.trim()) || onlineDefaultName();
      onlineRandomMatch(nm2);
      break;
    }
    case 'online-leave': onlineLeave(); break;
    case 'export-save': exportSave(el.dataset.scope); break;
    case 'import-save': importSave(el.dataset.scope); break;
    case 'reset-settings':
      state.settings = structuredClone(DEFAULT_STATE.settings);
      saveState(); toast('設定をデフォルトに戻しました'); render(); break;
    case 'delete-cache': showConfirmDeleteCache(); break;
    case 'confirm-delete-1': showConfirmDeleteCache2(); break;
    case 'confirm-delete-2':
      localStorage.removeItem('genseki_othello_save_v1');
      state = structuredClone(DEFAULT_STATE);
      closeSheet(); toast('キャッシュを削除しました'); render(); break;
    case 'close-sheet': closeSheet(); break;
    case 'confirm-sheet-choice':
      const sheetType = el.dataset.sheetType;
      let selectedValue = null;
      if(sheetType === 'training'){
        const chosen = document.querySelector('[data-training-start-choice]:checked');
        selectedValue = chosen ? chosen.value : 'black';
      } else if(sheetType === 'casual'){
        const chosen = document.querySelector('[data-casual-start-choice]:checked');
        selectedValue = chosen ? chosen.value : 'black';
      }
      closeSheet();
      if(selectedValue){
        const isBlack = selectedValue === 'black';
        if(sheetType === 'training'){
          const t = state.training;
          const depth = trainingDepthForRank(t.rankIndex, t.xNumber);
          doStartTraining(depth, isBlack);
        } else if(sheetType === 'casual' && pendingSheetData){
          const d = pendingSheetData.difficulty;
          doStartCasual(d, isBlack);
          pendingSheetData = null;
        }
        pendingSheetCallback = null;
      }
      break;
    case 'overlay-bg': if(e.target===el) closeSheet(); break;
  }
  }catch(err){
    console.error('Click handler error:', err);
  }
});
document.addEventListener('change', (e)=>{
  try{
    const el = e.target.closest('[data-action]');
    if(!el) return;
    if(el.dataset.action==='toggle-anim-flip'){ state.settings.animFlip=el.checked; saveState(); render(); }
    if(el.dataset.action==='toggle-anim-trans'){ state.settings.animTransition=el.checked; saveState(); render(); }
    if(el.dataset.action==='toggle-timer'){ state.settings.showTimer=el.checked; saveState(); render(); }
    if(el.dataset.action==='toggle-casual-hint'){ state.casual.showHints=el.checked; saveState(); render(); }
    if(el.dataset.action==='toggle-allow-pass'){ state.settings.allowPass=el.checked; saveState(); render(); }
    if(el.dataset.action==='replay-seek'){ replayState.step=parseInt(el.value); render(); }
  }catch(err){
    console.error('Change handler error:', err);
  }
});
document.addEventListener('input', (e)=>{
  try{
    if(e.target.id==='p1name'){ state.settings.battle.p1=e.target.value; }
    if(e.target.id==='p2name'){ state.settings.battle.p2=e.target.value; }
    if(e.target.id==='setP1'){ state.settings.battle.p1=e.target.value; saveState(); }
    if(e.target.id==='setP2'){ state.settings.battle.p2=e.target.value; saveState(); }
    if(e.target.id==='usernameInput'){ state.username=e.target.value; saveState(); }
  }catch(err){
    console.error('Input handler error:', err);
  }
});

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

/* ============================================================
   14. boot
   ============================================================ */
// ズーム・スクロール防止（対局中のみ）
document.addEventListener('wheel', (e)=>{ if(game && e.ctrlKey) e.preventDefault(); }, {passive:false});
document.addEventListener('touchmove', (e)=>{
  if(game && e.touches.length>1) e.preventDefault();
}, {passive:false});
document.addEventListener('gesturestart', (e)=>{ if(game) e.preventDefault(); }, {passive:false});
// ダブルタップズーム防止（対局中のみ）
let lastTouchEnd = 0;
document.addEventListener('touchend', (e)=>{
  if(!game) return;
  const now = Date.now();
  if(now - lastTouchEnd <= 300){ e.preventDefault(); }
  lastTouchEnd = now;
}, {passive:false});
applyTheme(state.settings.theme);
render();
preloadAudioFiles();
</script>
