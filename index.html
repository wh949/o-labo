}

/* ---------- パレット（盤面とは別の層に出す） ---------- */
function openReactionPalette(){
  reactionPaletteOpen = true;
  reactionInputOpen = false;
  drawReactionPalette();
  requestRender();
}
function closeReactionPalette(){
  reactionPaletteOpen = false;
  reactionInputOpen = false;
  const el = document.getElementById('reactPalette');
  if(el) el.remove();
}
function drawReactionPalette(){
  let el = document.getElementById('reactPalette');
  if(!el){
    el = document.createElement('div');
    el.id = 'reactPalette';
    el.className = 'react-palette';
    document.body.appendChild(el);
  }
  el.innerHTML = reactionInputOpen ? `
      <div class="rp-input">
        <input id="reactInput" type="text" maxlength="16" placeholder="絵文字を1つ" autocomplete="off" enterkeyhint="send">
        <button class="rp-send" data-action="react-send-custom">送る</button>
        <button class="rp-close" data-action="react-input-cancel" aria-label="やめる">×</button>
      </div>`
    : `<div class="rp-row">
        ${reactionList().map(e => `<button class="rp-emoji" data-action="react-send" data-e="${escapeHtml(e)}">${escapeHtml(e)}</button>`).join('')}
        <button class="rp-plus" data-action="react-plus" aria-label="好きな絵文字を送る">＋</button>
      </div>`;
  positionReactionPalette();
  if(reactionInputOpen){
    const inp = document.getElementById('reactInput');
    if(inp){
      inp.focus();
      inp.addEventListener('keydown', ev => { if(ev.key === 'Enter'){ ev.preventDefault(); sendReaction(inp.value.trim()); } });
    }
  }
}
// ボタンの真上に出す
function positionReactionPalette(){
  const el = document.getElementById('reactPalette');
  const btn = document.getElementById('reactBtn');
  if(!el) return;
  if(!btn){ closeReactionPalette(); return; }
  const r = btn.getBoundingClientRect();
  el.style.right = Math.max(8, window.innerWidth - r.right) + 'px';
  el.style.bottom = Math.max(8, window.innerHeight - r.top + 8) + 'px';
}
// パレットの外を押したら閉じる
document.addEventListener('pointerdown', ev => {
  if(!reactionPaletteOpen) return;
  if(ev.target.closest && (ev.target.closest('#reactPalette') || ev.target.closest('#reactBtn'))) return;
  closeReactionPalette();
  requestRender();
}, true);
window.addEventListener('resize', positionReactionPalette);

function onlineAttachRoom(id){
  onlineDetachRoomOnly();
  resetReactions();
  onlineRoomRef = fbDb.ref('rooms/'+id);
  onlineState.phase = 'waiting';
  // navigate() は少し遅れて実行されるため、ここで直接切り替える。
  // （遅れて動くと、先に始まった対局画面の指定を上書きしてしまう）
  sub.online = 'room';
  render();

  onlineRoomUnsub = onlineRoomRef.on('value', snap => {
    const room = snap.val();
    onRoomReactions(room);
    if(!room){
      if(onlineState.phase === 'playing'){
        onlineState.message = '相手が退出しました';
        onlineState.oppLeft = true;
        onlineState.phase = 'finished';
        sub.online = 'room';
        render();
      }
      return;
    }
    if(room.status === 'waiting'){
      onlineState.phase = 'waiting';
      sub.online = 'room';
      render();
      return;
    }
    if(room.status === 'abandoned'){
      if(onlineState.phase === 'playing'){
        onlineState.message = '相手の接続が切れました';
        onlineState.oppLeft = true;
        onlineState.phase = 'finished';
        sub.online = 'room';
        render();
      }
      return;
    }

    // 対局中
    const oppSide = (onlineState.myColor === 1) ? room.guest : room.host;
    const newOpp = (oppSide && oppSide.name) || '相手';
    const newOppUid = (oppSide && oppSide.uid) || '';
    if(newOppUid && newOppUid !== onlineState.oppUid){
      onlineState.oppUid = newOppUid;
      onlineState.oppIcon = '';
    }
    // 終局後（finished）に部屋の更新がもう一度届いても、対局を作り直さない
    const firstTime = onlineState.phase !== 'playing' && onlineState.phase !== 'finished';
    onlineState.oppName = newOpp;

    if(firstTime){
      onlineState.phase = 'playing';
      const isMatch = !!room.isMatch;
      onlineState.isMatch = isMatch;
      onlineState.timeUpReported = false;
      if(isMatch){
        game = makeGameSession('match', {
          playerStarts: onlineState.myColor === 1,
          myColor: onlineState.myColor,
          vsType: 'online',
          oppName: newOpp,
          timeLimitSec: room.timeLimitSec || 600,
          showHints: false,
          isTournament: !!room.isTournament
        });
        game.timeLeftBlack = room.timeLeftBlack ?? room.timeLimitSec ?? 600;
        game.timeLeftWhite = room.timeLeftWhite ?? room.timeLimitSec ?? 600;
        game.lastMoveAt = Date.now();
        sub.match = 'play';
        startMatchClock();
      } else {
        game = makeGameSession('online', {
          playerStarts: onlineState.myColor === 1,
          myColor: onlineState.myColor,
          showHints: true
        });
      }
      sub.online = 'play';
      onlineState.lastChangeAt = Date.now();
      onlineStopQueueHeartbeat();
      onlineStopRescan();
      onlineStartIdleWatch();
      // 相手のアイコンを読み込んでから演出を出す。
      // 先に出すと、初対戦のときだけ既定の絵になってしまう。
      if(onlineState.mode === 'random'){
        (async ()=>{
          const rid = onlineState.roomId;
          const [icon, titleIds] = await Promise.all([fetchOpponentIcon(newOppUid), fetchOpponentTitleIds(newOppUid)]);
          if(onlineState.oppUid !== newOppUid) return;   // 途中で相手が変わった
          onlineState.oppIcon = icon || '';
          onlineState.oppTitleIds = titleIds;
          await preloadIcon(icon, 1500);
          // アイコンの読み込み中に対局が終わった・別の部屋に移った場合は出さない。
          // 同じ部屋の演出は1回だけ
          if(onlineState.phase !== 'playing' || onlineState.roomId !== rid || onlineState.matchShownFor === rid) return;
          onlineState.matchShownFor = rid;
          showMatchFound(newOpp);
          render();
        })();
      } else if(newOppUid){
        fetchOpponentIcon(newOppUid).then(icon => {
          if(onlineState.oppUid === newOppUid){ onlineState.oppIcon = icon || ''; render(); }
        });
        fetchOpponentTitleIds(newOppUid).then(titleIds => {
          if(onlineState.oppUid === newOppUid) onlineState.oppTitleIds = titleIds;
        });
      }
    }
    // 手が進んだら、放置判定の起点を更新する
    const movedOn = (room.moveCount || 0) !== (game.moveCount || 0) || firstTime;
    if(movedOn) onlineState.lastChangeAt = Date.now();

    const prevMoves = game.moveCount || 0;
    const prevBoard = game.board;   // 差分（置いた・ひっくり返ったマス）を調べるために保持しておく
    game.board = strToBoard(room.board);
    game.current = room.turn || 1;
    game.passStreak = room.passStreak || 0;
    game.moveCount = room.moveCount || 0;
    game.over = (room.status === 'finished');
    if(game.mode === 'match'){
      // 相手が消費した時間も含めて、サーバー側の値に合わせる。
      // 新しく自分の手番が回ってきたら、その瞬間から経過時間を測り直す
      if(room.timeLeftBlack !== undefined) game.timeLeftBlack = room.timeLeftBlack;
      if(room.timeLeftWhite !== undefined) game.timeLeftWhite = room.timeLeftWhite;
      if(game.moveCount > prevMoves || firstTime) game.lastMoveAt = Date.now();
      renderMatchClock();
    }
    // 手が進んだら、その時点の盤面をリプレイ用に控える
    if(game.moveCount > prevMoves){
      game.boardStates = game.boardStates || [];
      game.boardStates.push(game.board.map(row => row.slice()));

      // 置いたマスと、ひっくり返ったマスを前回の盤面との差分から求め、
      // 自分・相手どちらの手でも、アニメーションと「置く音＋カタカタ」を鳴らす
      const lm = room.lastMove;
      if(lm && prevBoard && !firstTime){
        const flippedCells = [];
        for(let rr=0; rr<8; rr++) for(let cc=0; cc<8; cc++){
          if(rr===lm.row && cc===lm.col) continue;
          if(prevBoard[rr][cc] !== game.board[rr][cc]) flippedCells.push([rr,cc]);
        }
        game.animPlaced = { row: lm.row, col: lm.col };
        game.animFlips = flippedCells;
        playFlipSequence(flippedCells);
      } else {
        playSE(randomFlipSeName());   // 差分が分からない場合は、最低限1回だけ鳴らす
      }
    }

    // 手番が自分に回ってきて置けない場合、自動でパスする
    if(room.status === 'playing' && !game.over){
      setTimeout(onlineAutoPassIfNeeded, 300);
    }

    if(room.status === 'finished' && onlineState.phase !== 'finished'){
      onlineState.phase = 'finished';
      onlineStopIdleWatch();
      onlineFinish(room);
      // 競技モードは handleMatchEnd が sub.match/sub.ranker を設定するので、ここでは上書きしない
      if(!onlineState.isMatch) sub.online = 'room';
    }
    render();
  });

  onlineRoomRef.child('status').onDisconnect().set('abandoned');
}

// 相手が動かないまま3分たったら、放棄とみなして決着させる
// 待っているあいだ、受付が期限切れにならないよう更新し続ける
function onlineStartQueueHeartbeat(){
  onlineStopQueueHeartbeat();
  onlineQueueBeat = setInterval(()=>{
    if(!fbDb || onlineState.phase !== 'waiting' || onlineState.mode !== 'random' || !onlineState.roomId){
      onlineStopQueueHeartbeat();
      return;
    }
    // 通信が一瞬切れると受付が消えることがあるので、丸ごと書き直して復活させる
    fbDb.ref('waiting/'+onlineState.roomId).set({
      uid: fbUid, name: onlineState.myName || '', createdAt: Date.now(), isMatch: !!onlineState.isMatch
    }).catch(()=>{});
    requestRender();   // 経過時間の表示を更新する
  }, 10000);
}
function onlineStopQueueHeartbeat(){
  if(onlineQueueBeat){ clearInterval(onlineQueueBeat); onlineQueueBeat = null; }
}

// 待っているあいだ、受付一覧を監視して相手が現れた瞬間に動く。
// 定期的に探すのではなく通知を受け取るので、待ち時間がほぼ無くなる。
let onlineWaitingRef = null, onlineWaitingCb = null, onlineJoinBusy = false;

function onlineStartRescan(myName){
  onlineStopRescan();
  onlineWaitingRef = fbDb.ref('waiting');
  onlineWaitingCb = onlineWaitingRef.on('value', async snap => {
    if(onlineJoinBusy) return;
    if(onlineState.phase !== 'waiting' || onlineState.mode !== 'random') return;

    const list = snap.val() || {};
    const now = Date.now();
    const keys = Object.keys(list);
    onlineDebug.waitingCount = keys.length;
    onlineDebug.entries = keys.map(k => ({
      room: k,
      uid: (list[k] && list[k].uid || '').slice(0,8),
      name: list[k] && list[k].name || '',
      mine: !!(list[k] && list[k].uid === fbUid),
      age: list[k] && list[k].createdAt ? Math.round((now - list[k].createdAt)/1000) : -1
    }));
    const others = onlineDebug.entries.filter(e=>!e.mine).length;
    onlineLog('監視: 受付 ' + keys.length + '件 / 自分以外 ' + others + '件');
    render();

    for(const roomId of keys){
      const e = list[roomId];
      if(!e || e.uid === fbUid || roomId === onlineState.roomId) continue;
      if(!e.createdAt || now - e.createdAt > ONLINE_QUEUE_TTL) continue;

      // 両方が同時に相手へ入室しにいくと二重に成立してしまうため、
      // 識別子の大きいほうだけが動く、と決めておく
      if(!(String(fbUid) > String(e.uid))){
        onlineLog('相手を発見（' + (e.name||'?') + '）: 相手側が入室する番なので待つ');
        continue;
      }
      onlineLog('相手を発見（' + (e.name||'?') + '）: 入室します');

      onlineJoinBusy = true;
      try{
        onlineState.oppName = e.name || '相手';
        onlineState.phase = 'joining';
        render();

        if(await onlineClaimRoom(roomId, myName)){
          const myOld = onlineState.roomId;
          onlineStopRescan();
          onlineStopQueueHeartbeat();
          fbDb.ref('waiting/'+roomId).remove().catch(()=>{});
          if(myOld){
            fbDb.ref('waiting/'+myOld).remove().catch(()=>{});
            fbDb.ref('rooms/'+myOld).remove().catch(()=>{});
          }
          onlineState.myColor = 2;
          onlineState.roomId = roomId;
          onlineAttachRoom(roomId);
          return;
        }
        // 入れなかった場合も、相手の受付は消さずに待機へ戻る
        onlineState.oppName = '';
        onlineState.phase = 'waiting';
        render();
      }catch(err){
        console.warn('入室に失敗:', err);
        onlineState.oppName = '';
        onlineState.phase = 'waiting';
      }finally{
        onlineJoinBusy = false;
      }
      break;
    }
  });
}
function onlineStopRescan(){
  if(onlineWaitingRef && onlineWaitingCb){
    onlineWaitingRef.off('value', onlineWaitingCb);
  }
  onlineWaitingRef = null; onlineWaitingCb = null; onlineJoinBusy = false;
  if(onlineRescanTimer){ clearInterval(onlineRescanTimer); onlineRescanTimer = null; }
}

function onlineStartIdleWatch(){
  onlineStopIdleWatch();
  onlineIdleTimer = setInterval(onlineIdleTick, 5000);
}
function onlineStopIdleWatch(){
  if(onlineIdleTimer){ clearInterval(onlineIdleTimer); onlineIdleTimer = null; }
}
function onlineIdleRemaining(){
  if(!onlineState.lastChangeAt) return ONLINE_IDLE_LIMIT;
  return Math.max(0, ONLINE_IDLE_LIMIT - (Date.now() - onlineState.lastChangeAt));
}
async function onlineIdleTick(){
  if(onlineState.phase !== 'playing' || !game || game.over){ return; }
  // 自分の番なら、待たせているのは自分なので何もしない
  if(game.current === onlineState.myColor){ return; }
  if(onlineIdleRemaining() > 0){
    // 残り1分を切ったら画面に出す
    if(onlineIdleRemaining() <= 60000) requestRender();
    return;
  }
  // 相手が放棄した
  onlineStopIdleWatch();
  try{
    if(onlineRoomRef){
      await onlineRoomRef.update({
        status: 'finished',
        abandonedBy: onlineState.myColor === 1 ? 2 : 1,
        updatedAt: Date.now()
      });
    }
  }catch(err){ console.warn('放棄の記録に失敗:', err); }
}

// 部屋の監視だけを外す（相手探しの監視には触れない）
function onlineDetachRoomOnly(){
  if(onlineRoomRef && onlineRoomUnsub){
    onlineRoomRef.off('value', onlineRoomUnsub);
  }
  onlineRoomRef = null; onlineRoomUnsub = null;
}
// すべての監視を止める（対局終了・退出時に使う）
function onlineDetach(){
  onlineStopIdleWatch();
  onlineStopQueueHeartbeat();
  onlineStopRescan();
  onlineDetachRoomOnly();
}

async function onlineLeave(){
  try{
    if(onlineRoomRef){
      onlineRoomRef.child('status').onDisconnect().cancel();
    }
    // 待っている途中でやめた場合は、受付と部屋を片付ける
    if(fbDb && onlineState.roomId && onlineState.phase !== 'playing'){
      if(onlineState.mode === 'random'){
        await fbDb.ref('waiting/'+onlineState.roomId).remove().catch(()=>{});
      }
      // 自分がホストで、まだ相手が来ていない部屋なら消す
      try{
        const snap = await fbDb.ref('rooms/'+onlineState.roomId).once('value');
        const room = snap.val();
        if(room && room.status === 'waiting' && room.host && room.host.uid === fbUid && !room.guest){
          await fbDb.ref('rooms/'+onlineState.roomId).remove();
        }
      }catch(err){ console.warn('部屋の片付けに失敗:', err); }
    }
  }catch(err){ console.warn(err); }
  onlineDetach();
  onlineState.isTournament = false; onlineState.tournamentRound = undefined; onlineState.tournamentIdx = undefined;
  onlineState.phase='lobby'; onlineState.roomId=null; onlineState.myColor=null;
  onlineState.oppLeft=false; onlineState.message=''; onlineState.mode=null; onlineState.abandoned=false; onlineState.waitStartedAt=0;
  game = null;
  navigate(()=>{ sub.online='lobby'; });
}

// 自分の手を送信する
// 自分の手番なのに置ける場所が無いとき、自動でパスする。
// （オンラインには手動のパス手段が無いため、放っておくと進まなくなる）
let onlinePassBusy = false;
async function onlineAutoPassIfNeeded(){
  if(onlinePassBusy) return;
  if(!onlineRoomRef || !game || game.over) return;
  if(onlineState.phase !== 'playing') return;
  if(game.current !== onlineState.myColor) return;
  if(validMoves(game.board, onlineState.myColor).length > 0) return;

  const me = onlineState.myColor, opp = me===1?2:1;
  const oppCanMove = validMoves(game.board, opp).length > 0;
  onlinePassBusy = true;
  try{
    if(oppCanMove){
      onlineLog('置ける場所が無いのでパスします');
      await onlineRoomRef.update({
        turn: opp,
        passStreak: (game.passStreak||0) + 1,
        updatedAt: Date.now()
      });
    } else {
      // 双方とも置けない＝終局
      onlineLog('双方とも置けないため終局します');
      await onlineRoomRef.update({
        status: 'finished',
        updatedAt: Date.now()
      });
    }
  }catch(err){
    console.error(err);
    onlineDebug.lastError = 'パスに失敗: ' + ((err && err.code) || err);
  }finally{
    onlinePassBusy = false;
  }
}

async function onlineSendMove(r, c){
  if(!onlineRoomRef || !game) return;
  const flips = getFlips(game.board, r, c, onlineState.myColor);
  if(!flips.length) return;

  const nb = applyMove(game.board, r, c, onlineState.myColor, flips);
  const me = onlineState.myColor, opp = me===1?2:1;
  let nextTurn, passStreak = 0, finished = false;
  if(validMoves(nb, opp).length > 0){
    nextTurn = opp;
  } else if(validMoves(nb, me).length > 0){
    nextTurn = me; passStreak = (game.passStreak||0) + 1;
  } else {
    nextTurn = opp; finished = true;
  }

  const update = {
    board: boardToStr(nb),
    turn: nextTurn,
    passStreak,
    moveCount: (game.moveCount||0) + 1,
    lastMove: {row:r, col:c, by:me},
    status: finished ? 'finished' : 'playing',
    updatedAt: firebase.database.ServerValue.TIMESTAMP
  };

  if(game.mode === 'match'){
    // 自分が今の手番で消費した時間を差し引いて、サーバーに記録する
    const key = me === 1 ? 'timeLeftBlack' : 'timeLeftWhite';
    const elapsedSec = Math.floor((Date.now() - (game.lastMoveAt || game.startedAt)) / 1000);
    const newTime = Math.max(0, (game[key] || 0) - elapsedSec);
    update[key] = newTime;
    game[key] = newTime;
    game.lastMoveAt = Date.now();
    if(finished){
      // 競技ルール：終局時に空きマスがあれば、勝っている方の総取りになる
      const ms = countStonesMatch(nb);
      update.matchBlack = ms.black;
      update.matchWhite = ms.white;
    }
  }

  try{
    await onlineRoomRef.update(update);
  }catch(err){
    console.error(err);
    toast('通信に失敗しました');
  }
}

      status: 'finished',
      resignedBy: onlineState.myColor,
      updatedAt: Date.now()
    });
  }catch(err){

  }
}
// 以前の不具合で二重に記録された試合を取り除く
// （1分以内に、同じ相手・同じ結果・同じ石の数が続いたもの。あとから記録された側を捨てる）
function dedupeOnlineHistory(){
  const h = state.online && state.online.history;
  if(!Array.isArray(h) || h.length < 2) return 0;
  const out = [];
  let removed = 0;
  for(let i = h.length - 1; i >= 0; i--){
    const e = h[i], prev = out[out.length - 1];
    if(prev && prev.oppUid === e.oppUid && prev.oppName === e.oppName
       && prev.myScore === e.myScore && prev.aiScore === e.aiScore
       && prev.result === e.result && prev.myColor === e.myColor
       && Math.abs((e.timestamp || 0) - (prev.timestamp || 0)) < 60000){
      removed++;
      continue;
    }
    out.push(e);
  }
  out.reverse();
  state.online.history = out;
  return removed;
}
function onlineFinish(room){
  // 同じ試合を二重に記録しない（部屋の更新が続けて届いても、記録は1回だけ）
  const rid = onlineState.roomId;
  if(rid){
    if(onlineState.recordedRoomId === rid) return;
    onlineState.recordedRoomId = rid;
  }
  // 競技モードは、通常のオンライン対局とは別の記録方法（state.match.history）に流す
  if(game.mode === 'match'){ onlineMatchFinish(room); return; }
  const {black, white} = countStones(game.board);
  const mine = onlineState.myColor === 1 ? black : white;
  const theirs = onlineState.myColor === 1 ? white : black;
  let result;
  if(room && room.resignedBy){
    result = (room.resignedBy === onlineState.myColor) ? 'lose' : 'win';
    onlineState.message = (room.resignedBy === onlineState.myColor)
      ? '投了しました'
      : '相手が投了しました。あなたの勝ちです';
  } else if(room && room.abandonedBy){
    // 放置した側の負けにする
    result = (room.abandonedBy === onlineState.myColor) ? 'lose' : 'win';
    onlineState.message = (room.abandonedBy === onlineState.myColor)
      ? '3分動きがなかったため、対局を放棄した扱いになりました'
      : '相手が3分動かなかったため、あなたの勝ちです';
    onlineState.abandoned = true;
  } else {
    result = mine > theirs ? 'win' : (mine < theirs ? 'lose' : 'draw');
  }
  state.totalGames = (state.totalGames||0) + 1;
  if(result === 'win'){
    state.totalWins = (state.totalWins||0) + 1;
    state.playerRank = Math.min(999, state.playerRank + 1);
  }
  state.online.history = state.online.history || [];
  state.online.history.unshift({
    timestamp: Date.now(),
    myScore: mine, aiScore: theirs, result,
    oppName: onlineState.oppName || '相手',
    oppUid: onlineState.oppUid || '',
    myColor: onlineState.myColor,
    matchType: onlineState.mode || 'random',          // random / code / invite
    abandoned: !!(room && room.abandonedBy),
    resigned: !!(room && room.resignedBy),
    roomId: rid || '',
    moves: game.moveCount || 0,
    durationSec: Math.max(0, Math.floor((Date.now() - (game.startedAt || Date.now())) / 1000)),
    boardStates: Array.isArray(game.boardStates) ? game.boardStates.slice() : []
  });
  // 容量の上限にあわせて古いものから削る（ほかのモードと同じ扱い）
  trimHistories(HISTORY_LIMIT, REPLAY_LIMIT);
  saveState();
  game.lastResult = {result, myScore:mine, aiScore:theirs};
}
// 競技モード（オンライン）の終局処理。公式ルールの「空きマス総取り」「2石差勝ち」を適用し、
// 通常のオンライン対局とは別に state.match.history に記録する
function onlineMatchFinish(room){
  let black, white;
  if(room && room.matchBlack !== undefined && room.matchWhite !== undefined){
    black = room.matchBlack; white = room.matchWhite;
  } else {
    ({black, white} = countStonesMatch(game.board));
  }
  let endReason = 'normal', loserColor = null;
  if(room && room.resignedBy){ endReason = 'resign'; loserColor = room.resignedBy; }
  else if(room && room.matchTimeUpBy){ endReason = 'timeup'; loserColor = room.matchTimeUpBy; }
  else if(room && room.abandonedBy){ endReason = 'resign'; loserColor = room.abandonedBy; }
  if(loserColor){
    const sc = matchForcedScore(black, white, loserColor);
    black = sc.black; white = sc.white;
  }
  game.matchEndReason = endReason;
  game.matchLoser = loserColor;
  if(onlineState.isTournament){
    tournamentRecordResult(black, white, room);   // 必要な値は呼び出しの時点で読み取られる
    onlineState.isTournament = false; onlineState.tournamentRound = undefined; onlineState.tournamentIdx = undefined;
  }
  const entry = {
    timestamp: Date.now(),
    moves: game.moveCount || 0,
    durationSec: Math.max(0, Math.floor((Date.now() - (game.startedAt || Date.now())) / 1000)),
    boardStates: Array.isArray(game.boardStates) ? game.boardStates.slice() : []
  };
  handleMatchEnd(game, entry, black, white);
}
// 大会の対局が終わったら、トーナメント表に結果を書き込み、勝者を次のラウンドへ進める
async function tournamentRecordResult(black, white, room){
  const t = tournamentData;
  if(!t || !fbDb || onlineState.tournamentRound === undefined) return;
  const roundIdx = onlineState.tournamentRound, idx = onlineState.tournamentIdx;
  const myColor = game.opts.myColor;
  const myWon = myColor === 1 ? black > white : white > black;
  const hostUid = room && room.host && room.host.uid;
  const guestUid = room && room.guest && room.guest.uid;
  const oppUid = hostUid === fbUid ? guestUid : hostUid;
  const winnerUid = myWon ? fbUid : oppUid;
  try{
    // 最新の表を読み直し、勝者を書き込む（不戦勝の枠があれば続けて勝ち上がらせる）。まとめて1回で書くので、途中で止まらない
    const bSnap = await fbDb.ref('tournaments/current/bracket').once('value');
    const nb = normalizeBracket(bSnap.val());
    if(nb && nb.rounds[roundIdx] && nb.rounds[roundIdx][idx] && !nb.rounds[roundIdx][idx].winner){
      const changes = [];
      bracketAdvance(nb.rounds, roundIdx, idx, winnerUid, changes);
      const upd = {};
      changes.forEach(([r,i,k,v]) => { upd[`rounds/${r}/${i}/${k}`] = v; });
      upd[`rounds/${roundIdx}/${idx}/black`] = black;
      upd[`rounds/${roundIdx}/${idx}/white`] = white;
      upd[`rounds/${roundIdx}/${idx}/playedAt`] = Date.now();
      await fbDb.ref('tournaments/current/bracket').update(upd);
      t.bracket = nb;
    } else if(nb){ t.bracket = nb; }
    // 大会の対局は、モデレーターが管理者ページから見られるよう、棋譜まで含めて公開データとして残す。
    // どちらのプレイヤーが書き込んでも同じ内容になるので、二重に書いても実害はない
    await fbDb.ref(`tournaments/current/games/${roundIdx}_${idx}`).set({
      blackUid: myColor === 1 ? fbUid : oppUid,
      whiteUid: myColor === 1 ? oppUid : fbUid,
      blackName: tournamentNameOf(t, myColor === 1 ? fbUid : oppUid, false),
      whiteName: tournamentNameOf(t, myColor === 1 ? oppUid : fbUid, false),
      black, white, winner: winnerUid,
      endReason: game.matchEndReason || 'normal',
      moves: game.moveCount || 0,
      boardStates: Array.isArray(game.boardStates) ? game.boardStates.map(b => boardToStr(b)) : [],
      playedAt: Date.now()
    });
  }catch(err){ console.warn('トーナメント結果の記録に失敗:', err); }
}

/* ============================================================
   8. shared game session + board rendering
   ============================================================ */
function generateLuckyUnluckyMap(){
  const map = Array(8).fill(null).map(()=>Array(8).fill(0));
  const count = Math.floor(Math.random() * 5) + 4;
  for(let i = 0; i < count; i++){
    const r = Math.floor(Math.random() * 8);
    const c = Math.floor(Math.random() * 8);
    if(map[r][c] === 0){
      map[r][c] = Math.random() < 0.5 ? 1 : -1;
    }
  }
  return map;
}

function generateWarpMap(){
  const warpPairs = [
    {from:[0,0], to:[7,7]},
    {from:[0,7], to:[7,0]},
    {from:[0,3], to:[7,4]},
    {from:[0,4], to:[7,3]},
  ];
  const map = {};
  warpPairs.forEach(p=>{
    const key1 = `${p.from[0]},${p.from[1]}`;
    const key2 = `${p.to[0]},${p.to[1]}`;
    map[key1] = {r:p.to[0], c:p.to[1]};
    map[key2] = {r:p.from[0], c:p.from[1]};
  });
  return map;
}

function makeGameSession(mode, opts){
  const playerStarts = opts.playerStarts !== undefined ? opts.playerStarts : true;
  const session = {
    mode, opts,
    board:newBoard(),
    current: playerStarts ? 1 : 2, // 1 black (player), 2 white (AI)
    startedAt: Date.now(),
    moveCount:0,
    boardStates:[], // snapshot after each ply (for replay)
    passStreak:0,
    pendingFlips:null, // {row,col,player,flips:[[r,c]],done:[]}
    over:false,
    lastResult:null,
    thinking:false,
    animPlaced:null,
    animFlips:null,
    aiStartTime:null,
    aiTimeoutPassed:false,
    statusNote:null, // 「AIがパスしました」などの一時的なお知らせ（次の着手で消える）
  };
  if(mode === 'match'){
    const t = opts.timeLimitSec || 600;
    session.timeLeftBlack = t;
    session.timeLeftWhite = t;
    session.matchEndReason = null;
    session.matchLoser = null;
  }
  
  // バラエティモード用フィールド
  if(mode === 'variety'){
    session.varietyState = {
      rules: opts.varietyRules || {},
      eventTriggered: false,
      eventMessage: '',
      luckyUnluckyMap: opts.luckyUnluckyMap || generateLuckyUnluckyMap(),
      warpMap: opts.warpMap || generateWarpMap(),
      eventQueue: [],
    };
  }
  
  return session;
}
function turnColorMeta(g){
  if(g.mode==='battle'){
    return g.current===1
      ? {name:state.settings.battle.p1, color:'black'}
      : {name:state.settings.battle.p2, color:'white'};
  }
  if(g.mode==='online'){
    const mine = g.current === onlineState.myColor;
    return {
      name: mine ? (onlineState.myName || 'あなた') : (onlineState.oppName || '相手'),
      color: g.current===1 ? 'black' : 'white'
    };
  }
  if(g.mode==='match' && g.opts.vsType==='offline'){
    return g.current===1 ? {name:'黒番', color:'black'} : {name:'白番', color:'white'};
  }
  return g.current===1 ? {name:'あなた', color:'black'} : {name:'AI', color:'white'};
}
// Stella スキンを使う場面か
//  ・解禁のための挑戦中は必ず使う
//  ・解禁後は、ゆるモードでスキンに Stella を選んでいるとき
function useStellaSkin(){
  if(isFlipGame()) return false;
  if(stellaChallengeActive && game && game.mode==='casual') return true;
  return !!(game && game.mode==='casual'
            && state.settings.stellaUnlocked
            && state.settings.casualSkin === 'stella');
}
function boardStyleClass(){ 
  return (state.settings.boardStyle==='illust' ? 'illust' : '') + (useStellaSkin() ? ' stella' : '')
       + (currentEventSkin() ? ' event' : '');
}

function renderBoardScreen(){
  const g = game;
  const {black,white} = countStones(g.board);
  const meta = turnColorMeta(g);
  // 表示は「左が黒・右が白」で固定なので、名前も色にあわせて割り当てる
  let leftName, rightName;
  if(g.mode==='battle'){
    leftName = state.settings.battle.p1;
    rightName = state.settings.battle.p2;
  } else if(g.mode==='online'){
    const meName = onlineState.myName || 'あなた';
    const oppName = onlineState.oppName || '相手';
    // 自分が黒（先手）なら左が自分、白（後手）なら右が自分
    leftName  = onlineState.myColor === 1 ? meName : oppName;
    rightName = onlineState.myColor === 1 ? oppName : meName;
  } else {
    leftName = 'あなた';
    rightName = (g.mode==='training' ? 'AI（特訓）' : 'AI');
  }
  const cells = [];
  const animateOn = state.settings.animFlip;
  const placed = g.animPlaced;
  const flipsAnim = g.animFlips || [];
  const myTurnNow = g.mode==='battle' ? true
                  : (g.mode==='online' ? g.current===onlineState.myColor : g.current===1);
  const actualMoves = (!g.over && !g.pendingFlips && !g.thinking && myTurnNow) ? validMoves(g.board,g.current) : [];
  let showHints;
  if(g.mode==='battle') showHints = g.current===1 ? g.opts.p1ShowHints : g.opts.p2ShowHints;
  else if(g.mode==='training') showHints = false;
  else if(g.mode==='online') showHints = true;
  else showHints = !!g.opts.showHints;
  const hintMoves = showHints ? actualMoves : [];
  const moveMap = {}; hintMoves.forEach(m=>moveMap[m.row+'_'+m.col]=true);
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const v=g.board[r][c];
    let cls='cell';
    let inner='';
    if(v===0 && moveMap[r+'_'+c]) cls+=' hint';
    // 手動フリップでひっくり返せるマスの点線マークは廃止（1人目・2人目で
    // 見え方に差が出ないよう、ヒント表示自体を無くした）
    if(v!==0){
      const isStella = useStellaSkin();
      let stoneCls='stone '+(v===1?'black':'white');
      let stoneStyle='';
      if(animateOn && placed && placed.row===r && placed.col===c) stoneCls+=' dropping';
      if(animateOn){
        const idx = flipsAnim.findIndex(([fr,fc])=>fr===r&&fc===c);
        if(idx!==-1){
          stoneCls += ' flipping';
          // 反転前の色（Stella は星形なので色のクロスフェードは対象外）
          if(!isStella) stoneCls += ' flip-from-' + (v===1 ? 'white' : 'black');
          stoneStyle = ` style="--flip-delay:${idx*75}ms"`;
        }
      }
      // Stella スキン用の星型石
      if(isStella){
        const starColor = v===1 ? '#FFD34D' : '#FFFFFF';
        const glow = v===1 ? '#FFF0B8' : '#DFF1FF';
        inner = `<div class="${stoneCls}"${stoneStyle}><svg viewBox="0 0 100 100" style="width:100%; height:100%;">
          <defs><radialGradient id="sg${r}${c}" cx="38%" cy="30%" r="72%">
            <stop offset="0%" stop-color="${glow}"/><stop offset="100%" stop-color="${starColor}"/>
          </radialGradient></defs>
          <path d="M47.5,16.5 Q50.0,10.0 52.5,16.5 L58.8,32.8 Q60.6,37.4 65.6,37.7 L83.0,38.6 Q89.9,39.0 84.5,43.4 L71.0,54.4 Q67.1,57.6 68.4,62.4 L72.9,79.2 Q74.7,86.0 68.8,82.2 L54.2,72.7 Q50.0,70.0 45.8,72.7 L31.2,82.2 Q25.3,86.0 27.1,79.2 L31.6,62.4 Q32.9,57.6 29.0,54.4 L15.5,43.4 Q10.1,39.0 17.0,38.6 L34.4,37.7 Q39.4,37.4 41.2,32.8 Z" fill="url(#sg${r}${c})"/>
        </svg></div>`;
      } else {
        inner = `<div class="${stoneCls}"${stoneStyle}></div>`;
      }
    }
    cells.push(`<div class="${cls}" data-action="cell" data-r="${r}" data-c="${c}">${inner}</div>`);
  }
  g.animPlaced=null; g.animFlips=null;
  const timer = state.settings.showTimer ? `<span class="timer" id="liveTimer">00:00</span>` : '';
  let statusNote='';
  if(g.over){
    statusNote = `<div class="pass-note">対局が終了しました</div>`;
  } else if(g.thinking){
    statusNote = `<div class="pass-note">AIが考えています…</div>`;
  } else if(g.pendingFlips){
    statusNote = `<div class="pass-note">ひっくり返す石をタップしてください（残り${g.pendingFlips.flips.length-g.pendingFlips.done.length}個）</div>`;
  } else if(g.mode==='online' && g.current !== onlineState.myColor){
    const left = Math.ceil(onlineIdleRemaining()/1000);
    const warn = (left <= 60) ? `<br><span style="font-size:11px;">あと${left}秒動きがないと、相手の放棄になります</span>` : '';
    const oppStuck = validMoves(g.board, g.current).length === 0;
    statusNote = oppStuck
      ? `<div class="pass-note">${escapeHtml(onlineState.oppName||'相手')}は置ける場所がないためパスします…</div>`
      : `<div class="pass-note">${escapeHtml(onlineState.oppName||'相手')}の番です…${warn}</div>`;
  } else if(myTurnNow && actualMoves.length===0 && !g.over){
    statusNote = `<div class="pass-note">置ける場所がないため、パスします</div>`;
  } else if(g.statusNote){
    // AI がパスしたときなど、直前の出来事を伝えるメッセージ（次の手が打たれると自動で消える）
    statusNote = g.statusNote;
  }
  if(g.mode==='online' && !g.over && g.current === onlineState.myColor
     && validMoves(g.board, g.current).length === 0){
    statusNote = `<div class="pass-note">置ける場所がないため、パスします…</div>`;
  }
  
  // バラエティモードのイベント表示
  let varietyEventMarkup = '';
  if(g.mode === 'variety' && g.varietyState && g.varietyState.eventMessage){
    varietyEventMarkup = `<div style="background:var(--urushi-light); color:var(--urushi); padding:10px; border-radius:8px; margin-bottom:12px; text-align:center; font-weight:700; font-size:14px;">${g.varietyState.eventMessage}</div>`;
    // イベント表示を一度だけ表示させる（次のレンダリングで消す）
    setTimeout(()=>{ if(g.varietyState) g.varietyState.eventMessage = ''; }, 2000);
  }
  
  // パスボタンの表示判定
  const showPassBtn = state.settings.allowPass && !g.over && !g.thinking && !g.pendingFlips && 
                      (g.mode==='battle' || (g.mode==='match' && g.opts.vsType==='offline') || g.current===1)
                      && !(g.opts && (g.opts.isFlip || g.opts.isFlipGate)) && g.mode!=='online';
  
  // 黒白どちらがどれだけ「押している」かを、一目でわかるバーで示す（現在置かれている石の比率）
  const totalStones = black + white;
  const blackPct = totalStones > 0 ? Math.round(black / totalStones * 100) : 50;
  const turnIsBlack = g.current === 1;
  return `
    <div class="board-wrap">
      <div class="turn-banner ${!g.over ? 'turn-'+(turnIsBlack?'black':'white') : ''}">
        <div class="who"><span class="dot ${!g.over?'turn-pulse':''}" style="background:${meta.color==='black'?'#111':'#fff'};"></span>${g.over? '対局終了':escapeHtml(meta.name)+'さんの番です'}</div>
        ${timer}
      </div>
      <div class="stone-bar" aria-hidden="true">
        <div class="stone-bar-black" style="width:${blackPct}%"></div>
        <div class="stone-bar-white" style="width:${100-blackPct}%"></div>
      </div>
      <div class="score-strip">
        <div class="score-chip ${black>=white?'leading':''} ${!g.over&&turnIsBlack?'is-turn':''} ${g.mode==='online'&&onlineState.myColor===1?'is-me':''}"><span class="sc-stone" style="background:#111;"></span><span class="sc-name">${escapeHtml(leftName)}</span><span class="sc-num">${black}</span>${g.mode==='online'?reactionBubbleMarkup(1):''}</div>
        <div class="score-chip ${white>black?'leading':''} ${!g.over&&!turnIsBlack?'is-turn':''} ${g.mode==='online'&&onlineState.myColor===2?'is-me':''}"><span class="sc-stone" style="background:#eee; box-shadow:inset 0 0 0 1px #ccc;"></span><span class="sc-name">${escapeHtml(rightName)}</span><span class="sc-num">${white}</span>${g.mode==='online'?reactionBubbleMarkup(2):''}</div>
      </div>
      ${g.mode==='match' ? `
      <div class="match-clock-row">
        <span class="match-clock ${!g.over&&turnIsBlack?'is-turn':''}" id="matchClockBlack">${matchClockText(g.timeLeftBlack)}</span>
        <span class="match-clock-label">持ち時間</span>
        <span class="match-clock ${!g.over&&!turnIsBlack?'is-turn':''}" id="matchClockWhite">${matchClockText(g.timeLeftWhite)}</span>
      </div>` : ''}
      <div class="board ${boardStyleClass()}" id="boardEl"${eventBoardStyle()}>${cells.join('')}</div>
      ${varietyEventMarkup}
      ${stellaChallengeActive ? '<div class="stella-banner">この対局に勝利すると Stella が解禁！</div>' : ''}
      ${statusNote}
    </div>
    ${showPassBtn?`<div style="margin-top:10px;"><button class="btn btn-soft" data-action="player-pass">このターンをパスする</button></div>`:''}
    ${reactionButtonMarkup()}
    <div class="btn-row" style="margin-top:14px;">
      ${g.mode==='online'
        ? (g.over ? '' : `<button class="btn btn-ghost" data-action="online-resign">${ruby('投了','とうりょう',1)}する</button>`)
        : g.mode==='match'
          ? (g.over ? '' : `<button class="btn btn-ghost" data-action="give-up">${ruby('投了','とうりょう',1)}する</button>`)
          : ((g.opts && (g.opts.isFlip || g.opts.isFlipGate)) ? '' : `<button class="btn btn-ghost" data-action="give-up">${ruby('投了','とうりょう',1)}してもどる</button>`)}
      ${g.over?'<button class="btn btn-primary" data-action="see-result">結果を見る</button>':''}
    </div>
  `;
}

let timerHandle=null;
function startLiveTimer(){
  stopLiveTimer();
  timerHandle=setInterval(()=>{
    const el=document.getElementById('liveTimer');
    if(!el || !game){ return; }
    const sec = Math.floor((Date.now()-game.startedAt)/1000);
    el.textContent = String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
  },1000);
}
function stopLiveTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } }

/* ============================================================
   競技モード：持ち時間（対局時計）
   公式ルール 15 条・17 条にならい、時間切れ・投了は「勝者の2石差勝ち」で確定する
   ============================================================ */
let matchClockHandle = null;
function startMatchClock(){
  stopMatchClock();
  matchClockHandle = setInterval(()=>{
    const g = game;
    if(!g || g.over || g.mode !== 'match' || g.thinking || g.pendingFlips) return;
    const key = g.current === 1 ? 'timeLeftBlack' : 'timeLeftWhite';
    g[key] = Math.max(0, (g[key]||0) - 1);
    renderMatchClock();
    if(g[key] <= 0){
      if(g.opts.vsType === 'online'){
        // 自分の手番が時間切れになったときだけ、自分からサーバーへ報告する。
        // 相手の手番が時間切れの場合は、相手からの報告を待つ
        if(g.current === onlineState.myColor) onlineMatchTimeUp();
      } else {
        matchTimeUp(g, g.current);
      }
      return;
    }
  }, 1000);
}
// オンライン競技対局で、自分の持ち時間が切れたことをサーバーに報告する
async function onlineMatchTimeUp(){
  if(!onlineRoomRef || onlineState.timeUpReported) return;
  onlineState.timeUpReported = true;
  try{
    await onlineRoomRef.update({
      status: 'finished',
      matchTimeUpBy: onlineState.myColor,
      updatedAt: firebase.database.ServerValue.TIMESTAMP
    });
  }catch(err){ console.warn('時間切れの報告に失敗:', err); }
}
function stopMatchClock(){ if(matchClockHandle){ clearInterval(matchClockHandle); matchClockHandle=null; } }
function matchClockText(s){
  return String(Math.floor(Math.max(0,s||0)/60)).padStart(2,'0')+':'+String(Math.max(0,s||0)%60).padStart(2,'0');
}
function renderMatchClock(){
  const g = game;
  if(!g || g.mode !== 'match') return;
  const elB = document.getElementById('matchClockBlack');
  const elW = document.getElementById('matchClockWhite');
  if(elB) elB.textContent = matchClockText(g.timeLeftBlack);
  if(elW) elW.textContent = matchClockText(g.timeLeftWhite);
}
// 時間切れ・投了のとき、「勝者の2石差勝ち」として記録する石数を求める（公式ルール15条①・17条）。
// 現在の石差が既に2以上あればそのまま。2未満（僅差・逆転していた場合を含む）なら、
// 負けた側の石数は変えず、勝った側だけを「負けた側＋2」まで引き上げる
function matchForcedScore(black, white, loserColor){
  let finalBlack = black, finalWhite = white;
  if(loserColor === 1){ if(white - black < 2) finalWhite = black + 2; }
  else { if(black - white < 2) finalBlack = white + 2; }
  return { black: finalBlack, white: finalWhite };
}
// 時間切れ：負けた側の相手を「2石差勝ち」として確定する
function matchTimeUp(g, loserColor){
  if(!g || g.over) return;
  const {black, white} = countStones(g.board);
  g.matchEndReason = 'timeup';
  g.matchLoser = loserColor;
  endGame(g, matchForcedScore(black, white, loserColor));
  render();
}
// 投了：同様に「勝者の2石差勝ち」として確定する（公式ルール17条）
function matchResign(g, resignerColor){
  if(!g || g.over) return;
  const {black, white} = countStones(g.board);
  g.matchEndReason = 'resign';
  g.matchLoser = resignerColor;
  endGame(g, matchForcedScore(black, white, resignerColor));
  render();
}

/* ---- interaction: placing stones ---- */
function onCellClick(r,c){
  const g=game;
  if(!g || g.over || g.thinking) return;
  if(g.pendingFlips){
    const idx = g.pendingFlips.flips.findIndex(([fr,fc])=>fr===r&&fc===c);
    const already = g.pendingFlips.done.some(([dr,dc])=>dr===r&&dc===c);
    if(idx===-1 || already) return;
    g.pendingFlips.done.push([r,c]);
    g.board[r][c]=g.pendingFlips.player;
    g.animFlips=[[r,c]]; g.animPlaced=null;
    playSE(randomFlipSeName());
    if(g.pendingFlips.done.length===g.pendingFlips.flips.length){
      const flipCount = g.pendingFlips.flips.length;
      g.pendingFlips=null;
      finishPly(g, flipCount);
    } else {
      render(); startLiveTimer();
    }
    return;
  }
  if(g.mode==='battle'){
    tryHumanMove(g,r,c);
  } else if(g.mode==='online'){
    // オンラインは自分の色の手番だけ操作できる
    if(g.current !== onlineState.myColor) return;
    tryHumanMove(g,r,c);
  } else {
    if(g.current!==1) return; // only human's (black) turn is clickable
    tryHumanMove(g,r,c);
  }
}
function tryHumanMove(g,r,c){
  // オンラインは自分の手番のときだけ、サーバーに送る
  if(g.mode==='online'){
    if(g.over || g.current !== onlineState.myColor) return;
    if(!getFlips(g.board,r,c,g.current).length) return;
    onlineSendMove(r,c);
    return;
  }
  let flips = getFlips(g.board,r,c,g.current);
  if(!flips.length) return;
  g.statusNote = null;   // 新しい手が打たれたので、直前の「AIがパスしました」等のお知らせは消す
  
  // バラエティモード: ワープルール適用
  let finalRow = r, finalCol = c;
  let eventMsg = '';
  if(g.mode==='variety' && g.varietyState && g.varietyState.rules.warp){
    const key = `${r},${c}`;
    if(g.varietyState.warpMap[key]){
      const warp = g.varietyState.warpMap[key];
      finalRow = warp.r;
      finalCol = warp.c;
      eventMsg = '✨ワープした！';
      // ワープ後の位置でフリップ位置を再計算
      flips = getFlips(g.board, finalRow, finalCol, g.current);
      if(!flips.length) {
        // ワープ後の位置が置けない場合は元の位置に戻す
        finalRow = r;
        finalCol = c;
        flips = getFlips(g.board, r, c, g.current);
        eventMsg = '✨ワープしたが戻ってきた...';
      }
    }
  }
  
  // バラエティモード: ラッキー/アンラッキールール適用
  let luckyEffect = 0;
  if(g.mode==='variety' && g.varietyState && g.varietyState.rules.lucky_unlucky){
    const effect = g.varietyState.luckyUnluckyMap[finalRow]?.[finalCol];
    if(effect === 1){
      eventMsg = '🍀ラッキー！';
      luckyEffect = 1;
    } else if(effect === -1){
      eventMsg = '💔アンラッキー...';
      luckyEffect = -1;
    }
  }
  
  if(eventMsg && g.varietyState) g.varietyState.eventMessage = eventMsg;
  
  const manual = g.mode==='battle' && g.opts.flipMode==='manual';
  g.board[finalRow][finalCol]=g.current;
  g.moveCount++;
  g.animPlaced={row:finalRow,col:finalCol};
  
  // ラッキーボーナス: 追加で1マス多くフリップ
  if(luckyEffect === 1 && flips.length > 0){
    // ラッキーマスでは、フリップ数が増える（追加ボーナス）
    g.luckyBonus = true;
  } else if(luckyEffect === -1 && flips.length > 0){
    // アンラッキーでは、フリップが減る
    const reducedFlips = flips.slice(0, Math.max(1, Math.floor(flips.length / 2)));
    flips = reducedFlips.length > 0 ? reducedFlips : flips;
  }
  
  if(manual && flips.length){
    playSE(randomFlipSeName());   // 石を置いた音（この後は1マスずつタップするたびに鳴る）
    g.pendingFlips={row:finalRow,col:finalCol,player:g.current,flips,done:[]};
    g.animFlips=null;
    render(); startLiveTimer();
    return;
  }
  g.animFlips=flips;
  flips.forEach(([fr,fc])=>{ g.board[fr][fc]=g.current; });
  playFlipSequence(flips);
  finishPly(g, flips.length);
}
function finishPly(g, flipCount){
  g.boardStates.push(g.board.map(row=>row.slice()));
  
  // バラエティモード: ランダムイベント処理
  if(g.mode==='variety' && g.varietyState && g.varietyState.rules.random){
    if(Math.random() < 0.3){  // 30%の確率でイベント発生
      const randomEvents = [
        {msg:'🔄盤面が反転した！', effect:()=>{
          // ランダムに3-5個の石を反転
          const count = Math.floor(Math.random() * 3) + 3;
          for(let i=0; i<count; i++){
            const r = Math.floor(Math.random() * 8);
            const c = Math.floor(Math.random() * 8);
            if(g.board[r][c]!==0){
              g.board[r][c] = g.board[r][c]===1?2:1;
            }
          }
        }},
        {msg:'⭐ボーナスターン！', effect:()=>{
          // 追加ターン（AI側がパスする）
          const otherMoves = validMoves(g.board, g.current===1?2:1);
          if(otherMoves.length === 0){
            g.passStreak++;
          }
        }},
        {msg:'🎲運試し！', effect:()=>{
          // 特に何もしない（メッセージだけ）
        }},
      ];
      const event = randomEvents[Math.floor(Math.random() * randomEvents.length)];
      g.varietyState.eventMessage = event.msg;
      event.effect();
    }
  }
  
  const other = g.current===1?2:1;
  const otherMoves = validMoves(g.board,other);
  const selfMoves = validMoves(g.board,g.current);
  if(otherMoves.length>0){
    g.current=other; g.passStreak=0;
  } else if(selfMoves.length>0){
    g.passStreak++;
    // other has no moves, stays same player's turn (pass for opponent)
  } else {
    endGame(g);
    render();
    return;
  }
  render(); startLiveTimer();
  // 人間の手のフリップアニメーションが実際に画面へ描画され、最後まで
  // 再生しきる時間を確保してから、AIの手番に進む（間を置かずに続けて
  // render() すると、回転の途中で画面が上書きされ、アニメーションが
  // 一気に終わったように見えてしまうため）
  const delay = state.settings.animFlip ? flipAnimTotalMs(flipCount||0) : 30;
  setTimeout(() => maybeTriggerAI(g), delay);
}
function maybeTriggerAI(g){
  try{
    if(g.over) return;
    const isAiTurn = ((g.mode==='training'||g.mode==='casual'||g.mode==='variety') && g.current===2)
      || (g.mode==='match' && g.opts && g.opts.vsType==='ai' && g.current===2);
    if(!isAiTurn) return;
    const moves = validMoves(g.board,2);
    if(moves.length===0){
      // AI passes - check if game should end
      const humanMoves = validMoves(g.board,1);
      if(humanMoves.length===0){ 
        endGame(g); 
        sub[resultSubKey(g)] = 'result';
        render(); 
        return; 
      }
      // Pass to human and show pass message
      g.current=1;
      g.passStreak++;
      g.statusNote = `<div class="pass-note">AIがパスしました</div>`;
      
      // 連続パス（両者がパス）で即終了
      if(g.passStreak >= 2){ 
        endGame(g); 
        sub[resultSubKey(g)] = 'result';
        render(); 
        return; 
      }
      render();
      startLiveTimer();
      return;
    }
    g.thinking=true;
    g.aiStartTime=Date.now();
    render();
    setTimeout(()=>{
      try{
        if(!g.thinking) return;
        const elapsed = Date.now() - g.aiStartTime;
        if(elapsed >= 5000){
          g.thinking=false;
          const humanMoves = validMoves(g.board,1);
          const aiMoves2 = validMoves(g.board,2);
          if(humanMoves.length>0){ 
            g.current=1; 
            g.passStreak++;
            g.statusNote = `<div class="pass-note">AIがパスしました（制限時間）</div>`;
            if(g.passStreak >= 2){
              endGame(g);
              sub[resultSubKey(g)] = 'result';
              render();
              return;
            }
          }
          else if(aiMoves2.length>0){
            render(); startLiveTimer();
            setTimeout(() => maybeTriggerAI(g), state.settings.animFlip ? flipAnimTotalMs(0) : 30);
            return;
          }
          else { endGame(g); sub[resultSubKey(g)] = 'result'; render(); return; }
          render();
          startLiveTimer();
          return;
        }
        const mv = aiChooseMove(g.board, 2, g.opts.aiDepth, g.opts.aiRnd, g.opts.boost, g.opts.aiGreedy);
        g.thinking=false;
        if(mv){
          g.board = applyMove(g.board, mv.row, mv.col, 2, mv.flips);
          g.moveCount++;
          g.animPlaced={row:mv.row,col:mv.col};
          g.animFlips=mv.flips;
          g.boardStates.push(g.board.map(row=>row.slice()));
          g.passStreak=0;
          playFlipSequence(mv.flips);
          const humanMoves = validMoves(g.board,1);
          const aiMoves2 = validMoves(g.board,2);
          if(humanMoves.length>0){ g.current=1; }
          else if(aiMoves2.length>0){
            render(); startLiveTimer();
            setTimeout(() => maybeTriggerAI(g), state.settings.animFlip ? flipAnimTotalMs(mv.flips.length) : 30);
            return;
          }
          else { endGame(g); sub[resultSubKey(g)] = 'result'; render(); return; }
        } else {
          // No move found - AI passes
          const humanMoves = validMoves(g.board,1);
          const aiMoves3 = validMoves(g.board,2);
          if(humanMoves.length>0){ 
            g.current=1; 
            g.passStreak++;
            g.statusNote = `<div class="pass-note">AIがパスしました</div>`;
            if(g.passStreak >= 2){
              endGame(g);
              sub[resultSubKey(g)] = 'result';
              render();
              return;
            }
          }
          else if(aiMoves3.length>0){
            render(); startLiveTimer();
            setTimeout(() => maybeTriggerAI(g), state.settings.animFlip ? flipAnimTotalMs(0) : 30);
            return;
          }
          else { endGame(g); sub[resultSubKey(g)] = 'result'; render(); return; }
        }
        render();
        startLiveTimer();
      }catch(err){
        console.error('AI error:', err);
        g.thinking=false;
        render();
      }
    }, 420);
  }catch(err){
    console.error('maybeTriggerAI error:', err);
    g.thinking=false;
    render();
  }
}
// 対局が終わったとき、結果画面を出すための sub のキー
function resultSubKey(g){
  if(g.opts && (g.opts.isFlip || g.opts.isFlipGate)) return 'flipside';
  if(g.mode === 'match') return 'match';   // handleMatchEnd が sub.ranker も合わせて設定する
  if(g.mode === 'event') return 'event';
  return g.mode === 'training' ? 'training' : g.mode === 'casual' ? 'casual' : 'variety';
}
// forcedScore を渡すと、実際の盤面の石数ではなく、その数値を最終スコアとして使う
// （競技モードで、時間切れ・投了により石差を確定させるときに使う）
function endGame(g, forcedScore){
  g.over=true;
  stopLiveTimer();
  stopMatchClock();
  let black, white;
  if(forcedScore){
    black = forcedScore.black; white = forcedScore.white;
  } else if(g.mode === 'match'){
    ({black, white} = countStonesMatch(g.board));   // 競技ルール：空きマスは勝者の総取り
  } else {
    ({black, white} = countStones(g.board));
  }
  const durationSec = Math.floor((Date.now()-g.startedAt)/1000);
  const entry = {
    timestamp: Date.now(),
    durationSec,
    moves: g.moveCount,
    boardStates: g.boardStates,
  };
  // FlipSide の対局は、通常の成績（通算・ランク・ゆるモードの記録）に混ぜない
  if(g.opts && (g.opts.isFlip || g.opts.isFlipGate)){ handleFlipEnd(g, entry, black, white); return; }
  // 競技モードの対局は、専用の記録に残し、通常の成績には混ぜない
  if(g.mode === 'match'){ handleMatchEnd(g, entry, black, white); return; }
  // イベントのハント対局も、専用の処理に流す
  if(g.mode === 'event'){ handleEventEnd(g, entry, black, white); return; }
  // 統計を更新
  state.totalGames = (state.totalGames || 0) + 1;
  if(g.mode==='battle'){
    entry.p1Name=state.settings.battle.p1; entry.p2Name=state.settings.battle.p2;
    entry.p1Score=black; entry.p2Score=white;
    entry.winner = black>white?'p1':(white>black?'p2':'draw');
    if(entry.winner==='p1') state.totalWins = (state.totalWins || 0) + 1;
    state.battleHistory.unshift(entry);
    g.lastResult=entry;
  } else if(g.mode==='training'){
    entry.myScore=black; entry.aiScore=white; entry.rankAtTime=rankLabel(state.training.rankIndex,state.training.xNumber);
    entry.speedLabel=speedLabel(durationSec,g.moveCount);
    entry.result = black>white?'win':(white>black?'lose':'draw');
    if(entry.result==='win'){
      state.totalWins = (state.totalWins || 0) + 1;
      state.training.winCount = (state.training.winCount || 0) + 1;
      const winsNeeded = winsRequiredForRank(state.training.rankIndex);
      if(state.training.winCount >= winsNeeded){
        // ランク昇格
        state.training.winCount = 0;
        if(state.training.rankIndex < RANK_LADDER.length-1) state.training.rankIndex++;
        else state.training.xNumber = Math.min(RANK_MAX_X-1, (state.training.xNumber||1)+1);
        state.playerRank = Math.min(999, state.playerRank+1);
      }
    } else {
      state.training.winCount = 0;
    }
    state.training.history.unshift(entry);
    g.lastResult=entry;
  } else if(g.mode==='casual'){
    entry.myScore=black; entry.aiScore=white; entry.difficulty=g.opts.diffName;
    entry.result = black>white?'win':(white>black?'lose':'draw');

    // Stella の挑戦は、通常の難易度とは別あつかいにする
    if(stellaChallengeActive){
      stellaChallengeWon = (entry.result === 'win');
      state.totalGames = (state.totalGames || 0) + 1;
      if(stellaChallengeWon) state.totalWins = (state.totalWins || 0) + 1;
      state.casual.history.unshift(entry);
      g.lastResult = entry;
      sub.casual = 'result';
      saveState();
      return;
    }

    // 難易度ごとの成績を記録する（未挑戦 → 敗北 → 勝利 → 完封 の順に上書き）
    state.casual.results = state.casual.results || {};
    const isPerfect = entry.result==='win' && white===0;   // 相手の石が無くなった＝完封
    const newMark = isPerfect ? 'perfect' : (entry.result==='win' ? 'won' : 'tried');
    const order = {tried:1, won:2, perfect:3};
    const prev = state.casual.results[g.opts.diffId];
    if(!prev || order[newMark] > (order[prev]||0)){
      state.casual.results[g.opts.diffId] = newMark;
      setTimeout(checkAutoTitles, 800);   // 称号の条件を満たしたか確かめる
    }

    if(entry.result==='win'){
      state.totalWins = (state.totalWins || 0) + 1;
      
      if(black-white>=5){
        const order = CASUAL_DIFFS.map(d=>d.id);
        const i = order.indexOf(g.opts.diffId);
        const nextD = CASUAL_DIFFS[i+1];
        if(nextD && !state.casual.unlocked[nextD.id]){
          state.casual.unlocked[nextD.id]=true;
          g.unlockedDiffId = nextD.id;
          g.unlockedDiffName = nextD.name;
          toast('「'+nextD.name+'」が解禁されました！');
        }
        state.playerRank = Math.min(999, state.playerRank+1);
      }
    }
    state.casual.history.unshift(entry);
    g.lastResult=entry;
  } else if(g.mode==='variety'){
    entry.myScore=black; entry.aiScore=white;
    entry.presetName = g.opts.varietyPresetId;
    entry.result = black>white?'win':(white>black?'lose':'draw');
    if(entry.result==='win'){
      state.totalWins = (state.totalWins || 0) + 1;
      state.playerRank = Math.min(999, state.playerRank+1);
    }
    state.variety.history = state.variety.history || [];
    state.variety.history.unshift(entry);
    g.lastResult=entry;
  }
  
  // ゲーム終了時に結果画面に遷移する状態をセット
  if(g.mode === 'battle') sub.battle = 'result';
  else if(g.mode === 'training') sub.training = 'result';
  else if(g.mode === 'casual') sub.casual = 'result';
  else if(g.mode === 'variety') sub.variety = 'result';
  else if(g.mode === 'training') sub.training = 'result';
  else if(g.mode === 'variety') sub.variety = 'result';
  else if(g.mode === 'casual') sub.casual = 'result';
  
  saveState();
}
function speedLabel(durationSec, moves){
  if(!moves) return 'ふつう';
  const avg = durationSec/moves;
  if(avg<2) return '超はやい';
  if(avg<4) return 'はやい';
  if(avg<7) return 'ふつう';
  if(avg<12) return 'ゆっくり';
  return '超ゆっくり';
}

function renderResultScreen(){

  let title, sub2;

  } else {
    title = r.result==='win'?'勝利しました':(r.result==='lose'?'敗北しました':'引き分けでした');
    sub2 = `あなた ${r.myScore} - ${r.aiScore} AI`;
  }
  
  return `
    <div class="hero" style="text-align:center;">
      <div class="hero-eyebrow">RESULT</div>
      <h2 style="font-size:22px;">${title}</h2>
      <p style="margin:0 auto;">${sub2}</p>
    </div>
    <div class="card">
      <div class="hist-meta">

function fmtDuration(sec){
  const m=Math.floor(sec/60), s=sec%60;
  return `${m}分${String(s).padStart(2,'0')}秒`;
}

function historyListFor(scope){
  if(scope==='battle')   return state.battleHistory || [];
  if(scope==='training') return (state.training && state.training.history) || [];
  if(scope==='casual')   return (state.casual && state.casual.history) || [];
  if(scope==='online')   return (state.online && state.online.history) || [];
  if(scope==='flip')     return (state.flipside && state.flipside.flip && state.flipside.flip.history) || [];
  if(scope==='variety')  return (state.variety && state.variety.history) || [];
  return [];
}
function viewLibrary(){
  if(sub.library==='replay') return renderReplayScreen();
  const tabs = [['battle','対戦'],['training','特訓'],['casual','ゆる'],['online','オンライン'],['variety','バラエティ']];
  if(!tabs.some(t => t[0] === libTab)) libTab = 'battle';   // 以前の「ストーリー」を開いていた場合
  const list = historyListFor(libTab);

  const items = list.map((e,i)=>renderHistItem(e,i)).join('');
  return `
    <div class="section-title">マイライブラリ</div>
    <div class="lib-tabs">
      ${tabs.map(([id,label])=>`<button class="lib-tab ${libTab===id?'active':''}" data-action="lib-tab" data-id="${id}">${label}</button>`).join('')}
    </div>
    ${list.length? items : `<div class="empty-note"><span class="em-glyph">♟</span>まだ対局の記録がありません</div>`}
  `;
}
function renderHistItem(e,i){
  if(libTab==='battle'){
    const pill = e.winner==='draw'?'draw':'win';
    const resTxt = e.winner==='draw'?'引き分け':(e.winner==='p1'?e.p1Name:e.p2Name)+'の勝ち';
    return `<div class="hist-item">
      <div class="hist-top"><span class="hist-title">${escapeHtml(e.p1Name)} vs ${escapeHtml(e.p2Name)}</span><span class="hist-date">${fmtDate(e.timestamp)}</span></div>
      <div class="hist-meta">
        <span><b>${e.p1Score}</b> - <b>${e.p2Score}</b></span>
        <span>${fmtDuration(e.durationSec)}</span>
        <span>${e.moves}手</span>
        <span class="result-pill ${pill}">${resTxt}</span>
      </div>
      <button class="btn btn-soft" data-action="watch-replay" data-scope="battle" data-idx="${i}">一手一手を再生する</button>
    </div>`;
  }
  if(libTab==='online'){
    const how = e.matchType==='code' ? '合言葉' : e.matchType==='invite' ? 'フレンド' : 'ランダム';
    const res = e.result==='win'?'勝ち':e.result==='lose'?'負け':'分け';
    const hasReplay = Array.isArray(e.boardStates) && e.boardStates.length > 0;
    return `<div class="hist-item">
      <div class="hist-top"><span class="hist-title">vs ${escapeHtml(e.oppName||'相手')}</span><span class="hist-date">${fmtDate(e.timestamp)}</span></div>
      <div class="hist-meta">
        <span><b>${e.myScore}</b> - <b>${e.aiScore}</b></span>
        ${e.durationSec!=null ? `<span>${fmtDuration(e.durationSec)}</span>` : ''}
        ${e.moves!=null ? `<span>${e.moves}手</span>` : ''}
        <span>${how}</span>
        <span>${e.myColor===2?'後手（白）':'先手（黒）'}</span>
        <span class="result-pill ${e.result==='win'?'win':(e.result==='lose'?'lose':'draw')}">${res}${e.abandoned?'（放棄）':''}</span>
      </div>
      <div class="file-actions">
        ${hasReplay ? `<button class="btn btn-soft" data-action="watch-replay" data-scope="online" data-idx="${i}">一手一手を再生する</button>` : ''}
        ${e.oppUid && isSignedIn() ? `<button class="btn btn-ghost" data-action="open-other" data-uid="${escapeHtml(e.oppUid)}" data-name="${escapeHtml(e.oppName||'')}">相手のマイページ</button>` : ''}
      </div>
    </div>`;
  }
  if(libTab==='training'){
    return `<div class="hist-item">
      <div class="hist-top"><span class="hist-title">特訓局（ランク ${e.rankAtTime}）</span><span class="hist-date">${fmtDate(e.timestamp)}</span></div>
      <div class="hist-meta">
        <span><b>${e.myScore}</b> - <b>${e.aiScore}</b></span>
        <span>${fmtDuration(e.durationSec)}</span>
        <span>${e.moves}手</span>
        <span>${e.speedLabel}</span>
        <span class="result-pill ${e.result==='win'?'win':(e.result==='lose'?'lose':'draw')}">${e.result==='win'?'勝ち':e.result==='lose'?'負け':'分け'}</span>
      </div>
      <button class="btn btn-soft" data-action="watch-replay" data-scope="training" data-idx="${i}">一手一手を再生する</button>
    </div>`;
  }
  // ゆるモードとバラエティは同じ形で並べる（見出しとリプレイの対象だけ変える）
  const title = libTab==='flip'
    ? `Flip（${escapeHtml(e.difficulty||'')}）`
    : libTab==='variety'
    ? `バラエティ（${escapeHtml(((VARIETY_RULES.find(r => r.id === e.presetName)) || {}).name || e.presetName || 'カスタム')}）`
    : `ゆる対局（${escapeHtml(e.difficulty||'')}）`;
  return `<div class="hist-item">
    <div class="hist-top"><span class="hist-title">${title}</span><span class="hist-date">${fmtDate(e.timestamp)}</span></div>
    <div class="hist-meta">
      <span><b>${e.myScore}</b> - <b>${e.aiScore}</b></span>
      <span>${fmtDuration(e.durationSec)}</span>
      <span>${e.moves}手</span>
      <span class="result-pill ${e.result==='win'?'win':(e.result==='lose'?'lose':'draw')}">${e.result==='win'?'勝ち':e.result==='lose'?'負け':'分け'}</span>
    </div>
    <button class="btn btn-soft" data-action="watch-replay" data-scope="${libTab==='flip'?'flip':(libTab==='variety'?'variety':'casual')}" data-idx="${i}">一手一手を再生する</button>
  </div>`;
}
function fmtDate(ts){
  const d=new Date(ts);
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

let replayState=null;
function openReplay(scope, idx){
  const entry = historyListFor(scope)[idx];
  if(!entry) return;
  if(!Array.isArray(entry.boardStates) || entry.boardStates.length===0){
    toast('古い対局のため、リプレイは残っていません');
    return;
  }
  replayState = {entry, step:0, playing:false};
  sub.library='replay';
  render();
}
function renderReplayScreen(){
  const {entry, step} = replayState;
  const states = Array.isArray(entry.boardStates) ? entry.boardStates : [];
  const total = states.length;
  const board = (step===0 || !states[step-1]) ? newBoard() : states[step-1];
  const cells=[];
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const v=board[r][c];
    cells.push(`<div class="cell">${v!==0?`<div class="stone ${v===1?'black':'white'}"></div>`:''}</div>`);
  }
  return `
    <div class="section-title">${ruby('対局','たいきょく',2)}リプレイ</div>
    <div class="board-wrap replay-board">
      <div class="board ${boardStyleClass()}">${cells.join('')}</div>
    </div>
    <div class="replay-step-label">${step} / ${total} 手目</div>
    <input class="replay-range" type="range" min="0" max="${total}" value="${step}" data-action="replay-seek">
    <div class="replay-ctrl">
      <button data-action="replay-first">⏮</button>
      <button data-action="replay-prev">◀</button>
      <button class="big" data-action="replay-play">${replayState.playing?'❚❚':'▶'}</button>
      <button data-action="replay-next">▶</button>
      <button data-action="replay-last">⏭</button>
    </div>
    <button class="btn btn-ghost" data-action="replay-close" style="margin-top:16px;">ライブラリに戻る</button>
  `;
}
let replayTimer=null;
function replayTick(){
  if(!replayState || !replayState.playing) return;
  const total = replayState.entry.boardStates.length;
  if(replayState.step>=total){ replayState.playing=false; render(); return; }
  replayState.step++;
  render();
  replayTimer=setTimeout(replayTick, 650);
}

function loadRankingIfNeeded(){

// 同じデータから複製されたアカウントが、ランキングに何件も並ばないようにする。
// 「同じ系統のデータ」または「成績がすべて同じ（対局20回以上）」のものは同一とみなし、1件だけ残す。
// 残すのは、ゲストでないほう → 先にアカウントを作ったほう（元のアカウント）の順
function rankingFingerprint(e){
  if((e.games || 0) < 20) return '';
  return [e.games, e.wins, e.casualUnlocked, e.flipUnlocked, e.trainingRankIndex, e.trainingXNumber, e.consecutiveLoginDays].join('|');
}
function dedupeRankingEntries(list){
  const parent = list.map((_, i) => i);
  const find = i => { while(parent[i] !== i){ parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
  const firstSeen = new Map();
  list.forEach((e, i) => {
    const keys = [];
    if(e.lineageId) keys.push('L:' + e.lineageId);
    const fp = rankingFingerprint(e);
    if(fp) keys.push('F:' + fp);
    for(const k of keys){
      if(firstSeen.has(k)) parent[find(i)] = find(firstSeen.get(k));
      else firstSeen.set(k, i);
    }
  });
  const better = (a, b) => {
    if(!!a.isGuest !== !!b.isGuest) return !a.isGuest;
    const ca = a.accountCreatedAt || Infinity, cb = b.accountCreatedAt || Infinity;
    if(ca !== cb) return ca < cb;
    return String(a.uid) < String(b.uid);
  };
  const best = new Map();
  list.forEach((e, i) => {
    const r = find(i);
    if(!best.has(r) || better(e, list[best.get(r)])) best.set(r, i);
  });
  const keep = new Set(best.values());
  return list.filter((e, i) => keep.has(i));
}
// 並べ替えに使う数値（ゆる解放度は、同数のときに FlipSide の解放度で細かく順位を付ける。
// ただし画面には出さない＝「内訳として含む」）
// 勝率のランキング用の点数。対局数が少ないほど「たまたま勝っただけ」の可能性が高いので、
// 信頼度を割り引いて点数にする（ウィルソン信頼区間の下限）。1戦1勝で100%が1位になる、といった偏りを防ぐ。
// 対局が増えるほど、実際の勝率に近い点数になる。画面に出すのは実際の勝率のまま
function winRateScore(wins, games){
  if(!games || games <= 0) return 0;
  const z = 1.96, n = games, p = Math.min(1, Math.max(0, (wins||0) / n));
  const z2 = z * z;
  const v = (p + z2/(2*n) - z * Math.sqrt(p*(1-p)/n + z2/(4*n*n))) / (1 + z2/n);
  return Math.min(1, Math.max(0, v));   // 浮動小数点の誤差で 0 を割らないように
}
function rankingScoreFor(kind, e){
  const games = e.games || 0;
  const winrate = winRateScore(e.wins, games);
  const trainingScore = ((e.trainingRankIndex||0) * 1000 + (e.trainingXNumber||0)) / (RANK_MAX_X + (RANK_LADDER.length)*1000);
  const casualScore = (e.casualUnlocked||0) / 100;
  const flipScore = (e.flipUnlocked||0) / 15;
  const loginScore = Math.min(e.consecutiveLoginDays||0, 365) / 365;
  switch(kind){
    case 'winrate': return games > 0 ? winrate : -1;
    case 'login': return e.consecutiveLoginDays || 0;
    case 'training': return (e.trainingRankIndex||0) * 1000 + (e.trainingXNumber||0);
    case 'casual': return (e.casualUnlocked||0) * 1000 + (e.flipUnlocked||0);
    case 'total':
    default: return trainingScore + casualScore + flipScore + winrate + loginScore;
  }
}
function rankingValueText(kind, e){
  switch(kind){
    case 'winrate': { const g=e.games||0; return g>0 ? `${Math.round((e.wins||0)/g*100)}%（${g}戦${e.wins||0}勝）` : '対局なし'; }
    case 'login': return `${e.consecutiveLoginDays||0}日`;
    case 'training': return rankLabel(e.trainingRankIndex||0, e.trainingXNumber||0);
    case 'casual': return `${e.casualUnlocked||0} / 100`;
    case 'total':
    default: return `ゆる ${e.casualUnlocked||0}/100・特訓 ${rankLabel(e.trainingRankIndex||0, e.trainingXNumber||0)}`;
  }
}
// ゲストで、5日以上ログインしていない場合は「非アクティブ」としてランキングに出さない
// （アカウントがある人は対象外。ずっと表示する）
function isStaleGuest(e){
  if(!e || !e.isGuest) return false;
  if(!e.lastLoginDate) return true;
  const last = new Date(e.lastLoginDate + 'T00:00:00');
  if(isNaN(last.getTime())) return true;
  // 時刻は無視して、カレンダー上の日付の差（日数）で判定する
  const now = new Date();
  const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diffDays = Math.round((todayMidnight.getTime() - last.getTime()) / 86400000);
  return diffDays > 5;
}
function viewRankerRanking(){
  if(!fbUid){
    if(firebaseConfigured()) ensureFirebase();   // ランキングを見るには接続が必要（ログアウト中なら、ここでゲストとして接続する）

  list = dedupeRankingEntries(list);

  return `
    <div class="hero" style="background:linear-gradient(150deg, #f2ac2b, #e8562f 80%);">
      <div class="hero-eyebrow">RANKING</div>
      <h2>ランキング</h2>

        <div class="trow-text"><b>モデレーターを含む</b><span>運営メンバーもランキングに表示します</span></div>

// 今がどのフェーズか：none(開催なし) | vote(投票期間) | hunt(イベント期間) | result(結果発表) | ended(完全終了)
function eventPhase(ev, now){
  now = now || Date.now();
  if(!ev || !ev.startAt) return 'none';
  const day = eventDayMs();
  const voteEnd = ev.startAt + (ev.voteDays||2)*day;
  const huntEnd = voteEnd + (ev.huntDays||3)*day;
  const resultEnd = huntEnd + (ev.resultDays||1)*day;
  if(now < ev.startAt) return 'none';
  if(now < voteEnd) return 'vote';
  if(now < huntEnd) return 'hunt';
  if(now < resultEnd) return 'result';
  return 'ended';
}

   O-LABO競技大会（公式ルール準拠のトーナメント大会）
   予告(1ヶ月前) → エントリー開始(2週間前) → 締切(3日前) → 組み合わせ公開(前日)
   → 1日目・2日目・3日目(決勝・配信) → 終了(報酬配布、結果は残る)
   ============================================================ */

function tournamentDayMs(){ return 86400000; }
// フェーズ：none(未公開) | announced(予告のみ) | entry(受付中) | bracket(組合せ公開・開催前)
//          | day1 | day2 | day3 | ended
function tournamentPhase(t, now){
  now = now || Date.now();
  if(!t || t.status !== 'published') return 'none';
  if(now < t.announceAt) return 'none';
  if(now < t.entryStartAt) return 'announced';
  if(now < t.entryEndAt) return 'entry';
  if(now < t.day1At) return 'bracket';
  if(now < t.day2At) return 'day1';
  if(now < t.day3At) return 'day2';
  if(now < t.endAt) return 'day3';
  return 'ended';
}

// ---- トーナメント表のしくみ -------------------------------------------------
// 参加者が奇数のラウンドでは、1人（1組）が「不戦勝」で次へ進む。2の累乗に揃えるための空き枠は作らない。
//   例）6人 → 3組(6人) → 2組(3人：1人は不戦勝) → 1組(2人：決勝) → 優勝(1人)
// 各対戦は {p1, p2, winner, bye, black, white, playedAt}。bye=true の対戦は p2 が空で、p1 が自動で勝ち上がる。
// 値がすべて空の対戦はデータベースに残らないため、bye は必ず true/false で書いておく。
function bracketAdvance(rounds, ri, i, winnerUid, changes){
  rounds[ri][i].winner = winnerUid;
  changes.push([ri, i, 'winner', winnerUid]);
  if(ri + 1 >= rounds.length) return;
  const ni = Math.floor(i/2), slot = (i % 2 === 0) ? 'p1' : 'p2';
  const nm = rounds[ri+1][ni];
  nm[slot] = winnerUid;
  changes.push([ri+1, ni, slot, winnerUid]);
  // 次の対戦が不戦勝の枠なら、そのまま続けて勝ち上がる
  if(nm.bye && slot === 'p1' && !nm.winner) bracketAdvance(rounds, ri+1, ni, winnerUid, changes);
}
function generateBracket(uids, names){
  const shuffled = uids.slice().sort(() => Math.random() - 0.5);
  const mk = (p1, p2, bye) => ({p1, p2, bye: !!bye, winner:null, black:null, white:null, playedAt:null});
  const r1 = [];
  for(let i=0;i<shuffled.length;i+=2){
    const hasPair = i+1 < shuffled.length;
    r1.push(mk(shuffled[i], hasPair ? shuffled[i+1] : null, !hasPair));
  }
  const rounds = [r1];
  while(rounds[rounds.length-1].length > 1){
    const prev = rounds[rounds.length-1], next = [];
    for(let j=0;j<prev.length;j+=2) next.push(mk(null, null, j+1 >= prev.length));
    rounds.push(next);
  }
  // 1回戦の不戦勝を、あらかじめ勝ち上がらせておく
  r1.forEach((m, i) => { if(m.bye) bracketAdvance(rounds, 0, i, m.p1, []); });
  return {rounds, total: shuffled.length, names: names||{}};
}
// データベースから読んだトーナメント表を、配列の形にそろえる
function normalizeBracket(b){
  if(!b) return b;
  const toArr = x => Array.isArray(x) ? x : (x && typeof x === 'object' ? Object.keys(x).sort((a,c)=>a-c).map(k=>x[k]) : []);
  const rounds = toArr(b.rounds).map(r => toArr(r).map(m => Object.assign({p1:null, p2:null, winner:null, bye:false}, m || {})));
  return Object.assign({}, b, {rounds});
}

// 開催日ごとに行うラウンド：3日目＝決勝、2日目＝準決勝、それより前のラウンドは1日目
function tournamentRoundIdxsForPhase(t, phase){
  if(!t || !t.bracket || !t.bracket.rounds) return [];
  const total = t.bracket.rounds.length, last = total - 1, semi = total - 2;
  if(phase === 'day3') return [last];
  if(phase === 'day2') return semi >= 0 ? [semi] : [];
  if(phase === 'day1'){ const a = []; for(let i=0;i<semi;i++) a.push(i); return a; }
  return [];
}
// 自分が今の日に対局すべき相手を、トーナメント表から探す（両方の選手が決まっていて、まだ決着していない対戦）
function tournamentFindMyMatch(t, roundIdxs){
  if(!t || !t.bracket || !t.bracket.rounds) return null;
  const list = Array.isArray(roundIdxs) ? roundIdxs : [roundIdxs];
  for(const ri of list){
    const round = t.bracket.rounds[ri];
    if(!round) continue;
    for(let i=0;i<round.length;i++){
      const m = round[i];
      if(!m || m.winner || m.bye || !m.p1 || !m.p2) continue;
      if(m.p1 === fbUid || m.p2 === fbUid) return { round: ri, idx: i, match: m };
    }
  }
  return null;
}
function tournamentNameOf(t, uid, isBye){
  if(!uid) return isBye ? '不戦勝' : '勝者未定';
  if(t.bracket && t.bracket.names && t.bracket.names[uid]) return t.bracket.names[uid];
  if(tournamentParticipants && tournamentParticipants[uid]) return tournamentParticipants[uid].name || 'プレイヤー';
  return 'プレイヤー';
}
function tournamentRoundLabel(total, idx){
  const fromEnd = total - 1 - idx;
  if(fromEnd === 0) return '決勝';
  if(fromEnd === 1) return '準決勝';
  return `${idx+1}回戦`;
}
function bracketMarkup(t){
  if(!t.bracket) return '';
  const rounds = t.bracket.rounds;
  const lastRound = rounds[rounds.length-1];

  return `<div class="bracket-wrap">${rounds.map((round, ri) => `

// 開催中は、他の人の対局結果（勝ち上がり）が見られるよう、ときどきトーナメント表を読み直す

// ---- 対戦相手との日程調整（時間と絵文字のリアクションだけをやり取りする）----
// 保存先：tourSchedule/<2人のuidを並べた鍵>/messages/<id> と reactions/<id>/<uid>。大会が終わったら管理者側で消す
const TSCHED_EMOJIS = ['⭕️','❌','👍','🙏','🙇','😊'];
const TSCHED_MAX_MY_MESSAGES = 40;
let tourSched = { key:null, ref:null, refR:null, msgs:{}, reacts:{}, error:false, ctx:null };
function tsFmtMin(m){ return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); }
function tsRangeText(r){ return tsFmtMin(r.s) + '〜' + (r.e != null ? tsFmtMin(r.e) : ''); }
function tsParseTime(v){ const m = /^(\d{1,2}):(\d{2})$/.exec(v || ''); if(!m) return null; const h = +m[1], mi = +m[2]; return (h < 24 && mi < 60) ? h*60+mi : null; }
function tsToArr(x){ return Array.isArray(x) ? x.filter(Boolean) : (x && typeof x === 'object' ? Object.keys(x).sort((a,b)=>a-b).map(k=>x[k]) : []); }
// 2人それぞれの「出られる時間」の重なり（終わりが無い時間は24:00まで）
function tsIntersect(a, b){
  const out = [];
  a.forEach(x => b.forEach(y => {
    const s = Math.max(x.s, y.s);
    const bothOpen = x.e == null && y.e == null;
    const e = Math.min(x.e == null ? 1440 : x.e, y.e == null ? 1440 : y.e);
    if(s < e || bothOpen) out.push({ s, e: bothOpen ? null : e });
  }));
  out.sort((p,q) => p.s - q.s);
  return out;
}
function tournamentFindMyPendingMatch(t){
  if(!t || !t.bracket || !t.bracket.rounds || !fbUid) return null;
  const rounds = t.bracket.rounds;
  for(let ri=0; ri<rounds.length; ri++){
    for(let i=0; i<rounds[ri].length; i++){
      const m = rounds[ri][i];
      if(!m || m.winner || m.bye || !m.p1 || !m.p2) continue;
      if(m.p1 === fbUid || m.p2 === fbUid) return { round: ri, idx: i, match: m };
    }
  }
  return null;
}
// そのラウンドを行う日（決勝＝3日目、準決勝＝2日目、それ以前＝1日目）
function tournamentMatchDateMs(t, ri){
  const total = t.bracket.rounds.length;
  return ri === total - 1 ? t.day3At : ri === total - 2 ? t.day2At : t.day1At;
}
function tsFmtDate(ms){
  if(!ms) return '';
  const d = new Date(ms);
  return `${d.getMonth()+1}月${d.getDate()}日(${'日月火水木金土'[d.getDay()]})`;
}
function tourSchedDetach(){
  try{ if(tourSched.ref) tourSched.ref.off(); if(tourSched.refR) tourSched.refR.off(); }catch(e){}
  tourSched = { key:null, ref:null, refR:null, msgs:{}, reacts:{}, error:false, ctx:null };
}
function tourSchedAttach(key){
  if(tourSched.key === key || !fbDb) return;
  tourSchedDetach();
  tourSched.key = key;
  tourSched.ref = fbDb.ref('tourSchedule/' + key + '/messages');
  tourSched.refR = fbDb.ref('tourSchedule/' + key + '/reactions');
  const onErr = () => { tourSched.error = true; tourSchedUpdate(); };
  tourSched.ref.on('value', snap => { tourSched.msgs = snap.val() || {}; tourSched.error = false; tourSchedUpdate(); }, onErr);
  tourSched.refR.on('value', snap => { tourSched.reacts = snap.val() || {}; tourSchedUpdate(); }, onErr);
}
function tourSchedUpdate(){
  const el = document.getElementById('tourSchedBody');

}
function tourSchedSortedMsgs(){
  return Object.keys(tourSched.msgs || {}).map(id => Object.assign({ id }, tourSched.msgs[id])).filter(m => m && m.uid && m.type)
    .sort((a,b) => (a.at||0) - (b.at||0) || (a.id < b.id ? -1 : 1));
}
function tourSchedBodyMarkup(){
  const ctx = tourSched.ctx;
  if(!ctx) return '';
  if(tourSched.error) return `<p class="tsched-sub">日程調整はまだ準備中です（しばらくしてから、もう一度開いてください）。</p>`;
  const msgs = tourSchedSortedMsgs();
  const reacts = tourSched.reacts || {};
  const nameOf = uid => uid === fbUid ? 'あなた' : ctx.oppName;
  // 最新の「出られる時間」を、2人それぞれから取り出す
  const latest = {};
  msgs.forEach(m => { if(m.type === 'avail') latest[m.uid] = tsToArr(m.ranges); });
  // 決定：最後の提案に、提案者ではない側から ⭕️ が付いているとき
  const proposals = msgs.filter(m => m.type === 'propose');
  const lastP = proposals[proposals.length - 1];
  let decided = null;
  if(lastP){
    const rs = reacts[lastP.id] || {};
    if(Object.keys(rs).some(u => u !== lastP.uid && rs[u] === '⭕️')) decided = lastP;
  }
  let head = '';
  if(decided){
    head += `<div class="tsched-decided">🎉 対局の時間が決まりました<br>${escapeHtml(tsFmtDate(ctx.dateMs))} ${tsFmtMin(decided.start)}〜</div>`;
  } else if(latest[fbUid] && latest[ctx.oppUid]){
    const ov = tsIntersect(latest[fbUid], latest[ctx.oppUid]);
    head += ov.length
      ? `<div class="tsched-overlap">お互いに出られる時間：<b>${ov.map(tsRangeText).join('、')}</b><br>この中で、細かい開始時間を決めましょう。</div>`
      : `<div class="tsched-overlap">いまのところ、お互いの時間が重なっていません。相手の時間に合わせて、開始時間を提案してみましょう。</div>`;
  } else if(latest[fbUid] && !latest[ctx.oppUid]){
    head += `<div class="tsched-overlap">相手が「出られる時間」を送るのを待っています。</div>`;
  }
  const items = msgs.map(m => {
    const mine = m.uid === fbUid;
    const body = m.type === 'avail'
      ? `<div class="tsched-time">${tsToArr(m.ranges).map(tsRangeText).join('、')}</div><div class="tsched-who" style="margin:2px 0 0;">出られる時間</div>`
      : `<div class="tsched-time">${tsFmtMin(m.start)}〜</div><div class="tsched-who" style="margin:2px 0 0;">この時間で始めませんか？</div>`;
    const rs = reacts[m.id] || {};
    const chips = Object.keys(rs).map(u => `<span class="tsched-chip is-static" title="${escapeHtml(nameOf(u))}">${escapeHtml(rs[u])}<span style="font-size:10px; color:var(--ink-soft);"> ${escapeHtml(nameOf(u))}</span></span>`).join('');
    // 自分のメッセージには反応できない。相手のメッセージには絵文字でリアクションできる
    const picker = mine ? '' : (m.type === 'propose' ? TSCHED_EMOJIS : TSCHED_EMOJIS.slice(2)).map(e => `<button class="tsched-chip ${rs[fbUid]===e?'is-on':''}" data-action="tsched-react" data-mid="${escapeHtml(m.id)}" data-emoji="${e}">${e}</button>`).join('');
    return `<div class="tsched-msg ${mine?'is-me':''}">
      <div class="tsched-who">${escapeHtml(nameOf(m.uid))}</div>${body}
      ${(chips || picker) ? `<div class="tsched-react">${chips}${picker ? `<span style="flex-basis:100%; height:0;"></span>${picker}` : ''}</div>` : ''}
    </div>`;
  }).join('');
  return head + (items ? `<div class="tsched-list" id="tourSchedList">${items}</div>` : `<p class="tsched-sub">まだやり取りはありません。まずは、あなたが出られる時間を送りましょう。</p>`);
}
function tourSchedCardMarkup(t, phase){
  if(tournamentIsOffline(t) || !fbUid || !tournamentMyEntry()) { tourSchedDetach(); return ''; }
  if(phase !== 'bracket' && phase !== 'day1' && phase !== 'day2' && phase !== 'day3'){ tourSchedDetach(); return ''; }
  const found = tournamentFindMyPendingMatch(t);
  if(!found){ tourSchedDetach(); return ''; }
  const oppUid = found.match.p1 === fbUid ? found.match.p2 : found.match.p1;
  const key = [fbUid, oppUid].sort().join('_');
  tourSchedAttach(key);
  tourSched.ctx = { oppUid, oppName: tournamentNameOf(t, oppUid, false), dateMs: tournamentMatchDateMs(t, found.round), round: found.round };

  const row = i => `<div class="tsched-row"><input type="time" id="tsStart${i}" aria-label="開始"><span>〜</span><input type="time" id="tsEnd${i}" aria-label="終了（空欄でもOK）"></div>`;

        <p class="tsched-sub" style="margin:0 0 6px;"><b>出られる時間を送る</b>（終わりの時間は空欄でもOK。時間帯は3つまで）</p>
        ${row(0)}${row(1)}${row(2)}
        <button class="btn btn-soft" data-action="tsched-send-avail" style="width:100%;">出られる時間を送る</button>
        <p class="tsched-sub" style="margin:12px 0 6px;"><b>この時間に始めよう、と提案する</b></p>
        <div class="tsched-row"><input type="time" id="tsPropose" aria-label="開始時間"><span>〜</span>
          <button class="btn btn-accent" data-action="tsched-propose" style="flex:1;">提案する</button></div>
      </div>
    </div>`;
}
async function tourSchedSend(msg){
  if(!tourSched.ref || !fbUid) return false;
  const mine = tourSchedSortedMsgs().filter(m => m.uid === fbUid).length;
  if(mine >= TSCHED_MAX_MY_MESSAGES){ toast('送れる回数の上限に達しました'); return false; }
  try{
    await tourSched.ref.push(Object.assign({ uid: fbUid, at: firebase.database.ServerValue.TIMESTAMP }, msg));
    return true;
  }catch(err){ toast('送信できませんでした'); return false; }
}
async function tourSchedSendAvail(){
  const ranges = [];
  for(let i=0;i<3;i++){
    const sEl = document.getElementById('tsStart'+i), eEl = document.getElementById('tsEnd'+i);
    const s = tsParseTime(sEl && sEl.value), e = tsParseTime(eEl && eEl.value);
    if(s === null){ if(e !== null){ toast('開始の時間も入れてください'); return; } continue; }
    if(e !== null && e <= s){ toast('終わりの時間は、開始より後にしてください'); return; }
    ranges.push(e === null ? { s } : { s, e });
  }
  if(!ranges.length){ toast('出られる時間を入れてください'); return; }
  ranges.sort((a,b) => a.s - b.s);
  if(await tourSchedSend({ type:'avail', ranges })){
    for(let i=0;i<3;i++){ ['tsStart','tsEnd'].forEach(p => { const el = document.getElementById(p+i); if(el) el.value = ''; }); }
    toast('送りました');
  }
}
async function tourSchedPropose(){
  const el = document.getElementById('tsPropose');
  const start = tsParseTime(el && el.value);
  if(start === null){ toast('開始の時間を入れてください'); return; }
  if(await tourSchedSend({ type:'propose', start })){ el.value = ''; toast('提案しました'); }
}
async function tourSchedReact(mid, emoji){
  if(!tourSched.key || !fbUid || !TSCHED_EMOJIS.includes(emoji)) return;

}
