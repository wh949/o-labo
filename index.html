// 大会の対局を開始する（オンライン対局として、合言葉形式の専用部屋を使う）
async function tournamentStartMatch(){
  const t = tournamentData;
  if(!t) return;
  if(tournamentIsOffline(t)){ toast('この大会はオフライン開催です。会場で対局してください'); return; }
  const phase = tournamentPhase(t);
  const found = tournamentFindMyMatch(t, tournamentRoundIdxsForPhase(t, phase));
  if(!found) return;
  const roundIdx = found.round;
  if(!(await ensureFirebase())){ toast(fbInitError); return; }
  const oppUid = found.match.p1 === fbUid ? found.match.p2 : found.match.p1;
  const roomId = 'tour_' + (t.id || 'current') + '_' + roundIdx + '_' + found.idx;
  const myName = profileName() || 'プレイヤー';
  onlineState.myName = myName;
  onlineState.mode = 'code';
  onlineState.isMatch = true;
  onlineState.matchTimeLimitSec = t.timeLimitSec || 1500;
  onlineState.isTournament = true;
  onlineState.tournamentRound = roundIdx;
  onlineState.tournamentIdx = found.idx;
  onlineState.tournamentOppName = tournamentNameOf(t, oppUid, false);
  onlineState.tournamentRoundLabel = tournamentRoundLabel(t.bracket.rounds.length, roundIdx);
  // 相手が来るまで待つ画面を出す（'play' のままだと、対局がまだ無いので競技の設定画面に戻ってしまう）
  onlineState.phase = 'connecting';
  sub.match = 'online-wait';
  render();
  try{
    const ref = fbDb.ref('rooms/' + roomId);
    const res = await ref.transaction(room => {
      if(room === null){
        return {
          status:'waiting', createdAt: Date.now(),
          host:{uid:fbUid, name:myName},
          board: boardToStr(newBoard()), turn:1, passStreak:0, moveCount:0,
          isMatch:true, isTournament:true, timeLimitSec: t.timeLimitSec||1500,
          timeLeftBlack: t.timeLimitSec||1500, timeLeftWhite: t.timeLimitSec||1500
        };
      }
      if(room.host && room.host.uid === fbUid) return room;
      if(room.guest && room.guest.uid === fbUid) return room;
      if(room.status === 'waiting' && !room.guest){
        room.guest = {uid:fbUid, name:myName};
        room.status = 'playing';
        room.startedAt = Date.now();
        return room;
      }
      return room;
    });
    const room = res.snapshot.val();
    onlineState.myColor = (room.host && room.host.uid === fbUid) ? 1 : 2;
    onlineState.roomId = roomId;
    onlineAttachRoom(roomId);
  }catch(err){
    console.error(err);
    toast('対局を開始できませんでした');
    navigate(()=>{ sub.match = 'tournament'; });
  }
}

/* ============================================================
   11. save export / import ("encrypted" txt)
   ============================================================ */
function encodeSave(obj){
  const json = JSON.stringify(obj);
  const bytes = new TextEncoder().encode(json);
  let bin = '';
  for(let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  const b64 = btoa(bin);
  const reversed = b64.split('').reverse().join('');
  const shifted = reversed.split('').map(ch=>String.fromCharCode(ch.charCodeAt(0)+7)).join('');
  return 'GENSEKI-OTHELLO-SAVE::' + btoa(shifted);
}
function decodeSave(text){
  const marker='GENSEKI-OTHELLO-SAVE::';
  const idx = text.indexOf(marker);
  if(idx===-1) throw new Error('セーブデータの形式が正しくありません');
  const payload = text.slice(idx+marker.length).trim();
  try {
    const shifted = atob(payload);
    const reversed = shifted.split('').map(ch=>String.fromCharCode(ch.charCodeAt(0)-7)).join('');
    const b64 = reversed.split('').reverse().join('');
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const json = new TextDecoder('utf-8').decode(bytes);
    return JSON.parse(json);
  } catch(err) {
    console.error('Decode error:', err);
    throw new Error('セーブデータの形式が正しくありません: ' + err.message);
  }
}
function exportSave(scope){
  let payload, filename;
  const stamp = new Date().toISOString().slice(0,10).replace(/-/g,'');
  if(scope==='all'){ payload=state; filename=`genseki_othello_save_${stamp}.txt`; }
  else if(scope==='training'){ payload={training:state.training}; filename=`genseki_othello_training_${stamp}.txt`; }
  else if(scope==='casual'){ payload={casual:state.casual}; filename=`genseki_othello_casual_${stamp}.txt`; }
  const text = encodeSave(payload);
  const blob = new Blob([text], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  toast('セーブデータを書き出しました');
}
function importSave(scope){
  const input = document.getElementById('importFile');
  input.onchange = ()=>{
    const file = input.files[0];
    if(!file) return;
    if(file.size > 20*1024*1024){ toast('ファイルサイズが20MBを超えています'); return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = decodeSave(reader.result);
        if(scope==='all'){
          state = deepMerge(structuredClone(DEFAULT_STATE), data);
        } else if(scope==='training' && data.training){
          state.training = deepMerge(structuredClone(DEFAULT_STATE.training), data.training);
        } else if(scope==='casual' && data.casual){
          state.casual = deepMerge(structuredClone(DEFAULT_STATE.casual), data.casual);
        } else {
          toast('この画面のデータ形式ではありません'); return;
        }
        stampLocalOwner();
        ensureLineage();
        saveState();
        toast('セーブデータを読み込みました');
        render();
      }catch(e){
        toast('読み込みに失敗しました。ファイルを確認してください');
      }
    };
    reader.readAsText(file);
    input.value='';
  };
  input.click();
}

let navTimer=null;
let pendingSheetCallback=null; // for modal start choice callbacks
let pendingSheetData=null;     // for passing data to callbacks
function applyTheme(theme){
  const root = document.documentElement;
  if(theme === 'dark'){
    root.setAttribute('data-theme', 'dark');
  } else if(theme === 'light'){
    root.setAttribute('data-theme', 'light');
  } else {
    // device: remove attribute to use system preference
    root.removeAttribute('data-theme');
  }
}
function navigate(mutateFn, afterFn){
  window.scrollTo(0, 0);  // スクロール初期化
  const root = document.getElementById('view-root');
  if(!state.settings.animTransition || !root){
    mutateFn(); render(); if(afterFn) afterFn();
    return;
  }
  clearTimeout(navTimer);
  root.style.transition = 'transform .16s cubic-bezier(.4,0,1,1), opacity .16s cubic-bezier(.4,0,1,1)';
  root.style.transform = 'translateX(-22px)';
  root.style.opacity = '0';
  navTimer = setTimeout(()=>{
    mutateFn();
    render();
    const r2 = document.getElementById('view-root');
    r2.style.transition = 'none';
    r2.style.transform = 'translateX(22px)';
    r2.style.opacity = '0';
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        r2.style.transition = 'transform .34s cubic-bezier(.16,1,.3,1), opacity .28s cubic-bezier(.16,1,.3,1)';
        r2.style.transform = 'translateX(0)';
        r2.style.opacity = '1';
      });
    });
    if(afterFn) afterFn();
  }, 150);
}

// 設定画面から効果音を試聴するときは、今のコンテキスト（ホーム／対局中）に関わらず、
// そのスライダー・トグルが表す方の音量を直接使って鳴らす
async function previewSE(seName, volume01){
  const ctx = await initAudioContext();
  if(!ctx || ctx.state === 'suspended') return;
  const buffer = await loadAudioFile('se', seName);
  if(!buffer) return;
  try{
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    const gain = ctx.createGain();
    gain.gain.value = volume01;
    source.connect(gain);
    gain.connect(ctx.destination);
    source.start(0);
  }catch(err){ console.warn('効果音の再生に失敗:', err); }
}

      saveMyProfile({displayName: nm.trim(), bio: bi, birthMonth: bm, birthDay: bd, birthPublic: bp}).then(ok => {
        profileBusy = false;
        toast(ok ? 'プロフィールを保存しました' : '保存できませんでした');
        publishStats();
        render();
      });
      break;
    }
    case 'link-google': linkGoogle(); break;
    case 'link-email-open': accountFormMode = 'link'; navigate(()=>{ sub.settings='account'; }); break;
    case 'send-auth-mail': sendAuthMail(); break;
    case 'refresh-email-auth': refreshEmailAuth(true); break;
    case 'go-email-auth': navigate(()=>{ activeTab = 'settings'; sub.settings = 'home'; }); break;
    case 'link-email-do': {
      const le = (document.getElementById('accEmail')||{}).value || '';
      const lp = (document.getElementById('accPass')||{}).value || '';
      if(!le.trim() || !lp){ toast('メールアドレスとパスワードを入力してください'); break; }
      linkEmail(le.trim(), lp);
      break;
    }
    case 'friend-invite': friendInvite(el.dataset.uid, el.dataset.name); break;
    case 'invite-accept': acceptInvite(el.dataset.id); break;
    case 'invite-decline': declineInvite(el.dataset.id); break;
    case 'export-save': exportSave(el.dataset.scope); break;
    case 'import-save': importSave(el.dataset.scope); break;
    case 'reset-settings':
      state.settings = structuredClone(DEFAULT_STATE.settings);
      saveState(); toast('設定をデフォルトに戻しました'); render(); break;
    case 'delete-cache': showConfirmDeleteCache(); break;
    case 'confirm-delete-1': showConfirmDeleteCache2(); break;
    case 'confirm-delete-2':
      localStorage.removeItem('genseki_othello_save_v1');
      state = structuredClone(DEFAULT_STATE);
      closeSheet(); toast('キャッシュを削除しました'); render(); break;
    case 'close-sheet': closeSheet(); break;
    case 'toggle-ranking-moderators':
      state.settings.rankingShowModerators = !state.settings.rankingShowModerators;
      saveState(); render();
      break;
    case 'match-vstype': matchVsType = el.dataset.v; render(); break;
    case 'match-ailevel': matchAiLevel = el.dataset.v; render(); break;
    case 'match-time': matchTimeSec = parseInt(el.dataset.v, 10) || 600; render(); break;
    case 'match-start': startMatch(); break;
    case 'match-online-start': startMatchOnline(); break;
    case 'match-online-cancel': {
      const wasTour = !!onlineState.isTournament;
      onlineLeave();
      onlineState.isTournament = false; onlineState.tournamentRound = undefined; onlineState.tournamentIdx = undefined;
      navigate(()=>{ sub.match = wasTour ? 'tournament' : 'setup'; onlineState.isMatch = false; });
      break;
    }
    case 'match-tournament-back':
      tournamentData = null;   // 結果を反映した最新の表を読み直す
      navigate(()=>{ game = null; sub.match = 'tournament'; });
      break;
    case 'go-tournament':
      navigate(()=>{ activeTab='ranker'; currentRankerMode='match'; sub.match = 'tournament'; });
      break;
    case 'tournament-enter': tournamentEnter(); break;
    case 'tournament-play': tournamentStartMatch(); break;
    case 'tsched-send-avail': tourSchedSendAvail(); break;
    case 'tsched-propose': tourSchedPropose(); break;
    case 'tsched-react': tourSchedReact(el.dataset.mid, el.dataset.emoji); break;
    case 'tournament-claim-reward': tournamentClaimReward(); break;
    case 'match-again':
      navigate(()=>{ game = null; sub.match = 'setup'; }, ()=> startMatch());
      break;
    case 'match-setup-back':
      navigate(()=>{ game = null; sub.match = 'setup'; });
      break;
    case 'event-join-begin': eventJoinStep = 'choose'; render(); break;
    case 'event-create-group-start': eventJoinStep = 'create-group'; render(); break;
    case 'event-join-group-start': eventJoinStep = 'join-group'; render(); break;
    case 'event-join-back':
      eventJoinStep = (eventJoinStep === 'join-password') ? 'join-group' : 'choose';
      render();
      break;
    case 'event-join-solo': eventJoinSolo(); break;
    case 'event-create-group-submit': eventCreateGroup(); break;
    case 'event-pick-group':
      eventSelectedGroupId = el.dataset.gid;
      eventJoinStep = 'join-password';
      render();
      break;
    case 'event-join-group-submit': eventJoinGroupSubmit(); break;
    case 'event-hunt': eventDoHunt(); break;
    case 'event-hunt-back':
      navigate(()=>{ game = null; sub.event = 'hunt'; });
      break;
    case 'event-claim-reward': eventClaimReward(); break;
    case 'go-event':
      navigate(()=>{ activeTab = 'ranker'; currentRankerMode = 'event'; });
      break;
    case 'event-view-group-members': {
      const g = (eventGroups||{})[el.dataset.gid];
      const members = (eventParticipantsAll||[]).filter(e => e.groupId === el.dataset.gid);
      showSheet(`
        <h3>${escapeHtml((g&&g.name)||'グループ')}のメンバー</h3>
        <div style="max-height:260px; overflow-y:auto;">
          ${members.length ? members.map(m=>`<div class="rank-row"><span class="rank-name">${escapeHtml(m.name||'プレイヤー')}</span></div>`).join('') : '<p style="text-align:center; color:var(--ink-soft);">まだメンバーがいません</p>'}
        </div>
        <button class="btn btn-ghost" data-action="close-sheet" style="width:100%; margin-top:10px;">閉じる</button>
      `);
      break;
    }
    case 'save-conflict-use-cloud':
      closeSheet();
      if(pendingSyncCloud){
        applyCloudSave(pendingSyncCloud);
        pendingSyncCloud = null;
        toast('アカウントの記録を読み込みました');
        render();
      }
      break;
    case 'save-conflict-use-local':
      closeSheet();
      pendingSyncCloud = null;
      cloudSaveNow().then(ok => toast(ok ? 'この端末の記録をアカウントに保存しました' : '保存できませんでした'));
      break;
    case 'confirm-sheet-choice':
      const sheetType = el.dataset.sheetType;
      let selectedValue = null;
      if(sheetType === 'training'){
        const chosen = document.querySelector('[data-training-start-choice]:checked');
        selectedValue = chosen ? chosen.value : 'black';
      } else if(sheetType === 'casual'){
        const chosen = document.querySelector('[data-casual-start-choice]:checked');
        selectedValue = chosen ? chosen.value : 'black';
      }
      closeSheet();
      if(selectedValue){
        const isBlack = selectedValue === 'black';
        if(sheetType === 'training'){
          const t = state.training;
          const depth = trainingDepthForRank(t.rankIndex, t.xNumber);
          doStartTraining(depth, isBlack);
        } else if(sheetType === 'casual' && pendingSheetData){
          const d = pendingSheetData.difficulty;
          if(pendingSheetData.isFlip) doStartFlip(d, isBlack);   // FlipSide の対局
          else doStartCasual(d, isBlack);
          pendingSheetData = null;
        }
        pendingSheetCallback = null;
      }
      break;
    case 'overlay-bg': if(e.target===el) closeSheet(); break;
  }
  }catch(err){
    console.error('Click handler error:', err);
  }
});
document.addEventListener('change', (e)=>{
  try{
    const el = e.target.closest('[data-action]');
    if(!el) return;
    if(el.dataset.action==='toggle-anim-flip'){ state.settings.animFlip=el.checked; saveState(); render(); }
    if(el.dataset.action==='toggle-anim-trans'){ state.settings.animTransition=el.checked; saveState(); render(); }
    if(el.dataset.action==='toggle-timer'){ state.settings.showTimer=el.checked; saveState(); render(); }
    if(el.dataset.action==='toggle-casual-hint'){ state.casual.showHints=el.checked; saveState(); render(); }
    if(el.dataset.action==='toggle-allow-pass'){ state.settings.allowPass=el.checked; saveState(); render(); }
    if(el.dataset.action==='replay-seek'){ replayState.step=parseInt(el.value); render(); }
  }catch(err){
    console.error('Change handler error:', err);
  }
});
document.addEventListener('input', (e)=>{
  try{
    if(e.target.id==='p1name'){ state.settings.battle.p1=e.target.value; }
    if(e.target.id==='p2name'){ state.settings.battle.p2=e.target.value; }
    if(e.target.id==='setP1'){ state.settings.battle.p1=e.target.value; saveState(); }
    if(e.target.id==='setP2'){ state.settings.battle.p2=e.target.value; saveState(); }
    if(e.target.id==='usernameInput'){ state.username=e.target.value; saveState(); }
  }catch(err){
    console.error('Input handler error:', err);
  }
});

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

/* ============================================================
   14. boot
   ============================================================ */
// ズーム・スクロール防止（対局中のみ）
document.addEventListener('wheel', (e)=>{ if(game && e.ctrlKey) e.preventDefault(); }, {passive:false});
document.addEventListener('touchmove', (e)=>{
  if(game && e.touches.length>1) e.preventDefault();
}, {passive:false});
document.addEventListener('gesturestart', (e)=>{ if(game) e.preventDefault(); }, {passive:false});
// ダブルタップズーム防止（対局中のみ）
let lastTouchEnd = 0;
document.addEventListener('touchend', (e)=>{
  if(!game) return;
  const now = Date.now();
  if(now - lastTouchEnd <= 300){ e.preventDefault(); }
  lastTouchEnd = now;
}, {passive:false});
applyTheme(state.settings.theme);
render();
if(dedupeOnlineHistory() > 0) saveState();
preloadAudioFiles();
setupAudioUnlock();
// アカウント状態と招待を受け取れるよう、開いた時点で接続する
if(firebaseConfigured()) ensureFirebase({passive:true});
// 開いた時点でBGMを鳴らす（スマホでは最初の操作の直後に鳴り出す）
updateBGM(true);
</script>
</body>
</html>
